name: Build, Scan and Push to ECR

on:
  push:
    branches: [ dev, main ]

jobs:
  filter-updated-directories:
    uses: ./.github/workflows/path_filter.yaml

  build-scan-push:
    runs-on: ubuntu-24.04
    environment: >-
      ${{ (github.ref_name == 'main' || github.base_ref == 'main')
      && 'production'
      || 'development' }}
    needs: filter-updated-directories
    if: ${{ needs.filter-updated-directories.outputs.dir_changed != '[]' && needs.filter-updated-directories.outputs.dir_changed != '' }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
      id-token: write
    strategy:
      matrix:
        dir: ${{ fromJson(needs.filter-updated-directories.outputs.dir_changed) }}
      fail-fast: false
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.dir }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      AWS_REGION: us-east-2
      CICD_BUCKET: ${{ vars.CICD_ARTIFACT_BUCKET }}
      AWS_ECR_ROLE_ARN: ${{ vars.ECRGITHUBHUBACTIONSOIDCROLE }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      BRANCH_NAME: ${{ github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: ${{ env.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set short SHA and report date
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV
          echo "REPORT_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Install task
        uses: ./.github/actions/install_task

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@c962da2960ed15f492addc26fffa274485265950

      - name: Get image repo
        id: get_image_repo
        run: |
          REPO_NAME=$(task -t .github/workflows/utils/Taskfile.yaml return-image-repo-${{ env.BRANCH_NAME }} SERVICE=${{ matrix.dir }})
          REGISTRY_URI="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${REPO_NAME}"
          echo "IMAGE_REPO=$REPO_NAME" >> $GITHUB_OUTPUT
          echo "REGISTRY_URI=$REGISTRY_URI" >> $GITHUB_OUTPUT

      - name: Build image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ${{ matrix.dir }}/Dockerfile
          push: false
          load: true
          tags: ${{ steps.get_image_repo.outputs.REGISTRY_URI }}:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ${{ steps.get_image_repo.outputs.REGISTRY_URI }}:${{ env.SHORT_SHA }}
          format: 'json'
          output: '${{ matrix.dir }}_trivy-results.json'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: .trivyignore
          cache: false 

      - name: Upload trivy scan artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: ${{ matrix.dir }}_trivy_scan
          path: ${{ matrix.dir }}_trivy-results.json

      - name: Push image to Amazon ECR
        id: push_image
        run: |
          IMAGE=${{ steps.get_image_repo.outputs.REGISTRY_URI }}:${{ env.SHORT_SHA }}
          docker push $IMAGE
          echo "Saving image digest"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE)
          echo "IMAGE_DIGEST=$DIGEST" >> $GITHUB_OUTPUT

      - name: Save image metadata
        run: |
          mkdir -p /tmp/build_metadata
          cat > /tmp/build_metadata/${{ matrix.dir }}_metadata.json << EOF
          {
            "service": "${{ matrix.dir }}",
            "registry_uri": "${{ steps.get_image_repo.outputs.REGISTRY_URI }}",
            "image_tag": "${{ env.SHORT_SHA }}",
            "image": "${{ steps.get_image_repo.outputs.REGISTRY_URI }}:${{ env.SHORT_SHA }}",
            "image_digest": "${{ steps.push_image.outputs.IMAGE_DIGEST }}",
            "scan_report": "s3://${{ env.CICD_BUCKET }}/security-scans/trivy/${{ env.REPORT_DATE }}/${{ env.SHORT_SHA }}/${{ matrix.dir }}_trivy-results.sarif"
          }
          EOF

      - name: Upload build metadata artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: ${{ matrix.dir }}_build_metadata
          path: /tmp/build_metadata/${{ matrix.dir }}_metadata.json

  publish-manifest:
    needs: build-scan-push
    if: always()
    runs-on: ubuntu-24.04
    environment: >-
      ${{ (github.ref_name == 'main' || github.base_ref == 'main')
      && 'production'
      || 'development' }}
    permissions:
      contents: read
      id-token: write
    env:
      CICD_BUCKET: ${{ vars.CICD_ARTIFACT_BUCKET }}
      AWS_REGION: us-east-2
      AWS_S3_ROLE_ARN: ${{ vars.S3GITHUBHUBACTIONSOIDCROLE }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: ${{ env.AWS_S3_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set short SHA and report date
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV
          echo "REPORT_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Download trivy scan artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*_trivy_scan"
          path: /tmp/trivy_scan
          merge-multiple: true

      - name: Download build metadata artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*_build_metadata"
          path: /tmp/build_metadata
          merge-multiple: true

      - name: Combine build metadata into single manifest
        run: |
          cat > build-manifest.json << EOF
          {
            "build_id": "${{ github.sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "branch": "${{ github.ref_name }}",
            "triggered_by": "${{ github.actor }}",
            "image_details": $(ls /tmp/build_metadata/*.json | xargs jq -s '.')
          }
          EOF
          cat build-manifest.json

      - name: Push trivy scan results to S3
        run: |
          aws s3 sync /tmp/trivy_scan/ \
            s3://${{ env.CICD_BUCKET }}/security-scans/trivy/${{ env.REPORT_DATE }}/${{ env.SHORT_SHA }}/ \
            --content-type "application/json"

      - name: Publish manifest to S3
        run: |
          aws s3 cp build-manifest.json \
            s3://${{ env.CICD_BUCKET }}/manifests/${{ env.REPORT_DATE }}/${{ env.SHORT_SHA }}/build-manifest.json \
            --content-type "application/json"