name: Cleanup Helm Branches

on:
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04

    steps:
      - name: Close open update-helm PRs and delete their branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "=== Closing open update-helm PRs ==="

          gh pr list \
            --repo "$REPO" \
            --state open \
            --json number,headRefName \
            --jq '.[] | @base64' |
          while read -r PR; do

            _jq() {
              echo "$PR" | base64 -d | jq -r "$1"
            }

            NUMBER=$(_jq '.number')
            BRANCH=$(_jq '.headRefName')

            [[ "$BRANCH" != update-helm/* ]] && continue

            echo "Closing PR #$NUMBER and deleting branch: $BRANCH"

            gh pr close "$NUMBER" \
              --repo "$REPO" \
              --delete-branch

          done

      - name: Delete orphaned update-helm branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "=== Deleting orphaned update-helm branches ==="

          gh api \
            "repos/$REPO/git/matching-refs/heads/update-helm/" \
            --jq '.[].ref' |
          while read -r REF; do

            BRANCH="${REF#refs/heads/}"

            echo "Deleting orphaned branch: $BRANCH"

            gh api \
              --method DELETE \
              "repos/$REPO/git/refs/heads/$BRANCH"

          done

          echo "=== Done ==="