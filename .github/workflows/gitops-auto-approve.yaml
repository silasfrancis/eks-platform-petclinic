name: GitOps Auto Approve

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-approve:
    runs-on: ubuntu-24.04

    steps:
      - name: Check PR source
        id: check
        run: |
          echo "branch=${{ github.head_ref }}"

          if [[ "${{ github.head_ref }}" == update-helm/* ]]; then
            echo "APPROVE=true" >> $GITHUB_OUTPUT
          else
            echo "APPROVE=false" >> $GITHUB_OUTPUT
          fi

      - name: Wait for validation to complete
        if: steps.check.outputs.APPROVE == 'true'
        uses: lewagon/wait-on-check-action@96d9100b431964d10e0136aff8b9ccb92470505e
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: "helm-validate"
          running-workflow-name: "GitOps Auto Approve"
          repo-token: ${{ github.token }}
          wait-interval: 10
          checks-discovery-timeout: 120

      - name: Auto approve Helm PRs
        if: steps.check.outputs.APPROVE == 'true'
        uses: hmarr/auto-approve-action@f0939ea97e9205ef24d872e76833fa908a770363
        with:
          github-token: ${{ secrets.GITOPS_PR_PAT }}
          review-message: |
                Auto-approved: Helm manifest update for `${{ github.head_ref }}`.
                Validation passed. Safe to merge.