name: PR Branch Policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  enforce-branch-policy:
    name: Enforce Branch Policy
    runs-on: ubuntu-24.04
    env:
      MAIN_BRANCH: "main"
      DEV_BRANCH: "dev"
      FEATURE_PREFIX: "feature/*"
      HELM_UPDATE_PREFIX: "update-helm/auto"
      HEAD: ${{ github.event.pull_request.head.ref }}
      BASE: ${{ github.event.pull_request.base.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      - name: Enforce branch policy
        shell: bash
        run: |
          echo "PR #${PR_NUMBER} — ${HEAD} → ${BASE}"

          ALLOWED=false

          if [[ "${HEAD}" == ${HELM_UPDATE_PREFIX} ]]; then
            ALLOWED=true
          fi

          if [[ "${BASE}" == "${DEV_BRANCH}" && "${HEAD}" == ${FEATURE_PREFIX} ]]; then
            ALLOWED=true
          fi

          if [[ "${BASE}" == "${MAIN_BRANCH}" && "${HEAD}" == "${DEV_BRANCH}" ]]; then
            ALLOWED=true
          fi

          if [[ "${ALLOWED}" == "true" ]]; then
            echo "Branch policy: allowed — ${HEAD} → ${BASE}"
            exit 0
          fi

          # Rejection
          
          if [[ "${BASE}" == "${MAIN_BRANCH}" ]]; then
            REASON="Direct merges to \`${MAIN_BRANCH}\` are only allowed from \`${DEV_BRANCH}\` or via automated helm updates."
          elif [[ "${BASE}" == "${DEV_BRANCH}" ]]; then
            REASON="PRs to \`${DEV_BRANCH}\` must come from a \`${FEATURE_PREFIX}\` branch."
          else
            REASON="The path \`${HEAD}\` → \`${BASE}\` is not permitted by repository policy."
          fi

          # Post comment 
          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "$(cat <<EOF
          👋 Hi @${AUTHOR},

          This PR has been closed because it does not follow the branch policy.

          **Reason:** ${REASON}

          ---
          **Allowed Branch Paths:**
          | From | To |
          |---|---|
          | \`${FEATURE_PREFIX}\` | \`${DEV_BRANCH}\` |
          | \`${DEV_BRANCH}\` | \`${MAIN_BRANCH}\` |
          | \`${HELM_UPDATE_PREFIX}\` | \`${DEV_BRANCH}\` or \`${MAIN_BRANCH}\` |

          If you believe this was closed in error, please contact @silasfrancis.
          EOF
          )"

          # Close PR and fail workflow 
          gh pr close "${PR_NUMBER}" --repo "${REPO}"
          echo "::error::PR #${PR_NUMBER} closed — branch policy violation: ${HEAD} → ${BASE}"
          exit 1