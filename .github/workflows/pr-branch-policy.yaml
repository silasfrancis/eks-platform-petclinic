name: PR Branch Policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  enforce-branch-policy:
    name: Enforce Branch Policy
    runs-on: ubuntu-24.04
    env:
      HEAD: ${{ github.event.pull_request.head.ref }}
      BASE: ${{ github.event.pull_request.base.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      - name: Enforce branch policy
        shell: bash
        run: |
          echo "PR #${PR_NUMBER} — ${HEAD} → ${BASE}"

          # Evaluate policy
          ALLOWED=false

          if [[ "${BASE}" == "dev" && "${HEAD}" == feature/* ]]; then
            ALLOWED=true
          fi

          if [[ "${BASE}" == "main" && "${HEAD}" == "dev" ]]; then
            ALLOWED=true
          fi

          if [[ "${ALLOWED}" == "true" ]]; then
            echo "Branch policy: allowed — ${HEAD} → ${BASE}"
            exit 0
          fi

          # Rejection message 
          if [[ "${BASE}" == "main" && "${HEAD}" != "dev" ]]; then
            REASON=$(cat <<EOF
          **Direct merges to \`main\` are not allowed from \`${HEAD}\`.**

          Only \`dev\` can be merged into \`main\`.

          **What to do:**
          1. Open a PR from \`${HEAD}\` → \`dev\` instead
          2. Once validated on the dev cluster, open a PR from \`dev\` → \`main\`
          EOF
          )

          elif [[ "${BASE}" == "dev" && "${HEAD}" != feature/* ]]; then
            REASON=$(cat <<EOF
          **PRs to \`dev\` must come from a \`feature/*\` branch.**

          Your branch \`${HEAD}\` does not follow the \`feature/<name>\` naming convention.

          **What to do:**
          1. Rename your branch: \`git branch -m ${HEAD} feature/${HEAD}\`
          2. Push the renamed branch: \`git push origin feature/${HEAD} --force\`
          3. Open a new PR from \`feature/${HEAD}\` → \`dev\`
          EOF
          )

          else
            REASON=$(cat <<EOF
          **This PR does not follow the branch policy for this repository.**

          Your PR \`${HEAD}\` → \`${BASE}\` is not a permitted path.
          EOF
          )
          fi

          # Post comment 
          gh pr comment "${PR_NUMBER}" \
            --repo "${REPO}" \
            --body "$(cat <<EOF
          👋 Hi @${AUTHOR},

          This PR has been closed because it does not follow the branch policy for this repository.

          ${REASON}

          ---
          **Branch Policy:**
          | From | To | Allowed |
          |---|---|---|
          | \`feature/*\` | \`dev\` | ✅ |
          | \`dev\` | \`main\` | ✅ |
          | anything else | any | ❌ |

          If you believe this was closed in error, please contact a @silasfrancis.
          EOF
          )"

          # Close PR and fail workflow 
          gh pr close "${PR_NUMBER}" \
            --repo "${REPO}"

          echo "::error::PR #${PR_NUMBER} closed — branch policy violation: ${HEAD} → ${BASE}"
          exit 1