name: Update Helm Manifests

on:
  workflow_run:
    branches: [ dev, main]
    workflows: ["Build, Scan, Push to ECR and Sign"]
    types: [ completed ]

jobs:
  filter-updated-directories:
    uses: ./.github/workflows/path-filter.yaml

  update-helm-manifest:
    runs-on: ubuntu-24.04
    environment: >-
      ${{ (github.ref_name == 'main' || github.base_ref == 'main')
      && 'production'
      || 'development' }}
    needs: filter-updated-directories
    if: ${{ needs.filter-updated-directories.outputs.dir_changed != '[]' && needs.filter-updated-directories.outputs.dir_changed != '' && github.event.workflow_run.conclusion == 'success'}} 
    permissions:
      contents: write
      checks: write
      pull-requests: write
      id-token: write
    strategy:
      matrix:
        dir: ${{ fromJson(needs.filter-updated-directories.outputs.dir_changed) }}
      fail-fast: false
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.dir }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      AWS_REGION: us-east-2
      CICD_BUCKET: ${{ vars.CICD_ARTIFACT_BUCKET }}
      AWS_S3_ROLE_ARN: ${{ vars.S3GITHUBHUBACTIONSOIDCROLE }}
      BRANCH_NAME: ${{ github.ref_name }}

    steps:
        - name: Checkout code
          uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
          with:
            role-to-assume: ${{ env.AWS_S3_ROLE_ARN }}
            aws-region: ${{ env.AWS_REGION }}

        - name: Setup jq and yq
          uses: ./.github/actions/install_jq_yq

        - name: Set short SHA and Build Run ID
          run: |
            SHA=${{ github.event.workflow_run.head_sha }}
            echo "SHORT_SHA=${SHA::8}" >> $GITHUB_ENV
            echo "BUILD_RUN_ID=${{ github.event.workflow_run.id }}" >> $GITHUB_ENV

        - name: Download Manifest from S3
          id: download_manifest
          run: |
            MANIFEST_KEY="manifests/${{ env.BUILD_RUN_ID }}/${{ env.SHORT_SHA }}/build-manifest.json"
            if ! aws s3api head-object \
              --bucket ${{ env.CICD_BUCKET }} \
              --key "$MANIFEST_KEY" > /dev/null 2>&1; then
              echo "Manifest not found for SHA ${{ env.SHORT_SHA }} — skipping"
              exit 0
            fi

            echo "Manifest found, downloading..."
            aws s3 cp s3://${{ env.CICD_BUCKET }}/$MANIFEST_KEY build-manifest.json
            echo "MANIFEST_FOUND=true" >> $GITHUB_OUTPUT

        - name: Update Helm Values
          id: update_image_value
          if: steps.download_manifest.outputs.MANIFEST_FOUND == 'true'
          run: |
            VALUE_ENVIRONMENT=${{ env.BRANCH_NAME }}
            SERVICE=${{ matrix.dir }}
            TARGET_DIR="helm/microservice/values/env/$VALUE_ENVIRONMENT"
            VALUES_FILE="$TARGET_DIR/$SERVICE.yaml"
            TARGET_FILE="build-manifest.json"

            echo "Processing service: $SERVICE"
            echo "Values file: $VALUES_FILE"

            echo "Extracting image for ${{ matrix.dir }}"
            NEW_IMAGE=$(jq -r --arg SERVICE "$SERVICE" '.image_details[] | select(.service == $SERVICE) | .image' "$TARGET_FILE")
            REGISTRY_URI=$(jq -r --arg SERVICE "$SERVICE" '.image_details[] | select(.service == $SERVICE) | .registry_uri' "$TARGET_FILE")
            NEW_IMAGE_TAG=$(jq -r --arg SERVICE "$SERVICE" '.image_details[] | select(.service == $SERVICE) | .image_tag' "$TARGET_FILE")
            NEW_IMAGE_DIGEST=$(jq -r --arg SERVICE "$SERVICE" '.image_details[] | select(.service == $SERVICE) | .image_digest' "$TARGET_FILE")

            if [ -z "$NEW_IMAGE" ]; then
            echo "No image found for service $SERVICE. Skipping..."
            exit 0
            fi

            echo "New image: $NEW_IMAGE"
            echo "New Image Digest: $NEW_IMAGE_DIGEST"

            CURRENT_REGISTRY=$(yq '.image.repository' "$VALUES_FILE")
            CURRENT_TAG=$(yq '.image.tag' "$VALUES_FILE")
            CURRENT_TAG=$(yq '.image.digest' "$VALUES_FILE")

            echo "Current $SERVICE Image: $CURRENT_REGISTRY:$CURRENT_TAG"
            echo "Updating $SERVICE Image -> $NEW_IMAGE"

            yq -i ".image.repository = \"$REGISTRY_URI\"" "$VALUES_FILE"
            yq -i ".image.tag = \"$NEW_IMAGE_TAG\"" "$VALUES_FILE"
            yq -i ".image.digest = \"$NEW_IMAGE_DIGEST\"" "$VALUES_FILE"

            echo "Contents after update:"
            cat "$VALUES_FILE"

            echo "Git diff:"
            git diff "$VALUES_FILE"
            echo "VALUES_FILE=$VALUES_FILE" >> $GITHUB_OUTPUT

        - name: Commit and push Helm updates
          if: steps.download_manifest.outputs.MANIFEST_FOUND == 'true'
          env: 
            GIT_USER: ${{ github.actor }}
            GIT_USER_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
          run: |
                VALUES_FILE="${{ steps.update_image_value.outputs.VALUES_FILE }}"
                git config user.name "$GIT_USER"
                git config user.email "$GIT_USER_EMAIL"

                echo "Staging changes..."
                git add "$VALUES_FILE"

                if git diff --cached --quiet; then
                    echo "No changes to commit"
                else
                    git commit -m "Update container image in helm ${{ github.ref_name }} directory"
                    PUSHED=false
                    for i in 1 2 3 4 5; do
                      if git pull --rebase origin ${{ github.ref_name }} && \
                        git push https://x-access-token:${{github.token}}@github.com/${{ github.repository }} HEAD:${{ github.ref_name }}; then
                        PUSHED=true
                        break
                      fi
                      echo "Push failed, retrying ($i/5)..."
                      sleep $((i * 3))
                    done
                    if [ "$PUSHED" = false ]; then
                      echo "All 5 push attempts failed"
                      exit 1
                    fi
                fi

        - name: Send Slack notification
          uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95
          if: success() || failure()
          with:
            payload: |
              {
                "text": "${{ job.status == 'success' && '✅ Helm values updated' || '❌ Helm update failed' }} — `${{ matrix.dir }}` on `${{ github.ref_name }}`",
                "attachments": [{
                  "color": "${{ job.status == 'success' && 'good' || 'danger' }}",
                  "fields": [
                    { "title": "Service", "value": "${{ matrix.dir }}", "short": true },
                    { "title": "SHA", "value": "${{ env.SHORT_SHA }}", "short": true },
                    { "title": "Actor", "value": "${{ github.actor }}", "short": true },
                    { "title": "Run", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" }
                  ]
                }]
              }
            webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
            webhook-type: incoming-webhook
