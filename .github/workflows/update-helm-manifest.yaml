name: Update Helm Manifests

on:
  workflow_run:
    branches: [ dev, main]
    workflows: ["Build and Push Service Images"]
    types: [ completed ]

jobs:
  filter-updated-directories:
    uses: ./.github/workflows/path-filter.yaml

  update-helm-values:
    runs-on: ubuntu-24.04
    environment: >-
      ${{ (github.base_ref || github.ref_name) == 'main'
      && 'production'
      || 'development' }}
    needs: filter-updated-directories
    if: ${{ needs.filter-updated-directories.outputs.dir_changed != '[]' 
            && needs.filter-updated-directories.outputs.dir_changed != '' 
            && github.event.workflow_run.conclusion == 'success'
        }} 
    permissions:
      contents: write
      checks: write
      pull-requests: write
      id-token: write
    strategy:
      matrix:
        dir: ${{ fromJson(needs.filter-updated-directories.outputs.dir_changed) }}
      fail-fast: false
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.dir }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      AWS_REGION: us-east-2
      CICD_BUCKET: ${{ vars.CICD_ARTIFACT_BUCKET }}
      AWS_S3_ROLE_ARN: ${{ vars.S3GITHUBHUBACTIONSOIDCROLE }}
      BRANCH_NAME: ${{ github.ref_name }}

    steps:
        - name: Checkout code
          uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
          with:
            role-to-assume: ${{ env.AWS_S3_ROLE_ARN }}
            aws-region: ${{ env.AWS_REGION }}

        - name: Setup jq and yq
          uses: ./.github/actions/install_jq_yq

        - name: Set short SHA and Build Run ID
          run: |
            SHA=${{ github.event.workflow_run.head_sha }}
            echo "SHORT_SHA=${SHA::8}" >> $GITHUB_ENV
            echo "BUILD_RUN_ID=${{ github.event.workflow_run.id }}" >> $GITHUB_ENV

        - name: Download Build Manifest from S3
          id: download_manifest
          run: |
            MANIFEST_KEY="manifests/${{ env.BUILD_RUN_ID }}/${{ env.SHORT_SHA }}/build-manifest.json"
            if ! aws s3api head-object \
              --bucket ${{ env.CICD_BUCKET }} \
              --key "$MANIFEST_KEY" > /dev/null 2>&1; then
              echo "Manifest not found for SHA ${{ env.SHORT_SHA }} — skipping"
              exit 0
            fi

            echo "Manifest found, downloading..."
            aws s3 cp s3://${{ env.CICD_BUCKET }}/$MANIFEST_KEY build-manifest.json
            echo "MANIFEST_FOUND=true" >> $GITHUB_OUTPUT

        - name: Set Chart Environment
          id: set_chart_env
          run: |
                if [ "${{ env.BRANCH_NAME }}" == "main" ]; then
                  echo "VALUE_ENVIRONMENT=prod" >> $GITHUB_OUTPUT
                elif [ "${{ env.BRANCH_NAME }}" == "dev" ]; then
                  echo "VALUE_ENVIRONMENT=dev" >> $GITHUB_OUTPUT
                else
                  echo "VALUE_ENVIRONMENT=unknown" >> $GITHUB_OUTPUT
                fi
        - name: Get latest tag
          id: get_tag
          run: |
            git fetch --tags
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null)
            echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_OUTPUT

        - name: Update Helm Values
          id: update_image_value
          if: steps.download_manifest.outputs.MANIFEST_FOUND == 'true'
          run: |
            VALUE_ENVIRONMENT=${{ steps.set_chart_env.outputs.VALUE_ENVIRONMENT }}
            SERVICE=${{ matrix.dir }}
            TARGET_DIR="k8s/microservice/values/env/$VALUE_ENVIRONMENT"
            VALUES_FILE="$TARGET_DIR/$SERVICE.yaml"
            TARGET_FILE="build-manifest.json"
            CHART_FILE="k8s/microservice/Chart.yaml"

            echo "Processing service: $SERVICE"
            echo "Values file: $VALUES_FILE"

            echo "Extracting image for $SERVICE"
            REGISTRY_URI=$(jq -r --arg SERVICE "$SERVICE" '.image_details[] | select(.service == $SERVICE) | .registry_uri' "$TARGET_FILE")
            IMAGE_REPO=$(jq -r --arg SERVICE "$SERVICE" '.image_details[] | select(.service == $SERVICE) | .image_repo' "$TARGET_FILE")
            NEW_IMAGE_TAG=$(jq -r --arg SERVICE "$SERVICE" '.image_details[] | select(.service == $SERVICE) | .image_tag' "$TARGET_FILE")
            NEW_IMAGE_DIGEST=$(jq -r --arg SERVICE "$SERVICE" '.image_details[] | select(.service == $SERVICE) | .image_digest' "$TARGET_FILE")

            if [ -z "$IMAGE_REPO" ] || [ "$IMAGE_REPO" == "null" ] || [ -z "$NEW_IMAGE_TAG" ] || [ "$NEW_IMAGE_TAG" == "null" ]; then
              echo "Error: Critical image metadata (repo or tag) is missing for $SERVICE."
              echo "Registry: $REGISTRY_URI | Repo: $IMAGE_REPO | Tag: $NEW_IMAGE_TAG"
              exit 0
            fi

            echo "Image Repo: $IMAGE_REPO"
            echo "New Image Tag: $NEW_IMAGE_TAG"
            echo "New Image Digest: $NEW_IMAGE_DIGEST"

            CURRENT_REGISTRY=$(yq '.image.registry' "$VALUES_FILE")
            CURRENT_IMAGE_REPO=$(yq '.image.repository' "$VALUES_FILE")
            CURRENT_TAG=$(yq '.image.tag' "$VALUES_FILE")
            CURRENT_DIGEST=$(yq '.image.digest' "$VALUES_FILE")

            echo "Current $SERVICE Image: $CURRENT_REGISTRY:$CURRENT_TAG"
            echo "Updating $SERVICE Image -> $NEW_IMAGE"

            yq -i ".image.registry = \"$REGISTRY_URI\"" "$VALUES_FILE"
            yq -i ".image.repository = \"$IMAGE_REPO\"" "$VALUES_FILE"
            yq -i ".image.tag = \"$NEW_IMAGE_TAG\"" "$VALUES_FILE"
            yq -i ".image.digest = \"$NEW_IMAGE_DIGEST\"" "$VALUES_FILE"

            echo "Contents after update:"
            yq '.image' "$VALUES_FILE"

            CURRENT_VERSION=$(yq '.version' "$CHART_FILE")
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            PATCH=$((PATCH + 1))
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
            
            yq -i ".version = \"$NEW_VERSION\"" "$CHART_FILE"
            yq -i ".appVersion = \"${{ steps.get_tag.outputs.LATEST_TAG }}\"" "$CHART_FILE"

        - name: Create Pull Request
          if: steps.download_manifest.outputs.MANIFEST_FOUND == 'true'
          uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
          with:
            token: ${{ github.token }}
            commit-message: "chore(helm): update ${{ matrix.dir }} image to ${{ env.SHORT_SHA }}"
            branch: "update-helm/${{ matrix.dir }}-${{ env.SHORT_SHA }}"
            base: ${{ github.ref_name }}
            title: "[Helm] Update ${{ matrix.dir }} to ${{ env.SHORT_SHA }}"
            body: |
              Automated Helm update triggered by successful build.
              - **Service:** ${{ matrix.dir }}
              - **Environment:** ${{ env.BRANCH_NAME }}
              - **Image Tag:** ${{ env.SHORT_SHA }}
            labels: |
              automated-pr
              helm-update

        - name: Send Slack notification
          uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95
          if: always() # Better to use always() and handle logic inside the payload
          with:
            payload: |
              {
                "text": "${{ job.status == 'success' && '🚀 Helm Update PR Created' || '❌ Helm Update Failed' }}",
                "attachments": [{
                  "color": "${{ job.status == 'success' && 'good' || 'danger' }}",
                  "fields": [
                    { "title": "Service", "value": "${{ matrix.dir }}", "short": true },
                    { "title": "Environment", "value": "${{ github.ref_name }}", "short": true },
                    { "title": "Pull Request", "value": "${{ steps.create-pull-request.outputs.pull-request-url || 'N/A' }}", "short": false },
                    { "title": "Action Run", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false }
                  ]
                }]
              }
            webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
            webhook-type: incoming-webhook
