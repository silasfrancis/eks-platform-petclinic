name: Update Helm Manifests

on:
  workflow_run:
    branches: [ dev, main]
    workflows: ["Build and Push Service Images"]
    types: [ completed ]

jobs:
  update-helm-values:
    runs-on: ubuntu-24.04
    if: github.event.workflow_run.conclusion == 'success'
    environment: >-
      ${{ github.event.workflow_run.head_branch == 'main'
      && 'production'
      || 'development' }}
    permissions:
      contents: write
      checks: write
      pull-requests: write
      id-token: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    env:
      AWS_REGION: us-east-2
      CICD_BUCKET: ${{ vars.CICD_ARTIFACT_BUCKET }}
      AWS_S3_ROLE_ARN: ${{ vars.S3GITHUBHUBACTIONSOIDCROLE }}
      BRANCH_NAME: ${{ github.event.workflow_run.head_branch }}

    steps:
        - name: Checkout code
          uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
          with:
            fetch-depth: 0

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
          with:
            role-to-assume: ${{ env.AWS_S3_ROLE_ARN }}
            aws-region: ${{ env.AWS_REGION }}

        - name: Setup jq and yq
          uses: ./.github/actions/install_jq_yq

        - name: Set short SHA and Build Run ID
          run: |
            SHA=${{ github.event.workflow_run.head_sha }}
            echo "SHORT_SHA=${SHA::8}" >> $GITHUB_ENV
            echo "BUILD_RUN_ID=${{ github.event.workflow_run.id }}" >> $GITHUB_ENV

        - name: Download Build Manifest from S3
          id: download_manifest
          run: |
            MANIFEST_KEY="manifests/${{ env.BUILD_RUN_ID }}/${{ env.SHORT_SHA }}/build-manifest.json"
            if ! aws s3api head-object \
              --bucket ${{ env.CICD_BUCKET }} \
              --key "$MANIFEST_KEY" > /dev/null 2>&1; then
              echo "Manifest not found for SHA ${{ env.SHORT_SHA }} — skipping"
              exit 0
            fi

            aws s3 cp s3://${{ env.CICD_BUCKET }}/$MANIFEST_KEY /tmp/build-manifest.json
            echo "MANIFEST_FOUND=true" >> $GITHUB_OUTPUT

        - name: Set Chart Environment
          id: set_chart_env
          run: |
                if [ "${{ env.BRANCH_NAME }}" == "main" ]; then
                  echo "VALUE_ENVIRONMENT=prod" >> $GITHUB_OUTPUT
                elif [ "${{ env.BRANCH_NAME }}" == "dev" ]; then
                  echo "VALUE_ENVIRONMENT=dev" >> $GITHUB_OUTPUT
                else
                  echo "VALUE_ENVIRONMENT=unknown" >> $GITHUB_OUTPUT
                fi
        - name: Get latest tag
          id: get_tag
          run: |
            git fetch --tags
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0" )
            echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_OUTPUT

        - name: Update Helm Values
          if: steps.download_manifest.outputs.MANIFEST_FOUND == 'true'
          id: update_helm_values
          run: |
            VALUE_ENVIRONMENT=${{ steps.set_chart_env.outputs.VALUE_ENVIRONMENT }}
            TARGET_DIR="k8s/microservice/values/env/$VALUE_ENVIRONMENT"
            TARGET_FILE="/tmp/build-manifest.json"
            CHART_FILE="k8s/microservice/Chart.yaml"
            UPDATED_SERVICES=""

            while IFS= read -r IMAGE; do

              SERVICE=$(echo "$IMAGE" | jq -r '.service')
              REGISTRY_URI=$(echo "$IMAGE" | jq -r '.registry_uri')
              IMAGE_REPO=$(echo "$IMAGE" | jq -r '.image_repo')
              IMAGE_TAG=$(echo "$IMAGE" | jq -r '.image_tag')
              IMAGE_DIGEST=$(echo "$IMAGE" | jq -r '.image_digest')

              VALUES_FILE="$TARGET_DIR/$SERVICE.yaml"

              if [ ! -f "$VALUES_FILE" ]; then
                echo "Skipping missing values file: $VALUES_FILE"
                continue
              fi

              echo "Updating $SERVICE"

              yq -i ".image.registry = \"$REGISTRY_URI\"" "$VALUES_FILE"
              yq -i ".image.repository = \"$IMAGE_REPO\"" "$VALUES_FILE"
              yq -i ".image.tag = \"$IMAGE_TAG\"" "$VALUES_FILE"
              yq -i ".image.digest = \"$IMAGE_DIGEST\"" "$VALUES_FILE"
              
              UPDATED_SERVICES="${UPDATED_SERVICES}- ${SERVICE}\n"

            done < <(jq -c '.image_details[]' "$TARGET_FILE")

            printf "UPDATED_SERVICES<<EOF\n%b\nEOF\n" "$UPDATED_SERVICES" >> "$GITHUB_OUTPUT"

            if [ -n "$UPDATED_SERVICES" ]; then
              CURRENT_VERSION=$(yq '.version' "$CHART_FILE")

              IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

              PATCH=$((PATCH + 1))

              NEW_VERSION="$MAJOR.$MINOR.$PATCH"

              yq -i ".version = \"$NEW_VERSION\"" "$CHART_FILE"
              yq -i ".appVersion = \"${{ steps.get_tag.outputs.LATEST_TAG }}\"" "$CHART_FILE"
            fi

        - name: Check for changes
          id: changes
          run: |
            if git diff --quiet k8s/microservice; then
              echo "HAS_CHANGES=false" >> $GITHUB_OUTPUT
            else
              echo "HAS_CHANGES=true" >> $GITHUB_OUTPUT
            fi

        - name: Create Pull Request
          id: cpr
          uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
          if: steps.changes.outputs.HAS_CHANGES == 'true'
          with:
            token: ${{ secrets.GITOPS_PR_PAT }}
            branch: update-helm/auto
            base: ${{ github.event.workflow_run.head_branch }}
            delete-branch: true
            commit-message: |
              chore(helm): update manifests for ${{ env.SHORT_SHA }}
            title: |
              [Helm] Update manifests for ${{ env.SHORT_SHA }}
            body: |
              Automated Helm update triggered by successful build.

              Build SHA: `${{ env.SHORT_SHA }}`

              Environment: `${{ env.BRANCH_NAME }}`

              Updated services:
              ${{ steps.update_helm_values.outputs.UPDATED_SERVICES }}
            labels: |
              automated-pr
              helm-update
              image-update         

        - name: Send Slack notification
          uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95
          if: always()
          with:
            payload: |
              {
                "text": "${{ steps.cpr.outputs.pull-request-url != '' && '🚀 Helm Update PR Created' || job.status == 'success' && '✅ Helm Update — No Changes' || '❌ Helm Update Failed' }}",
                "attachments": [{
                  "color": "${{ job.status == 'success' && 'good' || 'danger' }}",
                  "fields": [
                    {
                      "title": "Build SHA",
                      "value": "${{ env.SHORT_SHA }}",
                      "short": true
                    },
                    {
                      "title": "Environment",
                      "value": "${{ env.BRANCH_NAME }}",
                      "short": true
                    },
                    {
                      "title": "Pull Request",
                      "value": "${{ steps.cpr.outputs.pull-request-url || 'No PR Created' }}",
                      "short": false
                    },
                    {
                      "title": "Action Run",
                      "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                      "short": false
                    }
                  ]
                }]
              }
            webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
            webhook-type: incoming-webhook
