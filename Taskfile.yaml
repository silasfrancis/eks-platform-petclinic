# Root entrypoint for all platform operations.
# Includes sub-Taskfiles for terraform, k8s bootstrap, ansible and local dev.
#
# Usage:
#   task --list                     show all available tasks
#   task tf:plan ENV=dev            terraform plan for dev
#   task k8s:bootstrap ENV=dev      full cluster bootstrap
#   task validate ENV=dev           validate all helm charts
#   task local:up                   start local docker-compose stack
#
# Note: For full configurations, variable definitions, and manual overrides,
#       refer to the individual Taskfiles and source code in these folders:
#       - ./terraform/ (Infrastructure as Code)
#       - ./k8s/       (Kubernetes Manifests & Helm Charts)
#       - ./ansible/   (Server Configuration)

version: "3"

env:
  ENV: '{{.ENV | default ""}}'

includes:
  tf:
    taskfile: ./terraform/Taskfile.yaml
    dir: ./terraform

  k8s:
    taskfile: ./k8s/Taskfile.yaml
    dir: .

  ansible:
    taskfile: ./ansible/Taskfile.yaml
    dir: ./ansible

tasks:

  platform:up:
    desc: "Provision infrastructure and bootstrap platform — ENV=dev|main"
    summary: |
      1. Terraform — VPC, EKS, RDS, IAM
      2. Ansible   — WireGuard server via SSM
      3. k8s       — Cluster bootstrap
    preconditions:
      - sh: '[ "{{.ENV}}" = "dev" ] || [ "{{.ENV}}" = "main" ]'
        msg: "ENV must be dev or main — e.g. task platform:up ENV=dev"
    cmds:
      - task: tf:apply
        vars: { ENV: "{{.ENV}}" }
      - task: ansible:configure_wireguard
      - task: k8s:bootstrap
        vars: { ENV: "{{.ENV}}" }

  validate:
    desc: "Validate all Helm charts — ENV=dev|main"
    preconditions:
      - sh: '[ "{{.ENV}}" = "dev" ] || [ "{{.ENV}}" = "main" ]'
        msg: "ENV must be dev or main — e.g. task validate ENV=dev"
    cmds:
      - ./scripts/validate-charts.sh {{.ENV}}

  validate:export:
    desc: "Validate and export rendered manifests to rendered/"
    preconditions:
      - sh: '[ "{{.ENV}}" = "dev" ] || [ "{{.ENV}}" = "main" ]'
        msg: "ENV must be dev or main — e.g. task validate:export ENV=dev"
    cmds:
      - ./scripts/validate-charts.sh {{.ENV}} --export

  local:up:
    desc: "Start local microservices stack"
    preconditions:
      - sh: "[ -f .env ]"
        msg: ".env file not found — copy .env.example and fill in values"
    cmds:
      - docker compose up -d
      - |
        echo "API Gateway:      http://localhost:8080"
        echo "Discovery Server: http://localhost:8761"
        echo "Admin Server:     http://localhost:9090"
        echo "Config Server:    http://localhost:8888"

  local:down:
    desc: "Stop local microservices stack"
    cmds:
      - docker compose down

  local:logs:
    desc: "Tail logs — SERVICE=customers-service"
    preconditions:
      - sh: "[ -n '{{.SERVICE}}' ]"
        msg: "SERVICE is required — e.g. task local:logs SERVICE=customers-service"
    cmds:
      - docker compose logs -f {{.SERVICE}}

  local:build:
    desc: "Rebuild all service images"
    cmds:
      - docker compose build

  local:restart:
    desc: "Restart a service — SERVICE=api-gateway"
    preconditions:
      - sh: "[ -n '{{.SERVICE}}' ]"
        msg: "SERVICE is required — e.g. task local:restart SERVICE=api-gateway"
    cmds:
      - docker compose restart {{.SERVICE}}
