# Root Taskfile for platform operations.
#
# Unified entrypoint for infrastructure provisioning,
# Kubernetes bootstrap, WireGuard automation,
# validation, and local development workflows.
#
# Usage:
#   task --list
#
#   task tf:plan ENV=dev
#   task tf:apply ENV=prod
#
#   task k8s:bootstrap ENV=prod
#   task validate ENV=prod
#
#   task ansible:configure_wireguard
#
#   task platform:up ENV=prod
#
#   task local:up
#   task local:logs SERVICE=customers-service

version: "3"

env:
  ENV: '{{.ENV | default ""}}'

includes:

  tf:
    taskfile: ./terraform/Taskfile.yaml
    dir: ./terraform

  k8s:
    taskfile: ./k8s/Taskfile.yaml
    dir: ./k8s

  ansible:
    taskfile: ./ansible/Taskfile.yaml
    dir: ./ansible

tasks:

  platform:up:
    desc: "Provision infrastructure and bootstrap platform"
    summary: |
      End-to-end platform provisioning workflow:

        1. Shared application registry resources
           - AWS AppRegistry metadata
           - platform metadata propagation

        2. Environment infrastructure
           - VPC
           - EKS
           - IAM and IRSA
           - RDS
           - platform infrastructure

        3. WireGuard infrastructure
           - Dedicated WireGuard VPC
           - VPN EC2 instance
           - SSM management access

        4. Transit Gateway networking
           - TGW attachments
           - TGW route tables
           - RFC1918 routing
           - explicit environment isolation

        5. WireGuard configuration via Ansible over SSM

        6. Kubernetes platform bootstrap

      Usage:
        task platform:up ENV=dev
        task platform:up ENV=prod

    preconditions:
      - sh: '[ "{{.ENV}}" = "dev" ] || [ "{{.ENV}}" = "prod" ]'
        msg: "ENV must be dev or prod"

    cmds:
      - task: tf:app-registry:apply

      - task: tf:apply
        vars:
          ENV: "{{.ENV}}"

      - task: tf:wireguard:apply

      - task: tf:transit-gateway:apply

      - task: ansible:configure_wireguard

      - task: validate
        vars:
          ENV: "{{.ENV}}"

      - task: k8s:bootstrap
        vars:
          ENV: "{{.ENV}}"

  validate:
    desc: "Validate all Helm charts"
    summary: |
      Renders all Helm charts using helm template.

      Validates:
        - platform charts
        - policies
        - ArgoCD
        - microservices

      Usage:
        task validate ENV=dev
        task validate ENV=prod

    preconditions:
      - sh: '[ "{{.ENV}}" = "dev" ] || [ "{{.ENV}}" = "prod" ]'
        msg: "ENV must be dev or prod"

    cmds:
      - ./scripts/validate-charts.sh {{.ENV}}

  validate:export:
    desc: "Validate charts and export rendered manifests"
    summary: |
      Exports rendered manifests into ./rendered/

      Usage:
        task validate:export ENV=dev
        task validate:export ENV=prod

    preconditions:
      - sh: '[ "{{.ENV}}" = "dev" ] || [ "{{.ENV}}" = "prod" ]'
        msg: "ENV must be dev or prod"

    cmds:
      - ./scripts/validate-charts.sh {{.ENV}} --export

  local:up:
    desc: "Start local docker-compose stack"
    preconditions:
      - sh: "[ -f .env ]"
        msg: ".env file not found — copy .env.example first"
    cmds:
      - docker compose up -d
      - |
        echo "API Gateway:      http://localhost:8080"
        echo "Discovery Server: http://localhost:8761"
        echo "Admin Server:     http://localhost:9090"
        echo "Config Server:    http://localhost:8888"

  local:down:
    desc: "Stop local docker-compose stack"
    cmds:
      - docker compose down

  local:logs:
    desc: "Tail logs for a service"
    summary: |
      Usage:
        task local:logs SERVICE=customers-service
    preconditions:
      - sh: "[ -n '{{.SERVICE}}' ]"
        msg: "SERVICE is required"
    cmds:
      - docker compose logs -f {{.SERVICE}}

  local:build:
    desc: "Build local service images"
    cmds:
      - docker compose build

  local:restart:
    desc: "Restart a local service"
    summary: |
      Usage:
        task local:restart SERVICE=api-gateway
    preconditions:
      - sh: "[ -n '{{.SERVICE}}' ]"
        msg: "SERVICE is required"
    cmds:
      - docker compose restart {{.SERVICE}}