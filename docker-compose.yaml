# Docker Compose (Local Development Only)
#
# This setup is intended for local development and quick testing of the
# microservices architecture.
#
# Application services use distroless images (runtime-only, no shell/tools),
# so Docker healthchecks that rely on curl/wget/sh are not defined here.
# Instead, we rely on startup order and built-in retry logic for local runs.
#
# In Kubernetes, proper health checks are configured using:
#   - liveness probes
#   - readiness probes
# typically backed by Spring Boot Actuator endpoints (/actuator/health).
#
# See Kubernetes manifests for production-ready configuration for these services in : k8s/microservice

services:

  mysql:
    image: mysql:8.4.5
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  config-server:
    build:
      context: services/
      dockerfile: config-server/Dockerfile
    container_name: config-server
    mem_limit: 256m
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: native
      CONFIG_DIR: /config
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

  discovery-server:
    build:
      context: services/
      dockerfile: discovery-server/Dockerfile
    container_name: discovery-server
    restart: on-failure
    mem_limit: 256m
    depends_on:
      config-server:
        condition: service_started
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888

  customers-service:
    build:
      context: services/
      dockerfile: customers-service/Dockerfile
    container_name: customers-service
    mem_limit: 512m
    restart: on-failure
    depends_on:
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
      mysql:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker,mysql
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761

  visits-service:
    build:
      context: services/
      dockerfile: visits-service/Dockerfile
    container_name: visits-service
    restart: on-failure
    mem_limit: 512m
    depends_on:
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
      mysql:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker,mysql
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761

  vets-service:
    build:
      context: services/
      dockerfile: vets-service/Dockerfile
    container_name: vets-service
    mem_limit: 512m
    restart: on-failure
    depends_on:
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
      mysql:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker,mysql
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761

  genai-service:
    build:
      context: services/
      dockerfile: genai-service/Dockerfile
    container_name: genai-service
    mem_limit: 512m
    restart: on-failure
    depends_on:
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CONFIG_SERVER_URL: http://config-server:8888

  api-gateway:
    build:
      context: services/
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    mem_limit: 512m
    restart: on-failure
    depends_on:
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888

  admin-server:
    build:
      context: services/
      dockerfile: admin-server/Dockerfile
    container_name: admin-server
    mem_limit: 256m
    restart: on-failure
    depends_on:
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
    ports:
      - "9090:9090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761

volumes:
  mysql-data:
  