services:

  mysql:
    image: mysql:8.4.5
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: config-server
    mem_limit: 256m
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: native
      CONFIG_DIR: /config
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    container_name: discovery-server
    restart: on-failure
    mem_limit: 256m
    depends_on:
      config-server:
        condition: service_started
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761

  customers-service:
    build:
      context: .
      dockerfile: customers-service/Dockerfile
    container_name: customers-service
    mem_limit: 512m
    restart: on-failure
    depends_on:
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
      mysql:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker,mysql
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

  visits-service:
    build:
      context: .
      dockerfile: visits-service/Dockerfile
    container_name: visits-service
    restart: on-failure
    mem_limit: 512m
    depends_on:
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
      mysql:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker,mysql
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

  vets-service:
    build:
      context: .
      dockerfile: vets-service/Dockerfile
    container_name: vets-service
    mem_limit: 512m
    restart: on-failure
    depends_on:
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
      mysql:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker,mysql
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

  genai-service:
    build:
      context: .
      dockerfile: genai-service/Dockerfile
    container_name: genai-service
    mem_limit: 512m
    restart: on-failure
    depends_on:
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
      OPENAI_API_KEY: ${OPENAI_API_KEY}

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    mem_limit: 512m
    restart: on-failure
    depends_on:
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker

  admin-server:
    build:
      context: .
      dockerfile: admin-server/Dockerfile
    container_name: admin-server
    mem_limit: 256m
    restart: on-failure
    depends_on:
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
    ports:
      - "9090:9090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888

  tracing-server:
    image: openzipkin/zipkin
    container_name: tracing-server
    mem_limit: 256m
    ports:
      - "9411:9411"

  grafana-server:
    build: ./docker/grafana
    container_name: grafana-server
    mem_limit: 128m
    ports:
      - "3030:3000"

  prometheus-server:
    build: ./docker/prometheus
    container_name: prometheus-server
    mem_limit: 128m
    ports:
      - "9091:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9090"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data: