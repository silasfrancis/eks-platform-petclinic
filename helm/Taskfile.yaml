version: '3'

env:
  ENV: "dev"
  GATEWAY_API_VERSION: "v1.5.0"
  ISTIO_VERSION: "1.29.1"
  ARGOCD_VERSION: "v3.3.2"
  ARGO_ROLLOUTS_VERSION: "v1.8.3"
  CLUSTER_NAME: "{{.ENV}}-petclinic-eks-cluster"
  ALB_IRSA_NAME: "aws-load-balancer-controller"

tasks:
  install_gateway_crds:
    desc: Install Kubernetes Gateway API CRDs
    cmd: kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/{{.GATEWAY_API_VERSION}}/standard-install.yaml

# istio
  add_istio_repo:
    desc: Add and update Istio Helm repo
    cmds:
      - helm repo add istio https://istio-release.storage.googleapis.com/charts
      - helm repo update

  install_istio_base:
    desc: Install Istio base — CRDs and cluster-wide resources
    cmds:
      - task: add_istio_repo
      - |
        helm upgrade --install istio-base istio/base \
          -n istio-system \
          --create-namespace \
          --version {{.ISTIO_VERSION}} \
          --set defaultRevision=default \
          --wait \
          --timeout 5m \
          --atomic

  install_istiod:
    desc: Install Istiod — Istio control plane
    cmds:
      - |
        helm upgrade --install istiod istio/istiod \
          -n istio-system \
          --version {{.ISTIO_VERSION}} \
          --wait \
          --timeout 5m \
          --atomic \
          --set pilot.resources.requests.cpu=100m \
          --set pilot.resources.requests.memory=256Mi \
          --set global.proxy.resources.requests.cpu=50m \
          --set global.proxy.resources.requests.memory=128Mi
      - kubectl get pods -n istio-system

  wait_for_istio:
    desc: Wait for Istio control plane to be ready
    cmd: kubectl wait --for=condition=available deployment --all -n istio-system --timeout=180s

  install_istio:
    desc: Install full Istio stack — base + istiod 
    cmds:
      - task: install_istio_base
      - task: install_istiod
      - task: wait_for_istio
  
# aws load balancer controller
  install_aws_load_balancer_controller:
    cmds:     
      - helm repo add eks https://aws.github.io/eks-charts
      - helm repo update
      - |
        helm install aws-load-balancer-controller eks/aws-load-balancer-controller \
          --namespace kube-system \
          --set clusterName={{.CLUSTER_NAME}} \
          --set serviceAccount.create=false \
          --set serviceAccount.name={{.ALB_IRSA_NAME}}

# argo cd
  install_argocd:
    desc: Install ArgoCD
    cmds:
      - kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
      - |
        kubectl apply -n argocd \
          --server-side \
          --force-conflicts \
          -f https://raw.githubusercontent.com/argoproj/argo-cd/{{.ARGOCD_VERSION}}/manifests/install.yaml
      - kubectl wait --for=condition=available deployment --all -n argocd --timeout=300s

  argocd_password:
    desc: Get the initial ArgoCD admin password
    cmd: kubectl get secret argocd-initial-admin-secret -n argocd -o jsonpath="{.data.password}" | base64 -d && echo

  argocd_port_forward:
    desc: Port forward ArgoCD UI to localhost:8080
    cmd: kubectl port-forward svc/argocd-server -n argocd 8080:443

# argo rollouts
  install_argo_rollouts:
    desc: Install Argo Rollouts controller
    cmds:
      - kubectl create namespace argo-rollouts --dry-run=client -o yaml | kubectl apply -f -
      - |
        kubectl apply -n argo-rollouts \
          -f https://github.com/argoproj/argo-rollouts/releases/download/{{.ARGO_ROLLOUTS_VERSION}}/install.yaml
      - kubectl wait --for=condition=available deployment --all -n argo-rollouts --timeout=180s

  install_argo_rollouts_plugin:
    desc: Install Argo Rollouts kubectl plugin (Linux amd64)
    cmds:
      - |
        curl -LO https://github.com/argoproj/argo-rollouts/releases/download/{{.ARGO_ROLLOUTS_VERSION}}/kubectl-argo-rollouts-linux-amd64
      - chmod +x kubectl-argo-rollouts-linux-amd64
      - sudo mv kubectl-argo-rollouts-linux-amd64 /usr/local/bin/kubectl-argo-rollouts
      - kubectl argo rollouts version

# external secrets
  install_external_secrets_operator:
    desc: Install External Secrets Operator
    cmds:
      - helm repo add external-secrets https://charts.external-secrets.io
      - |
        helm install external-secrets \
          external-secrets/external-secrets \
            -n external-secrets \
            --create-namespace 

# microservices releases

  inject_envoy:
    desc: Enable Envoy sidecar injection for petclinic namespace and restart pods
    cmds:
      - kubectl create namespace petclinic --dry-run=client -o yaml | kubectl apply -f -
      - kubectl create namespace istio-ingress --dry-run=client -o yaml | kubectl apply -f -
      - kubectl label namespace petclinic istio-injection=enabled --overwrite
      - kubectl label namespace istio-ingress istio-injection=enabled --overwrite

  release_config_server:
    cmds:
      - |
        helm upgrade --install config-server microservice \
          -n petclinic \
          --create-namespace \
          -f microservice/values/env/{{.ENV}}/config-server.yaml \
          --wait --timeout 5m --atomic

  release_discovery_server:
    cmds:
      - |
        helm upgrade --install discovery-server microservice \
          -n petclinic \
          -f microservice/values/env/{{.ENV}}/discovery-server.yaml \
          --wait --timeout 5m 
          # --atomic

  release_db_migrations:
    cmds:
      - |
        helm upgrade --install db-migrations microservice \
          -n petclinic \
          -f microservice/values/env/{{.ENV}}/db-migrations.yaml \
          --wait --timeout 5m 
          # --atomic

  release_api_gateway:
    cmds:
      - |
        helm upgrade --install api-gateway microservice \
          -n petclinic \
          -f microservice/values/env/{{.ENV}}/api-gateway.yaml \
          --wait --timeout 5m 
          # --atomic

  release_customers_service:
    cmds:
      - |
        helm upgrade --install customers-service microservice \
          -n petclinic \
          -f microservice/values/env/{{.ENV}}/customers-service.yaml \
          --wait --timeout 5m 
          # --atomic

  release_visits_service:
    cmds:
      - |
        helm upgrade --install visits-service microservice \
          -n petclinic \
          -f microservice/values/env/{{.ENV}}/visits-service.yaml \
          --wait --timeout 5m 
          # --atomic

  release_vets_service:
    cmds:
      - |
        helm upgrade --install vets-service microservice \
          -n petclinic \
          -f microservice/values/env/{{.ENV}}/vets-service.yaml \
          --wait --timeout 5m 
          # --atomic

  release_genai_service:
    cmds:
      - |
        helm upgrade --install genai-service microservice \
          -n petclinic \
          -f microservice/values/env/{{.ENV}}/genai-service.yaml \
          --wait --timeout 5m 
          # --atomic

  release_admin_server:
    cmds:
      - |
        helm upgrade --install admin-server microservice \
          -n petclinic \
          -f microservice/values/env/{{.ENV}}/admin-server.yaml \
          --wait --timeout 5m 
          # --atomic

# alb controller irsa
  release_alb_controller_irsa:
    cmds:
      - |
        helm upgrade --install irsa-alb-controller cluster-config/charts/cluster-config \
          -n kube-system \
          -f cluster-config/charts/cluster-config/values/env/{{.ENV}}/alb-controller.yaml \
          --wait --timeout 5m \
          # --atomic

# gateway
  realease_gateway:
    cmds:
      - kubectl create namespace istio-ingress --dry-run=client -o yaml | kubectl apply -f -
      - kubectl label namespace istio-ingress istio-injection=enabled --overwrite
      - |
        helm upgrade --install istio-ingressgateway platform/charts/gateway \
          -n istio-ingress \
          -f platform/charts/gateway/values/env/{{.ENV}}/gateway.yaml \
          --wait --timeout 5m \
          # --atomic
          
  release_all:
    desc: Release all microservices in dependency order
    cmds:
      - task: release_config_server
      - task: release_discovery_server
      - task: release_db_migrations
      - task: release_api_gateway
      - task: release_customers_service
      - task: release_visits_service
      - task: release_vets_service
      - task: release_genai_service
      - task: release_admin_server

  restart_deployments:
    cmds:
      # - kubectl rollout restart deployment/config-server-deployment -n petclinic
      - kubectl rollout restart deployment/discovery-server-deployment -n petclinic
      - kubectl rollout restart deployment/admin-server-deployment -n petclinic
      - kubectl rollout status deployment/discovery-server-deployment -n petclinic
      # - kubectl rollout status deployment/config-server-deployment -n petclinic
      - kubectl rollout status deployment/admin-server-deployment -n petclinic

  restart_rollouts:
    cmds:
    - kubectl argo rollouts restart api-gateway-rollout -n petclinic
    - kubectl argo rollouts restart customers-service-rollout -n petclinic
    - kubectl argo rollouts restart visits-service-rollout -n petclinic
    - kubectl argo rollouts restart vets-service-rollout -n petclinic
    - kubectl argo rollouts restart genai-service-rollout -n petclinic
    - kubectl argo rollouts status api-gateway-rollout -n petclinic
    - kubectl argo rollouts status customers-service-rollout -n petclinic
    - kubectl argo rollouts status visits-service-rollout -n petclinic
    - kubectl argo rollouts status vets-service-rollout -n petclinic
    - kubectl argo rollouts status genai-service-rollout -n petclinic

  restart_all:
    cmds:
      - task: restart_deployments
      - task: restart_rollouts

  bootstrap:
    desc: Full platform setup
    cmds:
      - task: install_gateway_crds
      - task: install_istio
      - task: install_argocd
      - task: install_argo_rollouts
      - task: inject_envoy_petclinic
      - task: release_all