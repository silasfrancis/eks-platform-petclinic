version: '3'

env:
  ENV: "dev"

tasks:
  install_gateway_crds:
    desc: Install Kubernetes Gateway API CRDs
    cmd: kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/latest/download/standard-install.yaml

  install_istio_base:
    desc: Install Istio base
    cmds:
      - helm repo add istio https://istio-release.storage.googleapis.com/charts
      - helm repo update
      - |
        helm upgrade --install istio-base istio/base \
          -n istio-system \
          --create-namespace \
          --version 1.23.0

  install_istiod:
    desc: Install Istiod
    cmds:
      - |
        helm upgrade --install istiod istio/istiod \
          -n istio-system \
          --version 1.23.0 \
          --set pilot.resources.requests.cpu=100m \
          --set pilot.resources.requests.memory=256Mi \
          --wait

  install_istio_ingress:
    desc: Install Istio Ingress Gateway
    cmds:
      - kubectl create namespace istio-ingress --dry-run=client -o yaml | kubectl apply -f -
      - |
        helm upgrade --install istio-ingressgateway istio/gateway \
          -n istio-ingress \
          --version 1.23.0 \
          --wait

  install_istio:
    desc: Install full Istio stack
    cmds:
      - task: install_istio_base
      - task: install_istiod
      - task: install_istio_ingress

  inject_envoy_petclinic:
    desc: Enable Envoy sidecar injection for the petclinic namespace and restart pods
    cmds:
      - kubectl label namespace petclinic istio-injection=enabled --overwrite
      - kubectl rollout restart deployment -n petclinic
      - kubectl get pods -n petclinic

  install_argocd:
    desc: Install ArgoCD into the cluster
    cmds:
      - kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
      - |
        kubectl apply -n argocd \
          -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
      - kubectl wait --for=condition=available deployment/argocd-server -n argocd --timeout=120s

  argocd_password:
    desc: Get the initial ArgoCD admin password
    cmd: kubectl get secret argocd-initial-admin-secret -n argocd -o jsonpath="{.data.password}" | base64 -d && echo

  argocd_port_forward:
    desc: Port forward ArgoCD UI to localhost:8080
    cmd: kubectl port-forward svc/argocd-server -n argocd 8080:443

  install_argo_rollouts:
    desc: Install Argo Rollouts controller
    cmds:
      - kubectl create namespace argo-rollouts --dry-run=client -o yaml | kubectl apply -f -
      - |
        kubectl apply -n argo-rollouts \
          -f https://github.com/argoproj/argo-rollouts/releases/latest/download/install.yaml
      - kubectl wait --for=condition=available deployment/argo-rollouts -n argo-rollouts --timeout=120s

  install_argo_rollouts_plugin:
    desc: Install Argo Rollouts kubectl plugin
    cmds:
      - |
        curl -LO https://github.com/argoproj/argo-rollouts/releases/latest/download/kubectl-argo-rollouts-linux-amd64
      - chmod +x kubectl-argo-rollouts-linux-amd64
      - sudo mv kubectl-argo-rollouts-linux-amd64 /usr/local/bin/kubectl-argo-rollouts

  release_config_server:
    desc: Helm release for config-server
    cmds:
      - |
        helm upgrade --install config-server ./helm/microservice \
          -n petclinic \
          --create-namespace \
          -f ./helm/microservice/values/env/{{.ENV}}/config-server.yaml \
          --wait

  release_discovery_server:
    desc: Helm release for discovery-server
    cmds:
      - |
        helm upgrade --install discovery-server ./helm/microservice \
          -n petclinic \
          -f ./helm/microservice/values/env/{{.ENV}}/discovery-server.yaml \
          --wait

  release_api_gateway:
    desc: Helm release for api-gateway
    cmds:
      - |
        helm upgrade --install api-gateway ./helm/microservice \
          -n petclinic \
          -f ./helm/microservice/values/env/{{.ENV}}/api-gateway.yaml \
          --wait

  release_customers_service:
    desc: Helm release for customers-service
    cmds:
      - |
        helm upgrade --install customers-service ./helm/microservice \
          -n petclinic \
          -f ./helm/microservice/values/env/{{.ENV}}/customers-service.yaml \
          --wait

  release_visits_service:
    desc: Helm release for visits-service
    cmds:
      - |
        helm upgrade --install visits-service ./helm/microservice \
          -n petclinic \
          -f ./helm/microservice/values/env/{{.ENV}}/visits-service.yaml \
          --wait

  release_vets_service:
    desc: Helm release for vets-service
    cmds:
      - |
        helm upgrade --install vets-service ./helm/microservice \
          -n petclinic \
          -f ./helm/microservice/values/env/{{.ENV}}/vets-service.yaml \
          --wait

  release_genai_service:
    desc: Helm release for genai-service
    cmds:
      - |
        helm upgrade --install genai-service ./helm/microservice \
          -n petclinic \
          -f ./helm/microservice/values/env/{{.ENV}}/genai-service.yaml \
          --wait

  release_admin_server:
    desc: Helm release for admin-server
    cmds:
      - |
        helm upgrade --install admin-server ./helm/microservice \
          -n petclinic \
          -f ./helm/microservice/values/env/{{.ENV}}/admin-server.yaml \
          --wait

  release_db_migrations:
    desc: Helm release for db-migrations
    cmds:
      - |
        helm upgrade --install db-migrations ./helm/microservice \
          -n petclinic \
          -f ./helm/microservice/values/env/{{.ENV}}/db-migrations.yaml \
          --wait

  release_all:
    desc: Release all microservices in dependency order
    cmds:
      - task: release_config_server
      - task: release_discovery_server
      - task: release_db_migrations
      - task: release_api_gateway
      - task: release_customers_service
      - task: release_visits_service
      - task: release_vets_service
      - task: release_genai_service
      - task: release_admin_server

  bootstrap:
    desc: Full platform setup — Gateway CRDs, Istio, ArgoCD, Argo Rollouts, sidecar injection, all releases
    cmds:
      - task: install_gateway_crds
      - task: install_istio
      - task: install_argocd
      - task: install_argo_rollouts
      - task: inject_envoy_petclinic
      - task: release_all
