# allow-discovery-server.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-discovery-server
  namespace: petclinic
spec:
  podSelector:
    matchLabels:
      app: discovery-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 8761
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: config-server
      ports:
        - port: 8888