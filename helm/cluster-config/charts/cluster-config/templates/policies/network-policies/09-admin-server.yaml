apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admin-server-netpol
  namespace: petclinic
spec:
  podSelector:
    matchLabels:
      app: admin-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 8085
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: config-server
      ports:
        - port: 8888
    - to:
        - podSelector:
            matchLabels:
              app: discovery-server
      ports:
        - port: 8761