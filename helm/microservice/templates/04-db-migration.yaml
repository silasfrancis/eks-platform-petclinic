{{- if .Values.databaseMigration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.databaseMigration.name }}
  namespace: {{ .Values.namespace }}
  {{- with .Values.databaseMigration.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  backoffLimit: {{ .Values.databaseMigration.backoffLimit }}
  template:
    spec:
      restartPolicy: {{ .Values.databaseMigration.restartPolicy }}
      {{- if .Values.serviceAccount.enabled }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      containers:
        - name: {{ .Values.container.name }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          args:
            - migrate
          env:
          {{- range .Values.databaseMigration.env.secrets }}
          - name: {{ .name }}
            valueFrom:
              secretKeyRef:
                name: {{ .secretName }}
                key: {{ .secretKey }}
          {{- end }}
          {{- range $key, $val := .Values.databaseMigration.env.plain }}
          - name: {{ $key }}
            value: {{ $val | quote }}
          {{- end }}
{{- end }}