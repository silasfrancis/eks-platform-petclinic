apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: customers-service-vsvc
spec:
  hosts:
    - customers-service      
  gateways:
    -                    #for frontend
  http:
    - name: primary
      route:
        - destination:
            host: customers-service-stable
            port:
              number: 8080
          weight: 100
        - destination:
            host: customers-service-canary
            port:
              number: 8080
          weight: 0