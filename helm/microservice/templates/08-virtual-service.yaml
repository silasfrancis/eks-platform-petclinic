apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: customers-service-vsvc
spec:
  hosts:
    - customers-service      
  gateways:
    -                    #for frontend
  http:
    - name: primary
      route:
        - destination:
            host: #the stable service
            port:
              number: 8080
          weight: 100
        - destination:
            host: #canary service
            port:
              number: 8080
          weight: 0