namespace: petclinic
container:
  name: admin-server
  port: 9090
  readiness:
    probePath: /
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3
  liveness:
    probePath: /
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3
  resources:
    limits:
      memory: 512Mi
      cpu: 500m
    requests:
      memory: 256Mi
      cpu: 100m
selectorLabels:
  app: admin-server
image:
  repository: 509194952955.dkr.ecr.us-east-2.amazonaws.com/dev-springboot/admin-server
  tag: '31c1440c'
  digest: sha256:78de8cef346fbcd33e6c02a2fe7428e587c8ee94e4b6a1172a6d0ba4eb98d0e5
serviceAccount:
  enabled: false
  name: admin-server-sa
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789:role/prod-secrets-reader"
secretStore:
  enabled: false
  name: admin-server-secretStore
  awsRegion: us-east-2
externalSecret:
  enabled: false
  name: admin-server-externalSecret
  secret: admin-server-secrets
  remoteRef:
    awsSecretKey: dev/springboot-microservices
    secretsProperties:
      dbSecrets:
        enabled: false
        dbHost: MYSQL_HOST
        dbHser: MYSQL_USER
        dbPwd: MYSQL_PASSWORD
        dbName: MYSQL_DATABASE
      aiSecrets:
        enabled: false
        open-ai-key: OPENAI_API_KEY
databaseMigration:
  enabled: false
  name: admin-server-migrationJob
deployment:
  enabled: true
  name: admin-server-deployment
  replicas: 2
  secrets:
    springProfiles: docker
    dbSecrets:
      enabled: false
argoRollout:
  enabled: false
  name: admin-server-rollout
  replicas: 2
  secrets:
    springProfiles: docker
    dbSecrets:
      enabled: false
    aiSecrets:
      enabled: false
service:
  name: admin-server-service
  port: 9090
  rolloutServices:
    enabled: false
    stableService: admin-server-stable-service
    canaryService: admin-server-canary-service
virtualService:
  enabled: false
  name: admin-server-vs
  gatewayRef:
    enabled: false
    name: petclinic-gateway
  hosts:
    - admin-server
