createNamespace: false
namespace: petclinic

container:
  name: admin-server
  imagePullPolicy: IfNotPresent
  port: 9090
  readinessProbe:
    path: /
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3
  livenessProbe:
    path: /
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3
  resources:
    limits:
      memory: 512Mi
      cpu: 500m
    requests:
      memory: 256Mi
      cpu: 100m

selectorLabels:
  app: admin-server

image:
  repository: 509194952955.dkr.ecr.us-east-2.amazonaws.com/springboot/admin-server
  tag: 'c84d2ef1'
  digest: sha256:84f9ec014d75b55392305baa32b39beecf5667b036ec91b4b6a57f6c34ab4c51

serviceAccount:
  enabled: false

secretStore:
  enabled: false

externalSecret:
  enabled: false

databaseMigration:
  enabled: false

deployment:
  enabled: true
  name: admin-server-deployment
  replicas: 1
  env:
    plain:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
  minReadySeconds: 30
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0

argoRollout:
  enabled: false

service:
  enabled: true
  name: admin-server
  port: 9090
  rolloutServices:
    enabled: false

virtualService:
  enabled: false
