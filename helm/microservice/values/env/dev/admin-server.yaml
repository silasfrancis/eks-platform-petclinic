namespace: petclinic
container:
  name: admin-server
  port: 9090
  readinessProbe:
    path: /
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3
  livenessProbe:
    path: /
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3
  resources:
    limits:
      memory: 512Mi
      cpu: 500m
    requests:
      memory: 256Mi
      cpu: 100m
selectorLabels:
  app: admin-server

image:
  repository: 509194952955.dkr.ecr.us-east-2.amazonaws.com/springboot/admin-server
  tag: '6af97245'
  digest: sha256:fd0b2c33bb05c605712ebf21b42b76377923ce07008ffbe983e500cb98a9a84e
  
serviceAccount:
  enabled: false

secretStore:
  enabled: false

externalSecret:
  enabled: false

databaseMigration:
  enabled: false

deployment:
  enabled: true
  name: admin-server-deployment
  replicas: 2
  env:
    plain:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server
  minReadySeconds: 30
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0

service:
  enabled: true
  name: admin-server
  port: 9090
  rolloutServices:
    enabled: false

virtualService:
  enabled: false