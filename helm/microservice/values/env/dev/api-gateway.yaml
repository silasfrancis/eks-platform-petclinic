createNamespace: false
namespace: petclinic
container:
  name: api-gateway
  port: 8080
  readinessProbe:
    path: /actuator/health
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3
  livenessProbe:
    path: /actuator/health
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3
  resources:
    limits:
      memory: 512Mi
      cpu: 500m
    requests:
      memory: 256Mi
      cpu: 100m
selectorLabels:
  app: api-gateway
image:
  repository: 509194952955.dkr.ecr.us-east-2.amazonaws.com/springboot/api-gateway
  tag: 'd3c821db'
  digest: sha256:c01eb7433be508608d7fc13151563c2d15e219a6e844b0a08ab53edbe727611f
serviceAccount:
  enabled: false
secretStore:
  enabled: false
externalSecret:
  enabled: false
databaseMigration:
  enabled: false
deployment:
  enabled: false
argoRollout:
  enabled: true
  name: api-gateway-rollout
  replicas: 2
  env:
    plain:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server
  minReadySeconds: 30
  revisionHistoryLimit: 5
  strategy:
    canary:
      maxSurge: 25%
      maxUnavailable: 0
      dynamicStableScale: true
      abortScaleDownDelaySeconds: 600
service:
  enabled: true
  name: api-gateway
  port: 8080
  rolloutServices:
    enabled: false
    stableService: api-gateway-stable-service
    canaryService: api-gateway-canary-service
virtualService:
  enabled: true
  name: api-gateway-vs
  gatewayRef:
    enabled: true
    namespace: istio-system
    name: petclinic-gateway
  http:
    route: primary
  hosts:
    - petclinic.lefrancis.org
