namespace: petclinic
container:
  name: admin-server
  port: 9090
  readinessProbe:
    path: /
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3
  livenessProbe:
    path: /
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3
  resources:
    limits:
      memory: 512Mi
      cpu: 500m
    requests:
      memory: 256Mi
      cpu: 100m
selectorLabels:
  app: admin-server
image:
  repository: 509194952955.dkr.ecr.us-east-2.amazonaws.com/springboot/admin-server
  tag: '81ba4e5e'
  digest: sha256:86a9f0ff87f474730548bc2771faf56f95585217d56d5be1ef176e0b6341b0af
serviceAccount:
  enabled: false
  name: admin-server-sa
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789:role/prod-secrets-reader"
secretStore:
  enabled: false
  name: admin-server-secretStore
  awsRegion: us-east-2
externalSecret:
  enabled: false
  name: admin-server-externalSecret
  refreshInterval: "5m"
  target:
    name: admin-server-secrets
    creationPolicy: Owner
  data:
    - secretKey: MYSQL_HOST
      remoteRef:
        key: dev/springboot-microservices
        property: MYSQL_HOST
    - secretKey: MYSQL_PASSWORD
      remoteRef:
        key: dev/springboot-microservices
        property: MYSQL_PASSWORD
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: dev/springboot-microservices
        property: OPENAI_API_KEY
databaseMigration:
  enabled: false
  name: admin-server-migrationJob
  backoffLimit: 3
  restartPolicy: Never
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
  env:
  secrets:
    - name: MYSQL_HOST
      secretName: admin-server-secrets
      secretKey: MYSQL_HOST
    - name: MYSQL_DATABASE
      secretName: admin-server-secrets
      secretKey: MYSQL_DATABASE
    - name: FLYWAY_USER
      secretName: admin-server-secrets
      secretKey: MYSQL_USER
    - name: FLYWAY_PASSWORD
      secretName: admin-server-secrets
      secretKey: MYSQL_PASSWORD
  plain:
    FLYWAY_URL: "jdbc:mysql://$(MYSQL_HOST):3306/$(MYSQL_DATABASE)"
deployment:
  enabled: true
  name: admin-server-deployment
  replicas: 2
  env:
    secrets:
      - name: MYSQL_HOST
        secretName: admin-server-secrets
        secretKey: MYSQL_HOST
      - name: MYSQL_USER
        secretName: admin-server-secrets
        secretKey: MYSQL_USER
      - name: MYSQL_PASSWORD
        secretName: admin-server-secrets
        secretKey: MYSQL_PASSWORD
      - name: OPENAI_API_KEY
        secretName: ai-secrets
        secretKey: OPENAI_API_KEY
    plain:
      SPRING_PROFILES_ACTIVE:
      CONFIG_SERVER_URL:
  minReadySeconds: 30
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
argoRollout:
  enabled: false
  name: admin-server-rollout
  replicas: 2
  env:
    secrets:
      - name: MYSQL_HOST
        secretName: admin-server-secrets
        secretKey: MYSQL_HOST
      - name: MYSQL_USER
        secretName: admin-server-secrets
        secretKey: MYSQL_USER
      - name: MYSQL_PASSWORD
        secretName: admin-server-secrets
        secretKey: MYSQL_PASSWORD
      - name: OPENAI_API_KEY
        secretName: ai-secrets
        secretKey: OPENAI_API_KEY
    plain:
      SPRING_PROFILES_ACTIVE:
      CONFIG_SERVER_URL:
  minReadySeconds: 30
  revisionHistoryLimit: 5
  strategy:
    canary:
      maxSurge: 25%
      maxUnavailable: 0
      dynamicStableScale: true
      abortScaleDownDelaySeconds: 600
service:
  name: admin-server-service
  port: 9090
  rolloutServices:
    enabled: false
    stableService: admin-server-stable-service
    canaryService: admin-server-canary-service
virtualService:
  enabled: false
  name: admin-server-vs
  gatewayRef:
    enabled: false
    namespace: istio-system
    name: petclinic-gateway
  http:
    route: primary
  hosts:
    - admin-server
