createNamespace: false
namespace: petclinic
container:
  name: discovery-server
  port: 8761
  readinessProbe:
    path: /
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3
  livenessProbe:
    path: /
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3
  resources:
    limits:
      memory: 512Mi
      cpu: 500m
    requests:
      memory: 256Mi
      cpu: 100m
selectorLabels:
  app: discovery-server
image:
  repository: 509194952955.dkr.ecr.us-east-2.amazonaws.com/springboot/discovery-server
  tag: 'c84d2ef1'
  digest: sha256:9fbc532bfa7447a9217c280f7a65fbfda8ba46bbe5f625c19aa01172dbbb252e
serviceAccount:
  enabled: false
secretStore:
  enabled: false
externalSecret:
  enabled: false
databaseMigration:
  enabled: false
deployment:
  enabled: true
  name: discovery-server-deployment
  replicas: 2
  env:
    plain:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
  minReadySeconds: 30
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
argoRollout:
  enabled: false
service:
  enabled: true
  name: discovery-server
  port: 8761
  rolloutServices:
    enabled: false
virtualService:
  enabled: false
