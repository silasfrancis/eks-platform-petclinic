namespace: petclinic

container:
  name: genai-service
  port: 8084
  readinessProbe:
    path: /
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3
  livenessProbe:
    path: /
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3
  resources:
    limits:
      memory: 512Mi
      cpu: 500m
    requests:
      memory: 256Mi
      cpu: 100m

selectorLabels:
  app: genai-service
image:
  repository: 509194952955.dkr.ecr.us-east-2.amazonaws.com/springboot/genai-service
  tag: '6af97245'
  digest: sha256:2497981a898654d88ccfb08a37ca7da2cacb6a70e7a47cab8e7684a5392a04db
serviceAccount:
  enabled: true
  name: genai-service
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789:role/prod-secrets-reader"

secretStore:
  enabled: true
  kind: SecretStore
  name: genai-service-secretStore
  awsRegion: us-east-2

externalSecret:
  enabled: true
  name: genai-service-externalSecret
  refreshInterval: "5m"
  target:
    name: genai-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: dev/springboot-microservices
        property: OPENAI_API_KEY

databaseMigration:
  enabled: false

deployment:
  enabled: false

argoRollout:
  enabled: true
  name: admin-server-rollout
  replicas: 2
  env:
    secrets:
      - name: OPENAI_API_KEY
        secretName: genai-service-secrets
        secretKey: OPENAI_API_KEY
    plain:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server
  minReadySeconds: 30
  revisionHistoryLimit: 5
  strategy:
    canary:
      maxSurge: 25%
      maxUnavailable: 0
      dynamicStableScale: true
      abortScaleDownDelaySeconds: 600

service:
  enabled: true
  name: genai-service-service
  port: 8084
  rolloutServices:
    enabled: false
    stableService: genai-service-stable-service
    canaryService: genai-service-canary-service

virtualService:
  enabled: true
  name: genai-service-vs
  gatewayRef:
    enabled: false
  http:
    route: primary
  hosts:
    - genai-service-stable-service
