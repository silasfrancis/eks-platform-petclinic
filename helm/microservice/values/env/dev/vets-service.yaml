namespace: petclinic

container:
  name: vets-service
  port: 8083
  readinessProbe:
    path: /actuator/health
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3
  livenessProbe:
    path: /actuator/health
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3
  resources:
    limits:
      memory: 512Mi
      cpu: 500m
    requests:
      memory: 256Mi
      cpu: 100m

selectorLabels:
  app: vets-service

image:
  repository: 509194952955.dkr.ecr.us-east-2.amazonaws.com/springboot/vets-service
  tag: '6af97245'
  digest: sha256:dcaba36f32d31d5cfdaeb7ce21662e51e6017b5d2d7e81c99b950e9cc843d673
serviceAccount:
  enabled: true
  name: vets-service-sa
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789:role/prod-secrets-reader"

secretStore:
  enabled: true
  kind: SecretStore
  name: vets-service-secret-store
  awsRegion: us-east-2

externalSecret:
  enabled: true
  name: vets-service-external-secret
  refreshInterval: "5m"
  target:
    name: vets-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: MYSQL_HOST
      remoteRef:
        key: dev/springboot-microservices
        property: MYSQL_HOST
    - secretKey: MYSQL_PASSWORD
      remoteRef:
        key: dev/springboot-microservices
        property: MYSQL_PASSWORD
    - secretKey: MYSQL_USER
      remoteRef:
        key: dev/springboot-microservices
        property: MYSQL_USER
    - secretKey: MYSQL_DATABASE
      remoteRef:
        key: dev/springboot-microservices
        property: MYSQL_DATABASE

databaseMigration:
  enabled: false

deployment:
  enabled: false

argoRollout:
  enabled: true
  name: vets-service-rollout
  replicas: 2
  env:
    secrets:
      - name: MYSQL_HOST
        secretName: vets-service-secrets
        secretKey: MYSQL_HOST
      - name: MYSQL_USER
        secretName: vets-service-secrets
        secretKey: MYSQL_USER
      - name: MYSQL_PASSWORD
        secretName: vets-service-secrets
        secretKey: MYSQL_PASSWORD
      - name: MYSQL_DATABASE
        secretName: vets-service-secrets
        secretKey: MYSQL_DATABASE
    plain:
      SPRING_PROFILES_ACTIVE: docker,mysql
      CONFIG_SERVER_URL: http://config-server
  minReadySeconds: 30
  revisionHistoryLimit: 5
  strategy:
    canary:
      maxSurge: 25%
      maxUnavailable: 0
      dynamicStableScale: true
      abortScaleDownDelaySeconds: 600

service:
  enabled: true
  name: vets-service
  port: 8083
  rolloutServices:
    enabled: true
    stableService: vets-service-stable-service
    canaryService: vets-service-canary-service

virtualService:
  enabled: true
  name: vets-service-vs
  gatewayRef:
    enabled: false
  http:
    route: primary
  hosts:
    - vets-service-stable-service