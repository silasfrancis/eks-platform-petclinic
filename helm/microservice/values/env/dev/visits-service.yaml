createNamespace: false
namespace: petclinic

container:
  name: visits-service
  port: 8082
  readinessProbe:
    path: /actuator/health
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3
  livenessProbe:
    path: /actuator/health
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3
  resources:
    limits:
      memory: 512Mi
      cpu: 500m
    requests:
      memory: 256Mi
      cpu: 100m

selectorLabels:
  app: visits-service

image:
  repository: 509194952955.dkr.ecr.us-east-2.amazonaws.com/springboot/visits-service
  tag: 'c84d2ef1'
  digest: sha256:645bd27097990ae8ba928f97ec6d954c4e166231ae8b381ecda2be4cf99b9862

serviceAccount:
  enabled: true
  name: visits-service-sa
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::509194952955:role/dev-visits-service-sa-pod-secrets-reader"

secretStore:
  enabled: true
  kind: SecretStore
  name: visits-service-secret-store
  awsRegion: us-east-2

externalSecret:
  enabled: true
  name: visits-service-external-secret
  refreshInterval: "5m"
  target:
    name: visits-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: MYSQL_HOST
      remoteRef:
        key: dev/springboot-microservices
        property: MYSQL_HOST
    - secretKey: MYSQL_PASSWORD
      remoteRef:
        key: dev/springboot-microservices
        property: MYSQL_PASSWORD
    - secretKey: MYSQL_USER
      remoteRef:
        key: dev/springboot-microservices
        property: MYSQL_USER
    - secretKey: MYSQL_DATABASE
      remoteRef:
        key: dev/springboot-microservices
        property: MYSQL_DATABASE

databaseMigration:
  enabled: false

deployment:
  enabled: false

argoRollout:
  enabled: true
  name: visits-service-rollout
  replicas: 1
  env:
    secrets:
      - name: MYSQL_HOST
        secretName: visits-service-secrets
        secretKey: MYSQL_HOST
      - name: MYSQL_USER
        secretName: visits-service-secrets
        secretKey: MYSQL_USER
      - name: MYSQL_PASSWORD
        secretName: visits-service-secrets
        secretKey: MYSQL_PASSWORD
      - name: MYSQL_DATABASE
        secretName: visits-service-secrets
        secretKey: MYSQL_DATABASE
    plain:
      SPRING_PROFILES_ACTIVE: docker,mysql
      CONFIG_SERVER_URL: http://config-server:8888
  minReadySeconds: 30
  revisionHistoryLimit: 5
  strategy:
    canary:
      maxSurge: 25%
      maxUnavailable: 0
      dynamicStableScale: true
      abortScaleDownDelaySeconds: 600

service:
  enabled: true
  name: visits-service
  port: 8082
  rolloutServices:
    enabled: true
    stableService: visits-service
    canaryService: visits-service-canary
    
virtualService:
  enabled: true
  name: visits-service-vs
  gatewayRef:
    enabled: false
  http:
    route: primary
  hosts:
    - visits-service
