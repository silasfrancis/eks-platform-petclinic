{{- if .Values.gateway.enabled }}
apiVersion: networking.istio.io/v1
kind: Gateway 
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.namespace }}
  {{- with .Values.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.selectors }}
  selector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  servers:
    {{- toYaml .Values.gateway.servers | nindent 4 }}
{{- end }}