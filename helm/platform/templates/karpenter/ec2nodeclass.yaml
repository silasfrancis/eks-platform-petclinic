# platform/templates/karpenter/ec2nodeclass.yaml
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: ${ENV}-${APP}-node-class
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${CLUSTER_NAME}"

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${CLUSTER_NAME}"

  # ---- IAM -----------------------------------------------
  # Just the role name — not ARN
  # Matches your existing node role
  role: "${ENV}-${APP}-node-role"

  kubelet:
    podsPerCore: 2
    maxPods: 20

    systemReserved:
      cpu: 100m
      memory: 100Mi
      ephemeral-storage: 1Gi

    kubeReserved:
      cpu: 200m
      memory: 100Mi
      ephemeral-storage: 3Gi

    evictionHard:
      memory.available: 5%
      nodefs.available: 10%
      nodefs.inodesFree: 10%

    evictionSoft:
      memory.available: 500Mi
      nodefs.available: 15%
      nodefs.inodesFree: 15%

    evictionSoftGracePeriod:
      memory.available: 1m
      nodefs.available: 1m30s
      nodefs.inodesFree: 2m

    evictionMaxPodGracePeriod: 60

    imageGCHighThresholdPercent: 85
    imageGCLowThresholdPercent: 80

    cpuCFSQuota: true

    # CoreDNS ClusterIP — default for EKS with 172.20.0.0/16 service CIDR
    # Verify with: kubectl get svc kube-dns -n kube-system
    clusterDNS:
      - "172.20.0.10" #kubectl get svc kube-dns -n kube-system -o jsonpath='{.spec.clusterIP}'

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 20Gi
        volumeType: gp3
        encrypted: true
        kmsKeyID: "${KMS_KEY_ARN}"
        deleteOnTermination: true

  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1 
    httpTokens: required 

  tags:
    Environment: "${ENV}"
    ManagedBy: karpenter
    Application: "${APP}"