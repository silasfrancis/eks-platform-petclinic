apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: spot
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  template:
    metadata:
      labels:
        node-type: spot
        workload-tier: dev

    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      # ---- Cilium startup taint --------------------------
      startupTaints:
        - key: node.cilium.io/agent-not-ready
          value: "true"
          effect: NoExecute

      # ---- SPOT taint ------------------------------------
      # Only pods that explicitly tolerate SPOT land here
      taints:
        - key: spot
          value: "true"
          effect: NoSchedule

      # ---- Requirements ----------------------------------
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]

        - key: kubernetes.io/os
          operator: In
          values: ["linux"]

        # SPOT only
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]

        # Wider instance family selection for SPOT
        # More diversity = better SPOT availability
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["t", "m", "c", "r"]

        - key: karpenter.k8s.aws/instance-family
          operator: In
          values:
            - t4g
            - m6g
            - m7g
            - c6g
            - c7g
            - r6g     # memory optimized — good for JVM workloads
            - r7g

        - key: karpenter.k8s.aws/instance-generation
          operator: Gte
          values: ["6"]

        - key: karpenter.k8s.aws/instance-hypervisor
          operator: In
          values: ["nitro"]

        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - us-east-2a
            - us-east-2b
            - us-east-2c

      # ---- Node lifetime ---------------------------------
      # Recycle SPOT nodes every 24h — reduces blast radius
      # of long-running SPOT nodes getting interrupted
      expireAfter: 24h

      terminationGracePeriod: 24h

  # ---- Disruption ----------------------------------------
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m    # more aggressive than ON_DEMAND

    # No business hours protection — SPOT is interruptible anyway
    budgets:
      - nodes: "20%"    # can disrupt up to 20% at once

  # ---- Limits --------------------------------------------
  limits:
    cpu: "10"
    memory: 40Gi
    nodes: 4         # max 4 SPOT nodes

  # ---- Weight --------------------------------------------
  # Lower weight = only used when pods explicitly target SPOT
  weight: 1