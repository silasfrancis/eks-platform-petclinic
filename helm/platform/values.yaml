kube-prometheus-stack:

  crds:
    upgradeJob:
      enabled: true

  kubeEtcd:
    enabled: false

  kubeControllerManager:
    enabled: false

  kubeScheduler:
    enabled: false

  kubeProxy:
    enabled: false

  prometheus:
    prometheusSpec:

      # Discover ServiceMonitors in any namespace
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelector: {}
      serviceMonitorNamespaceSelector: {}

      # Discover PodMonitors in any namespace
      podMonitorSelectorNilUsesHelmValues: false
      podMonitorSelector: {}
      podMonitorNamespaceSelector: {}

      # Discover PrometheusRules in any namespace
      ruleSelectorNilUsesHelmValues: false
      ruleSelector: {}
      ruleNamespaceSelector: {}

      # Retention
      retention: 15d
      retentionSize: "10GB"

      # Persistent storage using EKS gp3
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: gp3
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi

  grafana:
    adminPassword: "changeme"  # override via ESO in production

    persistence:
      enabled: true
      type: sts
      storageClassName: gp3
      accessModes:
        - ReadWriteOnce
      size: 5Gi

    sidecar:
      dashboards:
        enabled: true
        searchNamespace: ALL  
        label: grafana_dashboard
        labelValue: "1"
      datasources:
        enabled: true
        uid: prometheus       

  alertmanager:
    alertmanagerSpec:
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: gp3
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 2Gi

    config:
      global:
        resolve_timeout: 5m
      route:
        group_by: ['namespace', 'alertname', 'severity']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        receiver: 'null'
        routes:
          - receiver: 'null'
            matchers:
              - alertname = "Watchdog"
      receivers:
        - name: 'null'   # replace with Slack/email later

prometheus-cloudwatch-exporter:
  enabled: true

  aws:
    stsRegional:
      enabled: true         # use regional STS endpoint for us-east-2

  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::<account-id>:role/<cluster-name>-cloudwatch-exporter"
      eks.amazonaws.com/sts-regional-endpoints: "true"

  config: |-
    region: us-east-2
    period_seconds: 60
    metrics:
      - aws_namespace: AWS/RDS
        aws_metric_name: CPUUtilization
        aws_dimensions: [DBInstanceIdentifier]
        aws_statistics: [Average]

      - aws_namespace: AWS/RDS
        aws_metric_name: DatabaseConnections
        aws_dimensions: [DBInstanceIdentifier]
        aws_statistics: [Average]

      - aws_namespace: AWS/RDS
        aws_metric_name: FreeableMemory
        aws_dimensions: [DBInstanceIdentifier]
        aws_statistics: [Average]

      - aws_namespace: AWS/RDS
        aws_metric_name: FreeStorageSpace
        aws_dimensions: [DBInstanceIdentifier]
        aws_statistics: [Average]

      - aws_namespace: AWS/RDS
        aws_metric_name: ReadLatency
        aws_dimensions: [DBInstanceIdentifier]
        aws_statistics: [Average]

      - aws_namespace: AWS/RDS
        aws_metric_name: WriteLatency
        aws_dimensions: [DBInstanceIdentifier]
        aws_statistics: [Average]

      - aws_namespace: AWS/RDS
        aws_metric_name: ReadIOPS
        aws_dimensions: [DBInstanceIdentifier]
        aws_statistics: [Average]

      - aws_namespace: AWS/RDS
        aws_metric_name: WriteIOPS
        aws_dimensions: [DBInstanceIdentifier]
        aws_statistics: [Average]

  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: 60s
    labels:
      release: kube-prometheus-stack    # must match Prometheus selector

  securityContext:
    runAsUser: 65534
    fsGroup: 65534