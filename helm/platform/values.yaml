kube-prometheus-stack:

  crds:
    upgradeJob:
      enabled: true

  kubeEtcd:
    enabled: false

  kubeControllerManager:
    enabled: false

  kubeScheduler:
    enabled: false

  kubeProxy:
    enabled: false

  prometheus:
    prometheusSpec:

      # Discover ServiceMonitors in any namespace
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelector: {}
      serviceMonitorNamespaceSelector: {}

      # Discover PodMonitors in any namespace
      podMonitorSelectorNilUsesHelmValues: false
      podMonitorSelector: {}
      podMonitorNamespaceSelector: {}

      # Discover PrometheusRules in any namespace
      ruleSelectorNilUsesHelmValues: false
      ruleSelector: {}
      ruleNamespaceSelector: {}

      # Retention
      retention: 15d
      retentionSize: "10GB"

      # Persistent storage using EKS gp3
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: gp3
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi

  grafana:
    # adminPassword: "changeme"  # override via ESO in production
    admin:
      ## Name of the secret. Can be templated.
      existingSecret: ""
      userKey: admin-user
      passwordKey: admin-password

    persistence:
      enabled: true
      type: sts
      storageClassName: gp3
      accessModes:
        - ReadWriteOnce
      size: 5Gi

    sidecar:
      dashboards:
        enabled: true
        searchNamespace: ALL  
        label: grafana_dashboard
        labelValue: "1"
      datasources:
        enabled: true
        uid: prometheus       

  alertmanager:
    # Mount the ESO-synced secret into Alertmanager
    alertmanagerSpec:
      secrets:
        - alertmanager-receivers-secret    # ESO creates this

    config:
      global:
        resolve_timeout: 5m
        # Email global config
        smtp_smarthost: 'smtp.zoho.com:587'
        smtp_from: 'alerts@lefrancis.org'
        smtp_auth_username: 'silas@lefrancis.org'
        smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-receivers-secret/email-password
        smtp_require_tls: true

      # Inhibition rules — suppress warnings when critical is firing
      inhibit_rules:
        - source_matchers:
            - severity = critical
          target_matchers:
            - severity = warning
          equal:
            - namespace
            - alertname

      # Routing tree
      route:
        group_by: ['namespace', 'alertname', 'severity']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 3h
        receiver: 'null'
        routes:
          # Silence Watchdog — it's a heartbeat alert not a real alert
          - receiver: 'null'
            matchers:
              - alertname = "Watchdog"

          # Critical — Slack + Email
          - receiver: 'critical-receiver'
            matchers:
              - severity = critical
            continue: false

          # Warning — Slack only
          - receiver: 'warning-receiver'
            matchers:
              - severity = warning
            continue: false

      receivers:
        - name: 'null'

        - name: 'warning-receiver'
          slack_configs:
            - api_url_file: /etc/alertmanager/secrets/alertmanager-receivers-secret/slack-webhook-url
              channel: '#petclinic-warnings'
              send_resolved: true
              title: |-
                [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
              text: |-
                {{ range .Alerts }}
                *Severity:* {{ .Labels.severity }}
                *Namespace:* {{ .Labels.namespace }}
                *Description:* {{ .Annotations.description }}
                *Runbook:* {{ .Annotations.runbook_url }}
                {{ end }}

        - name: 'critical-receiver'
          slack_configs:
            - api_url_file: /etc/alertmanager/secrets/alertmanager-receivers-secret/slack-webhook-url
              channel: '#petclinic-critical'
              send_resolved: true
              title: |-
                [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
              text: |-
                {{ range .Alerts }}
                *Severity:* {{ .Labels.severity }}
                *Namespace:* {{ .Labels.namespace }}
                *Description:* {{ .Annotations.description }}
                *Runbook:* {{ .Annotations.runbook_url }}
                {{ end }}
          email_configs:
            - to: 'silas@lefrancis.org'
              send_resolved: true
              headers:
                Subject: '[CRITICAL] {{ .CommonLabels.alertname }} - {{ .CommonLabels.namespace }}'

      templates:
        - '/etc/alertmanager/config/*.tmpl'


prometheus-cloudwatch-exporter:
  enabled: true

  aws:
    stsRegional:
      enabled: true         # use regional STS endpoint for us-east-2

  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::<account-id>:role/<cluster-name>-cloudwatch-exporter"
      eks.amazonaws.com/sts-regional-endpoints: "true"

  config: |-
    region: us-east-2
    period_seconds: 60
    metrics:
      - aws_namespace: AWS/RDS
        aws_metric_name: CPUUtilization
        aws_dimensions: [DBInstanceIdentifier]
        aws_statistics: [Average]

      - aws_namespace: AWS/RDS
        aws_metric_name: DatabaseConnections
        aws_dimensions: [DBInstanceIdentifier]
        aws_statistics: [Average]

      - aws_namespace: AWS/RDS
        aws_metric_name: FreeableMemory
        aws_dimensions: [DBInstanceIdentifier]
        aws_statistics: [Average]

      - aws_namespace: AWS/RDS
        aws_metric_name: FreeStorageSpace
        aws_dimensions: [DBInstanceIdentifier]
        aws_statistics: [Average]

      - aws_namespace: AWS/RDS
        aws_metric_name: ReadLatency
        aws_dimensions: [DBInstanceIdentifier]
        aws_statistics: [Average]

      - aws_namespace: AWS/RDS
        aws_metric_name: WriteLatency
        aws_dimensions: [DBInstanceIdentifier]
        aws_statistics: [Average]

      - aws_namespace: AWS/RDS
        aws_metric_name: ReadIOPS
        aws_dimensions: [DBInstanceIdentifier]
        aws_statistics: [Average]

      - aws_namespace: AWS/RDS
        aws_metric_name: WriteIOPS
        aws_dimensions: [DBInstanceIdentifier]
        aws_statistics: [Average]

  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: 60s
    labels:
      release: kube-prometheus-stack    # must match Prometheus selector

  securityContext:
    runAsUser: 65534
    fsGroup: 65534