apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: discovery-server-netpol
  namespace: {{ .Values.namespaces.app }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.matchLabels.discoveryServer }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: {{ .Values.ports.discoveryServer }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: {{ .Values.matchLabels.configServer }}
      ports:
        - port: {{ .Values.ports.configServer }}