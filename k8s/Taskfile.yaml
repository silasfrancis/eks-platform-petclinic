version: '3'

env:
  ENV: "dev"
  GATEWAY_API_VERSION: "v1.5.0"
  ISTIO_VERSION: "1.29.1"
  ARGOCD_VERSION: "v3.3.2"
  ARGO_ROLLOUTS_VERSION: "v1.8.3"
  CILIUM_VERSION: "1.19.3"
  METRICS_SERVER_VERSION: "3.12.2"
  CLUSTER_NAMES:
    dev: "dev-petclinic-cluster"
    main: "main-petclinic-cluster"

tasks:

  setup_helm_repos:
    desc: "Add and update all Helm repositories"
    cmds:
      - helm repo add cilium https://helm.cilium.io/ --force-update
      - helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/ --force-update
      - helm repo add istio https://istio-release.storage.googleapis.com/charts
      - helm repo add fairwinds-stable https://charts.fairwinds.com/stable
      - helm repo add external-secrets https://charts.external-secrets.io
      - helm repo update

  # Network

  install_cilium:
    desc: "Install Cilium CNI"
    cmds:
      - |
        helm upgrade --install cilium cilium/cilium \
          --version {{ .CILIUM_VERSION }} \
          --namespace kube-system \
          --values k8s/bootstrap/cilium/values.yaml \
          --set cluster.name={{ index .CLUSTER_NAMES .ENV }} \
          --wait \
          --timeout 5m
      - kubectl rollout status daemonset/cilium -n kube-system --timeout=5m
    preconditions:
      - sh: kubectl get nodes
        msg: "kubectl cannot reach cluster — check kubeconfig"

  verify_cilium:
    desc: "Verify Cilium"
    cmds:
      - kubectl get pods -n kube-system -l k8s-app=cilium
      - kubectl get pods -n kube-system -l name=cilium-operator
      - cilium status --wait 2>/dev/null || echo "cilium CLI not installed"

  upgrade_cilium:
    desc: "Upgrade Cilium"
    cmds:
      - |
        helm upgrade cilium cilium/cilium \
          --version {{ .CILIUM_VERSION }} \
          --namespace kube-system \
          --values k8s/bootstrap/cilium/values.yaml \
          --set cluster.name={{ index .CLUSTER_NAMES .ENV }} \
          --wait \
          --timeout 10m

  # Core System

  install_metrics_server:
    desc: "Install metrics-server"
    cmds:
      - |
        helm upgrade --install metrics-server metrics-server/metrics-server \
          --version {{ .METRICS_SERVER_VERSION }} \
          --namespace kube-system \
          --values k8s/bootstrap/metrics-server/values.yaml \
          --wait \
          --timeout 3m
      - kubectl rollout status deployment/metrics-server -n kube-system --timeout=3m
    preconditions:
      - sh: kubectl get nodes
        msg: "kubectl cannot reach cluster — check kubeconfig"

  verify_metrics_server:
    desc: "Verify metrics-server"
    cmds:
      - kubectl top nodes
      - kubectl top pods -n kube-system

  upgrade_metrics_server:
    desc: "Upgrade metrics-server"
    cmds:
      - |
        helm upgrade metrics-server metrics-server/metrics-server \
          --version {{ .METRICS_SERVER_VERSION }} \
          --namespace kube-system \
          --values k8s/bootstrap/metrics-server/values.yaml \
          --wait \
          --timeout 3m

  # CRDs

  install_istio_base:
    desc: "Install Istio base"
    cmds:
      - |
        helm upgrade --install istio-base istio/base \
          -n istio-system \
          --create-namespace \
          --version {{ .ISTIO_VERSION }} \
          --set defaultRevision=default \
          --wait --timeout 5m --atomic

  install_external_secrets:
    desc: "Install External Secrets"
    cmds:
      - |
        helm upgrade --install external-secrets \
          external-secrets/external-secrets \
          -n external-secrets \
          --create-namespace \
          --wait

  install_vpa:
    desc: "Install VPA"
    cmds:
      - |
        helm upgrade --install vpa fairwinds-stable/vpa \
          -n vpa-system \
          --create-namespace \
          --set updater.enabled=false \
          --set admissionController.enabled=false \
          --wait

  # Control Planes

  install_istiod:
    desc: "Install Istiod"
    cmds:
      - |
        helm upgrade --install istiod istio/istiod \
          -n istio-system \
          --version {{ .ISTIO_VERSION }} \
          --wait --timeout 5m --atomic \
          --set pilot.resources.requests.cpu=100m \
          --set pilot.resources.requests.memory=256Mi \
          --set global.proxy.resources.requests.cpu=50m \
          --set global.proxy.resources.requests.memory=128Mi

  wait_for_istio:
    desc: "Wait for Istio"
    cmd: kubectl wait --for=condition=available deployment --all -n istio-system --timeout=180s

  install_argo_rollouts:
    desc: "Install Argo Rollouts"
    cmds:
      - kubectl create namespace argo-rollouts --dry-run=client -o yaml | kubectl apply -f -
      - |
        kubectl apply -n argo-rollouts \
          -f https://github.com/argoproj/argo-rollouts/releases/download/{{ .ARGO_ROLLOUTS_VERSION }}/install.yaml
      - kubectl wait --for=condition=available deployment --all -n argo-rollouts --timeout=180s

  install_argocd:
    desc: "Install ArgoCD"
    cmds:
      - kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
      - |
        kubectl apply -n argocd \
          --server-side \
          --force-conflicts \
          -f https://raw.githubusercontent.com/argoproj/argo-cd/{{ .ARGOCD_VERSION }}/manifests/install.yaml
      - kubectl wait --for=condition=available deployment --all -n argocd --timeout=300s

  # GitOps

  deploy_root_app:
    desc: "Deploy root app"
    cmds:
      - kubectl apply -f k8s/argocd/root-app.yaml
      - echo "Root app deployed — ArgoCD syncing all applications"

  # Utilities

  argocd_password:
    desc: "Get ArgoCD admin password"
    cmd: kubectl get secret argocd-initial-admin-secret -n argocd -o jsonpath="{.data.password}" | base64 -d && echo

  argocd_port_forward:
    desc: "Port forward ArgoCD UI"
    cmd: kubectl port-forward svc/argocd-server -n argocd 8080:443

  argocd_sync_all:
    desc: "Sync all ArgoCD apps"
    cmd: argocd app sync --all

  argocd_status:
    desc: "Check ArgoCD apps"
    cmd: argocd app list

  install_argo_rollouts_plugin:
    desc: "Install Argo Rollouts plugin"
    cmds:
      - curl -LO https://github.com/argoproj/argo-rollouts/releases/download/{{ .ARGO_ROLLOUTS_VERSION }}/kubectl-argo-rollouts-linux-amd64
      - chmod +x kubectl-argo-rollouts-linux-amd64
      - sudo mv kubectl-argo-rollouts-linux-amd64 /usr/local/bin/kubectl-argo-rollouts
      - kubectl argo rollouts version

  deps:
    desc: "Update Helm dependencies"
    cmds:
      - helm dependency update k8s/argocd/install/
      - helm dependency update k8s/platform/monitoring/
      - helm dependency update k8s/platform/compute/
      - helm dependency update k8s/platform/autoscaling/
      - helm dependency update k8s/platform/security/
      - helm dependency update k8s/platform/backup/
      - helm dependency update k8s/platform/ingress/
      - helm dependency update k8s/policies/

  # Main Entrypoint

  bootstrap:
    desc: "Full cluster bootstrap"
    cmds:
      - task: setup_helm_repos

      - task: install_cilium
      - task: verify_cilium

      - task: install_metrics_server
      - task: verify_metrics_server

      - task: install_istio_base
      - task: install_external_secrets
      - task: install_vpa

      - task: install_istiod
      - task: wait_for_istio

      - task: install_argo_rollouts
      - task: install_argocd

      - task: deploy_root_app