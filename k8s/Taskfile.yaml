version: "3"

vars:
  ENV: '{{.ENV | default "dev"}}'

env:
  AWS_REGION: "us-east-2"
  METRICS_SERVER_VERSION: "3.12.2"
  ISTIO_VERSION: "1.29.1"
  ARGOCD_VERSION: "v9.5.0"
  ARGO_ROLLOUTS_VERSION: "v2.40.5"
  CERT_MANAGER_VERSION: "v1.12.1"
  AWS_LB_CONTROLLER_VERSION: "3.3.0"

tasks:
  setup_helm_repos:
    desc: "Add helm repos"
    cmds:
      - helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server --force-update
      - helm repo add istio https://istio-release.storage.googleapis.com/charts --force-update
      - helm repo add fairwinds-stable https://charts.fairwinds.com/stable  --force-update
      - helm repo add external-secrets https://charts.external-secrets.io --force-update
      - helm repo add argo https://argoproj.github.io/argo-helm --force-update
      - helm repo add jetstack https://charts.jetstack.io --force-update
      - helm repo add eks https://aws.github.io/eks-charts --force-update
      - helm repo update

  install_metrics_server:
    desc: "Install metrics-server"
    cmds:
      - |
        helm upgrade --install metrics-server metrics-server/metrics-server \
          --version {{.METRICS_SERVER_VERSION}} \
          -n kube-system \
          --values bootstrap/metrics-server/values.yaml

  install_aws_lb_controller:
    desc: "Install AWS Load Balancer Controller"
    requires:
      vars: [CLUSTER_NAME, ENV]
    cmds:
      - |
        LBC_ROLE_ARN=$(terraform -chdir=../terraform/env/{{.ENV}} output -raw alb_controller_irsa_role_arn)
        VPC_ID=$(terraform -chdir=../terraform/env/{{.ENV}} output -raw vpc_id)
        
        helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
          --version {{.AWS_LB_CONTROLLER_VERSION}} \
          -n kube-system \
          --set clusterName={{.CLUSTER_NAME}} \
          --set serviceAccount.create=true \
          --set serviceAccount.name=aws-load-balancer-controller \
          --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=$LBC_ROLE_ARN \
          --set region={{.AWS_REGION}} \
          --set vpcId=$VPC_ID

  install_external_secrets:
    desc: "Install External Secrets"
    cmds:
      - |
        helm upgrade --install external-secrets \
          external-secrets/external-secrets \
          -n external-secrets \
          --create-namespace 

  install_vpa:
    desc: "Install VPA (Recommendation mode)"
    cmds:
      - |
        helm upgrade --install vpa fairwinds-stable/vpa \
          -n vpa \
          --create-namespace \
          --set updater.enabled=false \
          --set admissionController.enabled=false 

  install_istio_base:
    desc: "Install Istio base"
    cmds:
      - |
        helm upgrade --install istio-base istio/base \
          -n istio-system \
          --create-namespace \
          --version {{.ISTIO_VERSION}}

  install_istiod:
    desc: "Install Istiod"
    cmds:
      - |
        helm upgrade --install istiod istio/istiod \
          -n istio-system \
          --create-namespace \
          --version {{.ISTIO_VERSION}} 

  install_argocd:
    desc: "Install ArgoCD"
    cmds:
      - |
        helm upgrade --install argocd argo/argo-cd \
          --namespace argocd \
          --create-namespace \
          --version {{.ARGOCD_VERSION}} \
          --set server.extraArgs={--insecure}

  install_rollouts:
    desc: "Install Argo Rollouts"
    cmds:
      - |
        helm upgrade --install argo-rollouts argo/argo-rollouts \
          --namespace argo-rollouts \
          --create-namespace \
          --version {{.ARGO_ROLLOUTS_VERSION}}

  install_cert_manager:
    desc: "Install cert-manager with CRDs"
    cmds:
      - |
        helm upgrade --install cert-manager jetstack/cert-manager \
          --namespace cert-manager \
          --create-namespace \
          --version {{.CERT_MANAGER_VERSION}} \
          --set installCRDs=true

  get_argo_pwd:
    desc: "Retrieve ArgoCD initial admin password"
    cmds:
      - kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d; echo

  bootstrap_storage_and_namespaces:
    desc: "Apply Namespaces and StorageClass"
    cmds:
      - kubectl apply -f bootstrap/namespaces.yaml
      - kubectl apply -f bootstrap/storage-class.yaml

  deploy_argocd_apps:
    desc: "Deploy ArgoCD app-of-apps chart"
    cmds:
      - |
        helm upgrade --install argocd-apps k8s/argocd \
          --namespace argocd \
          --create-namespace \
          --values k8s/argocd/values.yaml \
          --values k8s/argocd/values/env/{{.ENV}}/values.yaml

  deploy_platform:
    desc: "Deploy all platform charts"

    requires:
      vars: [ENV]

    vars:
      PLATFORM_CHARTS:
        - autoscaling
        - backup
        - karpenter
        - ingress
        - monitoring
        - security

    cmds:
      - for: { var: PLATFORM_CHARTS }
        cmd: |
          helm upgrade --install {{.ITEM}} k8s/platform/{{.ITEM}}/charts \
            --namespace {{.ITEM}} \
            --create-namespace \
            --values k8s/platform/{{.ITEM}}/values.yaml \
            --values k8s/platform/{{.ITEM}}/values/env/{{.ENV}}/values.yaml

  deploy_policies:
    desc: "Deploy Kyverno policies chart"
    requires:
      vars: [ENV]
    cmds:
      - |
        helm upgrade --install policies k8s/policies/charts \
          --namespace kyverno \
          --values k8s/policies/values.yaml \
          --values k8s/policies/values/env/{{.ENV}}/values.yaml

  deploy_microservices:
    desc: "Deploy all microservices"

    requires:
      vars: [ENV]

    vars:
      SERVICES:
        - admin-server
        - api-gateway
        - config-server
        - customers-service
        - discovery-server
        - genai-service
        - vets-service
        - visits-service

    cmds:
      - for: { var: SERVICES }
        cmd: |
          helm upgrade --install {{.ITEM}} k8s/microservice/charts \
            --namespace petclinic \
            --create-namespace \
            --values k8s/microservice/values.yaml \
            --values k8s/microservice/values/env/{{.ENV}}/{{.ITEM}}.yaml

  full_cluster_bootstrap:
    desc: "Full cluster bootstrap"
    requires:
      vars: [CLUSTER_NAME, ENV]
    cmds:
      # - task: setup_helm_repos
      - task: install_metrics_server
      - task: install_aws_lb_controller
        vars: { CLUSTER_NAME: "{{.CLUSTER_NAME}}", ENV: "{{.ENV}}" }
      - task: install_external_secrets
      - task: install_vpa
      - task: install_istio_base
      - task: install_istiod
      - task: install_rollouts
      - task: install_argocd
      - task: apply_bootstrap_namespaces
      
  deploy_all:
    desc: "Deploy platform, policies, and microservices for ENV"
    requires:
      vars: [ENV]

    cmds:
      - task: deploy_platform
        vars:
          ENV: "{{.ENV}}"

      - task: deploy_policies
        vars:
          ENV: "{{.ENV}}"

      - task: deploy_microservices
        vars:
          ENV: "{{.ENV}}"

      - task: deploy_argocd_apps
        vars:
          ENV: "{{.ENV}}"