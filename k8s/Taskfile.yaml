# Kubernetes bootstrap and platform operations
version: "3"

vars:
  # TARGET_CLUSTER determines the EKS cluster name for Helm/Kubectl commands.
  # If passed via CLI (e.g., task bootstrap CLUSTER_NAME=custom-eks)
  # Defaults to 'prod-petclinic-cluster' if ENV=main
  # Defaults to 'dev-petclinic-cluster' for all other cases (ENV=dev)
  TARGET_CLUSTER: '{{.CLUSTER_NAME | default (if eq .ENV "main" then "prod-petclinic-cluster" else "dev-petclinic-cluster")}}'

env:
  CILIUM_VERSION: "1.19.3"
  METRICS_SERVER_VERSION: "3.12.2"
  ISTIO_VERSION: "1.29.1"
  ARGOCD_VERSION: "v3.3.2"
  ARGO_ROLLOUTS_VERSION: "v1.8.3"

tasks:
  validate-env:
    internal: true
    preconditions:
      - sh: |
          [ "{{.ENV}}" = "dev" ] || [ "{{.ENV}}" = "main" ]
        msg: "ERROR: ENV must be dev or main"

      - sh: |
          [ -n "{{.TARGET_CLUSTER}}" ]
        msg: "ERROR: Cluster name could not be determined."

  setup_helm_repos:
    desc: "Add helm repos"
    cmds:
      - helm repo add cilium https://helm.cilium.io --force-update
      - helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server --force-update
      - helm repo add istio https://istio-release.storage.googleapis.com/charts --force-update
      - helm repo add fairwinds-stable https://charts.fairwinds.com/stable --force-update
      - helm repo add external-secrets https://charts.external-secrets.io --force-update
      - helm repo update

  install_cilium:
    desc: "Install Cilium"
    deps: [validate-env]
    cmds:
      - |
        helm upgrade --install cilium cilium/cilium \
          --version {{ .CILIUM_VERSION }} \
          -n kube-system \
          --set cluster.name={{ .TARGET_CLUSTER }} \  
          --values k8s/bootstrap/cilium/values.yaml

  install_metrics_server:
    desc: "Install metrics-server"
    cmds:
      - |
        helm upgrade --install metrics-server metrics-server/metrics-server \
          --version {{ .METRICS_SERVER_VERSION }} \
          -n kube-system \
          --values k8s/bootstrap/metrics-server/values.yaml

  install_external_secrets:
    desc: "Install External Secrets"
    cmds:
      - |
        helm upgrade --install external-secrets \
          external-secrets/external-secrets \
          -n external-secrets \
          --create-namespace \
          --wait

  install_vpa:
    desc: "Install VPA (Recommendation mode)"
    cmds:
      - |
        helm upgrade --install vpa fairwinds-stable/vpa \
          -n vpa-system \
          --create-namespace \
          --set updater.enabled=false \
          --set admissionController.enabled=false \
          --wait

  install_istio_base:
    desc: "Install Istio base"
    cmds:
      - |
        helm upgrade --install istio-base istio/base \
          -n istio-system \
          --create-namespace \
          --version {{ .ISTIO_VERSION }}

  install_istiod:
    desc: "Install Istiod"
    cmds:
      - |
        helm upgrade --install istiod istio/istiod \
          -n istio-system \
          --version {{ .ISTIO_VERSION }}

  install_argocd:
    desc: "Install ArgoCD"
    cmds:
      - kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
      - |
        kubectl apply -n argocd \
          -f https://raw.githubusercontent.com/argoproj/argo-cd/{{ .ARGOCD_VERSION }}/manifests/install.yaml

  install_rollouts:
    desc: "Install Argo Rollouts"
    cmds:
      - kubectl create namespace argo-rollouts --dry-run=client -o yaml | kubectl apply -f -
      - |
        kubectl apply -n argo-rollouts \
          -f https://github.com/argoproj/argo-rollouts/releases/download/{{ .ARGO_ROLLOUTS_VERSION }}/install.yaml

  deploy_root_app:
    desc: "Deploy root app"
    deps: [validate-env]
    cmds:
      - kubectl apply -f k8s/argocd/root-app.yaml

  bootstrap:
    desc: "Full cluster bootstrap"
    deps: [validate-env]
    cmds:
      - task: setup_helm_repos
      - task: install_cilium
      - task: install_metrics_server
      - task: install_external_secrets
      - task: install_vpa
      - task: install_istio_base
      - task: install_istiod
      - task: install_rollouts
      - task: install_argocd
      - task: deploy_root_app