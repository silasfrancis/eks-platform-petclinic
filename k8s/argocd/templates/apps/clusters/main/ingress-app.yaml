apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: petclinic-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"    # early — other apps need ingress
spec:
  project: default

  source:
    repoURL: https://github.com/silasfrancis/petclinic-gitops
    targetRevision: main
    path: k8s/platform/ingress
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: istio-ingress

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m

  ignoreDifferences:
    - group: ""
      kind: Service
      jsonPointers:
        - /status/loadBalancer    # AWS NLB updates this dynamically