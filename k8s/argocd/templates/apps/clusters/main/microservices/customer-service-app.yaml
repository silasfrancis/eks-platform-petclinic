# customers-service-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: customers-service
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/silasfrancis/petclinic-gitops
    targetRevision: main
    path: k8s/microservice        # ← shared chart
    helm:
      valueFiles:
        - values.yaml                  # ← common base values
        - values/env/dev/customers-service.yaml   # ← service specific
  destination:
    server: https://kubernetes.default.svc
    namespace: petclinic
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true