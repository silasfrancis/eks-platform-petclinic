apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: petclinic
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"    # deploy last — needs platform ready
spec:
  project: default

  source:
    repoURL: https://github.com/silasfrancis/petclinic-gitops
    targetRevision: main
    path: k8s/apps/petclinic
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: petclinic

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m

  ignoreDifferences:
    # Argo Rollouts updates these dynamically
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /status
    # KEDA updates HPA dynamically
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      jsonPointers:
        - /spec/metrics
        - /spec/behavior