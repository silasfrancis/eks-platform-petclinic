{{- $root := . -}}
{{- $boot := .Values.argocdBootstrap -}}
{{- $env := $boot.envName -}}

{{- range $appName, $appConfig := $boot.apps }}

{{- /* 1. Identify if we are creating one app or a group of service apps */ -}}
{{- $releases := dict $appName $appConfig -}}
{{- if $appConfig.isServiceGroup -}}
  {{- $releases = $appConfig.services -}}
{{- end -}}

{{- range $relName, $relConfig := $releases }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ if (index $boot.apps $appName).isServiceGroup }}{{ $relName }}{{ else }}{{ $appName }}{{ end }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: {{ $relConfig.syncWave | default (index $boot.apps $appName).syncWave | default "1" | quote }}
spec:
  # Merges default project with app-specific project
  project: {{ $relConfig.project | default (index $boot.apps $appName).project | default $boot.defaults.project }}
  
  source:
    repoURL: {{ $relConfig.repoURL | default (index $boot.apps $appName).repoURL | default $boot.defaults.repoURL }}
    targetRevision: {{ $relConfig.targetRevision | default (index $boot.apps $appName).targetRevision | default $boot.defaults.targetRevision }}
    path: {{ (index $boot.apps $appName).path }}
    helm:
      valueFiles:
        - values.yaml
        {{- /* Dynamic environment-wide override */ -}}
        - values/env/{{ $env }}.yaml
        {{- /* Dynamic service-specific override (only for microservices) */ -}}
        {{- if (index $boot.apps $appName).isServiceGroup }}
        - values/env/{{ $env }}/{{ $relName }}.yaml
        {{- end }}

  destination:
    server: {{ $boot.defaults.destination.server }}
    namespace: {{ (index $boot.apps $appName).namespace }}

  syncPolicy:
    automated:
      prune: {{ if (kindIs "bool" $relConfig.automated.prune) }}{{ $relConfig.automated.prune }}{{ else if (kindIs "bool" (index $boot.apps $appName).automated.prune) }}{{ (index $boot.apps $appName).automated.prune }}{{ else }}{{ $boot.defaults.automated.prune }}{{ end }}
      selfHeal: {{ if (kindIs "bool" $relConfig.automated.selfHeal) }}{{ $relConfig.automated.selfHeal }}{{ else if (kindIs "bool" (index $boot.apps $appName).automated.selfHeal) }}{{ (index $boot.apps $appName).automated.selfHeal }}{{ else }}{{ $boot.defaults.automated.selfHeal }}{{ end }}
    
    syncOptions:
      {{- /* Combines defaults + app-level sync options */ -}}
      {{- range $opt := (concat ($boot.defaults.syncOptions | default list) ((index $boot.apps $appName).syncOptions | default list)) }}
      - {{ $opt }}
      {{- end }}
    
    retry:
      {{- toYaml $boot.defaults.retry | nindent 6 }}

  {{- /* Injects the specific ignoreDifferences for that app/group */ -}}
  {{- if (index $boot.apps $appName).ignoreDifferences }}
  ignoreDifferences:
    {{- toYaml (index $boot.apps $appName).ignoreDifferences | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}