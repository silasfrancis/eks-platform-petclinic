{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "argocd.externalSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argocd.labels" . | nindent 4}}
spec:
  refreshInterval:  {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "argocd.secretStoreName" . }}
    kind: SecretStore
  target:
    name: {{ include "argocd.secretName" . }}
    creationPolicy: Owner
    {{- with .Values.externalSecret.template }}
    template:
    {{- toYaml . | nindent 6}}
    {{- end }}
  data:
  {{- range .Values.externalSecret.data }}
  - secretKey: {{ .secretKey }}
    remoteRef: 
      key: {{ .remoteRef.key }}
      property: {{ .remoteRef.property }}
  {{- end }}
{{- end }}