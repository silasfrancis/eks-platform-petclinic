# ArgoCD Application Chart
#
#ArgoCD Application manifests generated from argocdBootstrap
#
# Bootstrap flow:
#   task install_argocd    → installs ArgoCD via Helm (once)
#   task deploy_root_app   → applies root-app.yaml (once)
#   root-app watches       → k8s/argocd/apps/ → creates all Applications below
#   ArgoCD syncs           → everything else deploys itself

# Service Account
# IRSA annotation gives ArgoCD permission to read Git credentials
# from AWS Secrets Manager via ESO.
serviceAccount:
  create: true
  name: ""
  annotations: {}
    # eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/argocd-irsa-role

# Secret Store
# ESO ClusterSecretStore for pulling ArgoCD secrets from AWS Secrets Manager.
# Used for: Git SSH deploy key, Slack notification token.
secretStore:
  enabled: true
  awsRegion: us-east-2

# External Secrets
# Pulls credentials (e.g. Git SSH keys, notification tokens) from AWS Secrets Manager via ESO.
#
# - Repository secrets: require label argocd.argoproj.io/secret-type: repository
#   → auto-registered by ArgoCD for Git access
# - Notification secrets: no label needed
#   → used by ArgoCD Notifications (Slack, webhooks, etc.)
#
# Keep secrets separate for clarity and easier rotation.
# OVERRIDE: remoteRef.key per environment
externalSecrets:
  enabled: true
  refreshInterval: 1h
  secrets:
    repo:
      target:
        name: argocd-repo-secret
      template:
        metadata:
          labels:
            argocd.argoproj.io/secret-type: repository
        data:
          url: "git@github.com:silasfrancis/eks-platform-petclinic.git"
          sshPrivateKey: "{{ .sshPrivateKey }}"
          type: git
      data:
        - secretKey: sshPrivateKey
          remoteRef:
            key: prod/argocd
            property: petclinic-github-deploy-key

    notifications:
      target:
        name: argocd-notifications-secret
      template:
        data: {}
      data:
        - secretKey: slack-token
          remoteRef:
            key: prod/argocd
            property: slack-token

# App of Apps bootstrap configuration.
# Defines every ArgoCD Application this cluster should have.
#
# KEY CONCEPTS:
#   envName         — resolves per-service value file paths (values/env/<envName>/<service>.yaml)
#                     OVERRIDE per environment: dev or main
#   defaults        — inherited by all apps — override per app as needed
#   syncWave        — deployment order enforced by ArgoCD sync waves
#                     0 = ArgoCD self   1 = Infrastructure   2 = Platform   3 = Applications
#   isServiceGroup  — when true the template creates one Application per service
#                     in the services map rather than one Application for the group
#   ignoreDifferences — prevents ArgoCD fighting with controllers that update resources
#                     dynamically (HPA, Karpenter, Istio canary weights, AWS LB status)
argocdBootstrap:
  # NOTE:
  # Namespaces must be pre-created (via k8s/bootstrap/namespaces.yaml).
  # ArgoCD will NOT create namespaces automatically.

  # Override: dev for dev cluster, main for production cluster
  envName: dev

  # Global defaults inherited by all Applications
  defaults:
    repoURL: git@github.com:silasfrancis/eks-platform-petclinic.git
    targetRevision: main
    destination:
      server: https://kubernetes.default.svc
    project: platform
    syncOptions:
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m

  apps:
    # Wave 0 — ArgoCD manages itself (self-managed GitOps)
    argocd:
      path: k8s/argocd
      namespace: argocd
      project: platform
      syncWave: "0"
      repoURL: git@github.com:silasfrancis/eks-platform-petclinic.git
      automated:
        prune: false
        selfHeal: false
      syncOptions:
        - ServerSideApply=true
      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jsonPointers: ["/webhooks/0/clientConfig/caBundle"]
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jsonPointers: ["/webhooks/0/clientConfig/caBundle"]

    # Wave 1 — Core platform (must exist before workloads)
    policies:
      path: k8s/policies
      namespace: policies
      project: platform
      syncWave: "1"
      repoURL: git@github.com:silasfrancis/eks-platform-petclinic.git
      syncOptions:
        - ServerSideApply=true
      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jsonPointers: ["/webhooks/0/clientConfig/caBundle"]
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jsonPointers: ["/webhooks/0/clientConfig/caBundle"]

    karpenter:
      path: k8s/platform/compute
      namespace: karpenter
      project: platform
      syncWave: "1"
      repoURL: git@github.com:silasfrancis/eks-platform-petclinic.git
      syncOptions:
        - ServerSideApply=true
        - Replace=true
        - SkipHooks=true
      ignoreDifferences:
        - group: karpenter.sh
          kind: NodePool
          jsonPointers: ["/status"]
        - group: karpenter.k8s.aws
          kind: EC2NodeClass
          jsonPointers: ["/status"]

    ingress:
      path: k8s/platform/ingress
      namespace: istio-ingress
      project: platform
      syncWave: "1"
      repoURL: git@github.com:silasfrancis/eks-platform-petclinic.git
      ignoreDifferences:
        - group: ""
          kind: Service
          jsonPointers: ["/status/loadBalancer"]
        - group: apps
          kind: Deployment
          jsonPointers: ["/spec/replicas"]
        - group: autoscaling
          kind: HorizontalPodAutoscaler
          jsonPointers: ["/spec/metrics", "/spec/behavior"]

    monitoring:
      path: k8s/platform/monitoring
      namespace: monitoring
      project: platform
      syncWave: "1"
      repoURL: git@github.com:silasfrancis/eks-platform-petclinic.git
      syncOptions:
        - ServerSideApply=true
      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jsonPointers: ["/webhooks/0/clientConfig/caBundle"]

    # Wave 2 — Security and supporting platform
    security:
      path: k8s/platform/security
      namespace: security
      project: platform
      syncWave: "2"
      repoURL: git@github.com:silasfrancis/eks-platform-petclinic.git
      syncOptions:
        - ServerSideApply=true

    autoscaling:
      path: k8s/platform/autoscaling
      namespace: autoscaling
      project: platform
      syncWave: "2"
      repoURL: git@github.com:silasfrancis/eks-platform-petclinic.git

    backup:
      path: k8s/platform/backup
      namespace: velero
      project: platform
      syncWave: "2"
      repoURL: git@github.com:silasfrancis/eks-platform-petclinic.git

    # Wave 3 — Application workloads
    microservices:
      isServiceGroup: true
      path: k8s/microservice
      namespace: petclinic
      project: apps
      repoURL: git@github.com:silasfrancis/eks-platform-petclinic.git
      syncWave: "3"

      services:
        config-server: {}
        discovery-server: {}
        api-gateway: {}
        customers-service: {}
        vets-service: {}
        visits-service: {}
        genai-service: {}
        admin-server: {}

      ignoreDifferences:
        - group: networking.istio.io
          kind: VirtualService
          jqPathExpressions: [".spec.http[].route[].weight"]

        - group: apps
          kind: Deployment
          jsonPointers: ["/spec/replicas"]

        - group: argoproj.io
          kind: Rollout
          jsonPointers: ["/spec/replicas", "/status"]

        - group: autoscaling
          kind: HorizontalPodAutoscaler
          jsonPointers: ["/spec/metrics", "/spec/behavior"]

        - group: ""
          kind: Pod
          jqPathExpressions:
            - ".spec.containers[].resources.requests.cpu"
            - ".spec.containers[].resources.requests.memory"

ingress:
  enabled: true
  gateway: istio-ingress/ingress-internal-gateway # istio internal gateway namespace/name
  argocd:
    host: argocd.internal.lefrancis.org
    serviceName: argocd-server
    port: 80
