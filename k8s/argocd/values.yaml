argocd:
  global:
    domain: argocd.lefrancis.org

    logging:
      format: json
      level: info

    nodeSelector:
      node-type: on-demand

    affinity:
      podAntiAffinity: soft
      nodeAffinity:
        type: hard

  crds:
    install: true
    keep: true

  configs:
    cm:
      timeout.reconciliation: 120s
      timeout.reconciliation.jitter: 60s
      admin.enabled: true
      exec.enabled: true
      resource.customizations.ignoreResourceUpdates.all: |
        jsonPointers:
          - /status
      resource.customizations.ignoreResourceUpdates.argoproj.io_Rollout: |
        jqPathExpressions:
          - '.metadata.annotations."notified.notifications.argoproj.io"'
      resource.exclusions: |
        - apiGroups:
          - ''
          - discovery.k8s.io
          kinds:
          - Endpoints
          - EndpointSlice
        - apiGroups:
          - coordination.k8s.io
          kinds:
          - Lease
        - apiGroups:
          - cilium.io
          kinds:
          - CiliumIdentity
          - CiliumEndpoint
          - CiliumEndpointSlice
        - apiGroups:
          - kyverno.io
          - reports.kyverno.io
          kinds:
          - PolicyReport
          - ClusterPolicyReport
          - EphemeralReport
          - ClusterEphemeralReport
          - AdmissionReport
          - ClusterAdmissionReport
          - BackgroundScanReport
          - ClusterBackgroundScanReport
    repositories:
      petclinic-gitops:
        url: https://github.com/silasfrancis/spring_boot_micro_services
        name: petclinic-gitops
        type: git

    rbac:
      policy.default: role:readonly
      policy.csv: |
        p, role:admin, applications, *, */*, allow
        p, role:admin, clusters, get, *, allow
        p, role:admin, repositories, *, *, allow
        p, role:admin, logs, get, *, allow
        p, role:admin, exec, create, */*, allow
        g, admin, role:admin
      scopes: "[groups]"

  server:
    replicas: 1
    nodeSelector:
      node-type: on-demand
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    service:
      type: ClusterIP
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: platform-monitoring # must match Prometheus serviceMonitorSelector label
      rules:
        enabled: true
        additionalLabels:
          release: platform-monitoring # must match Prometheus serviceMonitorSelector label
        spec:
          - alert: ArgoAppNotSynced
            expr: argocd_app_info{sync_status!="Synced"} == 1
            for: 12h
            labels:
              severity: warning
            annotations:
              summary: "ArgoCD app {{ $labels.name }} not synced for 12h"
          - alert: ArgoAppHealthDegraded
            expr: argocd_app_info{health_status!="Healthy"} == 1
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "ArgoCD app {{ $labels.name }} health is {{ $labels.health_status }}"
          - alert: ArgoAppMissing
            expr: absent(argocd_app_info) == 1
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "ArgoCD has no applications — may be down"

  controller:
    replicas: 1
    nodeSelector:
      node-type: on-demand

    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: platform-monitoring # must match Prometheus serviceMonitorSelector label

  repoServer:
    replicas: 1

    nodeSelector:
      node-type: on-demand

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: platform-monitoring # must match Prometheus serviceMonitorSelector label

  applicationSet:
    replicas: 1

    nodeSelector:
      node-type: on-demand

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: platform-monitoring # must match Prometheus serviceMonitorSelector label

  dex:
    enabled: false
  redis:
    enabled: true

    nodeSelector:
      node-type: on-demand

    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  redis-ha:
    enabled: false
  notifications:
    enabled: true

    nodeSelector:
      node-type: on-demand

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: platform-monitoring # must match Prometheus serviceMonitorSelector label
    secret:
      create: false
    notifiers:
      service.slack: |
        token: $slack-token

    templates:
      template.app-deployed: |
        slack:
          attachments: |
            [{
              "title": "✅ {{ .app.metadata.name }} deployed",
              "title_link": "https://argocd.lefrancis.org/applications/{{ .app.metadata.name }}",
              "color": "#18be52",
              "fields": [
                {"title": "Sync Status", "value": "{{ .app.status.sync.status }}", "short": true},
                {"title": "Health", "value": "{{ .app.status.health.status }}", "short": true},
                {"title": "Revision", "value": "{{ .app.status.sync.revision }}", "short": true}
              ]
            }]

      template.app-health-degraded: |
        slack:
          attachments: |
            [{
              "title": "❌ {{ .app.metadata.name }} degraded",
              "title_link": "https://argocd.lefrancis.org/applications/{{ .app.metadata.name }}",
              "color": "#f4c030",
              "fields": [
                {"title": "Health", "value": "{{ .app.status.health.status }}", "short": true},
                {"title": "Sync", "value": "{{ .app.status.sync.status }}", "short": true}
              ]
            }]

      template.app-sync-failed: |
        slack:
          attachments: |
            [{
              "title": "🚨 {{ .app.metadata.name }} sync failed",
              "title_link": "https://argocd.lefrancis.org/applications/{{ .app.metadata.name }}",
              "color": "#E96D76",
              "fields": [
                {"title": "Error", "value": "{{ .app.status.operationState.message }}", "short": false}
              ]
            }]

    triggers:
      trigger.on-deployed: |
        - description: Application synced and healthy
          oncePer: app.status.sync.revision
          send:
            - app-deployed
          when: >
            app.status.operationState.phase in ['Succeeded']
            and app.status.health.status == 'Healthy'

      trigger.on-health-degraded: |
        - description: Application health degraded
          send:
            - app-health-degraded
          when: app.status.health.status == 'Degraded'

      trigger.on-sync-failed: |
        - description: Sync failed
          send:
            - app-sync-failed
          when: app.status.operationState.phase in ['Error', 'Failed']

    subscriptions:
      - recipients:
          - slack:#petclinic-gitops
        triggers:
          - on-deployed
          - on-health-degraded
          - on-sync-failed

# Service Account
# AWS IAM Role for Service Accounts (IRSA) configuration.
# This ServiceAccount must be annotated with an IAM Role that has 
# permissions to 'secretsmanager:GetSecretValue' for the ArgoCD repo credentials.
serviceAccount:
  create: true
  name: ""          # defaults to appName via _helpers.tpl
  annotations: 
    # eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/argocd-irsa-role

# Secret Store
# Defines the connection to AWS Secrets Manager.
# The SecretStore uses the IRSA ServiceAccount above to authenticate.
# This is a namespaced provider for ExternalSecrets to consume.
secretStore:
  enabled: true
  awsRegion: us-east-2

# Eexternal secrets
# Bridges AWS Secrets Manager to Kubernetes Secrets.
# The 'argocd.argoproj.io/secret-type: repository' label tells ArgoCD 
# to automatically use this secret as a Git/Helm repository credential.
externalSecret:
  enabled: true
  refreshInterval: 1h
  target: ""    # K8s secret name — defaults to <chartName>-secrets via _helpers.tpl
  template:
    metadata:
      labels:
        # ArgoCD discovery label - identifies this secret as a repository config
        argocd.argoproj.io/secret-type: repository
      data:
        url: "git@github.com:silasfrancis/.git" # repo url
        sshPrivateKey: "{{ .sshPrivateKey }}" # ssh private key
        type: git
  data: 
    - secretKey: sshPrivateKey # SSH Key for private repo access
      remoteRef:
        key: prod/argocd # AWS Secrets Manager secret name
        property: ssh-key # AWS Secrets Manager secret property

# Argocd bootsrap configuration
# This block defines the "App-of-Apps" structure for the cluster.
#
# KEY DEFINITIONS:
#   envName           - Dynamic variable to resolve environment folders 
#                       (e.g., values/env/dev/service.yaml).
#   defaults          - Global settings inherited by all Applications.
#   syncWave          - Orchestration order. 0 = Core, 1 = Infra, 2 = Platform, 3 = Apps.
#   isServiceGroup    - Boolean flag: if true, the template loops through the 
#                       'services' map to create individual Argo Applications.
#   ignoreDifferences - Prevents ArgoCD "Sync-Fights" with dynamic controllers 
#                       (HPA, VPA, Istio Canaries, AWS LoadBalancers).

argocdBootstrap:
  envName: dev 

  defaults:
    repoURL: git@github.com:silasfrancis/spring_boot_micro_services.git
    targetRevision: main
    destination:
      server: https://kubernetes.default.svc
    project: platform
    syncOptions:
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m

  apps:
    # Argocd (Self-Managed)
    argocd:
      path: k8s/argocd
      namespace: argocd
      project: platform
      syncWave: "0"
      repoURL: git@github.com:silasfrancis/spring_boot_micro_services.git
      automated:
        prune: false 
        selfHeal: false  # Safer for the controller to not self-correct during upgrades
      syncOptions:
        - ServerSideApply=true
      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jsonPointers: ["/webhooks/0/clientConfig/caBundle"]
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jsonPointers: ["/webhooks/0/clientConfig/caBundle"]

    # Policies
    policies:
      path: k8s/policies
      namespace: kyverno
      project: platform
      syncWave: "1"
      syncOptions:
        - ServerSideApply=true
      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jsonPointers: ["/webhooks/0/clientConfig/caBundle"]
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jsonPointers: ["/webhooks/0/clientConfig/caBundle"]

    # Platform: Compute
    compute:
      path: k8s/platform/compute
      namespace: karpenter
      project: platform
      syncWave: "1"
      syncOptions:
        - ServerSideApply=true
      ignoreDifferences:
        - group: karpenter.sh
          kind: NodePool
          jsonPointers: ["/status"]
        - group: karpenter.k8s.aws
          kind: EC2NodeClass
          jsonPointers: ["/status"]

    # Platform: Ingress
    ingress:
      path: k8s/platform/ingress
      namespace: istio-ingress
      project: platform
      syncWave: "1"
      ignoreDifferences:
        - group: ""
          kind: Service
          jsonPointers: ["/status/loadBalancer"]
        - group: apps
          kind: Deployment
          jsonPointers: ["/spec/replicas"]
        - group: autoscaling
          kind: HorizontalPodAutoscaler
          jsonPointers: ["/spec/metrics", "/spec/behavior"]

    # Platform: Monitoring
    monitoring:
      path: k8s/platform/monitoring
      namespace: monitoring
      project: platform
      syncWave: "1"
      syncOptions:
        - ServerSideApply=true
      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jsonPointers: ["/webhooks/0/clientConfig/caBundle"]

    # Platform: Security
    security:
      path: k8s/platform/security
      namespace: security-system
      project: platform
      syncWave: "2"
      syncOptions:
        - ServerSideApply=true

    # Platform: Autoscaling
    autoscaling:
      path: k8s/platform/autoscaling
      namespace: autoscaling
      project: platform
      syncWave: "2"

    # Platform: Backup
    backup:
      path: k8s/platform/backup
      namespace: velero
      project: platform
      syncWave: "2"

    # Microservices (Grouped Releases)
    microservices:
      isServiceGroup: true
      path: k8s/apps/microservice
      namespace: petclinic
      project: apps
      syncWave: "3"
      services:
        config-server: {}
        discovery-server: {}
        api-gateway: {}
        customers-service: {}
        vets-service: {}
        visits-service: {}
        genai-service: {}
        admin-server: {}
      ignoreDifferences:
        - group: networking.istio.io
          kind: VirtualService
          jqPathExpressions: [".spec.http[].route[].weight"]
        - group: apps
          kind: Deployment
          jsonPointers: ["/spec/replicas"]
        - group: argoproj.io
          kind: Rollout
          jsonPointers: ["/spec/replicas", "/status"]
        - group: autoscaling
          kind: HorizontalPodAutoscaler
          jsonPointers: ["/spec/metrics", "/spec/behavior"]
        - group: ""
          kind: Pod
          jqPathExpressions:
            - ".spec.containers[].resources.requests.cpu"
            - ".spec.containers[].resources.requests.memory"