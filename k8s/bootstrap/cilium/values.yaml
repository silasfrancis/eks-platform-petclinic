# Cilium CNI values for EKS with AWS VPC CNI chained mode.
# Cilium runs as a NetworkPolicy enforcement layer on top of AWS VPC CNI.
# AWS VPC CNI handles IP assignment — Cilium handles policy via eBPF.
#
# Chaining mode: aws-cni
# This means AWS VPC CNI manages pod IPs and Cilium adds NetworkPolicy enforcement.
# Do NOT enable Cilium IPAM — AWS VPC CNI owns IP allocation.
#
# OVERRIDE REQUIRED:
#   cluster.name   — must match EKS cluster name

# Cluster identity — used for mesh and policy scoping
cluster:
  # OVERRIDE: must match EKS cluster name exactly
  name: ""

# Chained CNI mode — Cilium sits on top of AWS VPC CNI
# iptablesRemoveAWSRules removes VPC CNI iptables rules that conflict with Cilium
cni:
  chainingMode: aws-cni
  iptablesRemoveAWSRules: true

# AWS VPC CNI owns routing — Cilium must not interfere
# routingMode native + autoDirectNodeRoutes false because VPC CNI handles routes
routingMode: ""

# Disable Cilium IPAM — AWS VPC CNI manages pod IPs
ipam:
  mode: cluster-pool

# kube-proxy is deployed as an EKS managed addon — do not replace it
kubeProxyReplacement: "false"

# Disable ENI mode — AWS VPC CNI handles this
eni:
  enabled: false

# Enable NetworkPolicy enforcement — this is the primary reason for Cilium on EKS
k8sNetworkPolicy:
  enabled: true

# Hubble observability — disabled for simplicity
# Enable if you want Cilium network flow visibility in Grafana
hubble:
  enabled: false
  relay:
    enabled: false
  ui:
    enabled: false

# Cilium operator — runs on bootstrap/system nodes
operator:
  replicas: 1
  nodeSelector:
    kubernetes.io/os: linux
    node-type: karpenter-bootstrap
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoSchedule
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # prometheus:
  #   enabled: true
  #   serviceMonitor:
  #     enabled: true
  #     labels:
  #       release: platform-monitoring

# Agent DaemonSet — runs on ALL nodes including SPOT
# tolerations must cover all node taints in the cluster
tolerations:
  - operator: Exists    # tolerate all taints — CNI must run everywhere

nodeSelector:
  kubernetes.io/os: linux

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

