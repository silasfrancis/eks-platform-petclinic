{{- if eq .Values.controller.type "rollout" }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "microservice.rolloutName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  revisionHistoryLimit: {{ .Values.rollout.revisionHistoryLimit | default 5 }}
  selector:
    matchLabels:
      {{- include "microservice.selectorLabels" . | nindent 6 }}
  strategy:
    {{- include "microservice.rolloutStrategy" . | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "microservice.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.podSpec }}
      hostPID: {{ .hostPID }}
      hostIPC: {{ .hostIPC }}
      hostNetwork: {{ .hostNetwork }}
      {{- end }}
      serviceAccountName: {{ include "microservice.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      nodeSelector:
        {{- include "microservice.nodeSelector" . | nindent 8 }}
      tolerations:
        {{- include "microservice.tolerations" . | nindent 8 }}
      affinity:
        {{- include "microservice.affinity" . | nindent 8 }}
      containers:
        - name: {{ .Values.appName }}
          image: {{ include "microservice.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            {{- include "microservice.commonEnv" . | nindent 12 }}
            {{- range $key, $val := .Values.env.plain }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          {{- if .Values.externalSecret.enabled }}
          envFrom:
            - secretRef:
                name: {{ include "microservice.externalSecretName" . }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- include "microservice.probes" . | nindent 10 }} 