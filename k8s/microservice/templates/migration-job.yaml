{{- if eq .Values.controller.type "job" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "microservice.jobName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
  {{- $annotations := include "microservice.workloadAnnotations" . | fromYaml }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end }}
spec:
  backoffLimit: {{ .Values.job.backoffLimit | default 3 }}
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished | default 300 }}
  activeDeadlineSeconds: {{ .Values.job.activeDeadlineSeconds | default 600 }}
  completions: {{ .Values.job.completions | default 1 }}
  parallelism: {{ .Values.job.parallelism | default 1 }}
  template:
    metadata:
      labels:
        {{- include "microservice.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.podSpec }}
      {{- if hasKey . "hostPID" }}
      hostPID: {{ .hostPID }}
      {{- end }}
      {{- if hasKey . "hostIPC" }}
      hostIPC: {{ .hostIPC }}
      {{- end }}
      {{- if hasKey . "hostNetwork" }}
      hostNetwork: {{ .hostNetwork }}
      {{- end }}
      {{- end }}
      serviceAccountName: {{ include "microservice.serviceAccountName" . }}
      {{- if .Values.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- $nodeSelector := include "microservice.nodeSelector" . }}
      {{- if $nodeSelector }}
      nodeSelector:
        {{- $nodeSelector | nindent 8 }}
      {{- end }}
      {{- $tolerations := include "microservice.tolerations" . }}
      {{- if $tolerations }}
      tolerations:
        {{- $tolerations | nindent 8 }}
      {{- end }}
      {{- $affinity := include "microservice.affinity" . }}
      {{- if $affinity }}
      affinity:
        {{- $affinity | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Values.appName }}
          image: {{ include "microservice.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          {{- if and .Values.externalSecret .Values.externalSecret.enabled }}
          envFrom:
            - secretRef:
                name: {{ include "microservice.secretName" . }}
          {{- end }}
          env:
            {{- include "microservice.commonEnv" . | nindent 12 }}
          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
          {{- if .Values.securityContext }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- end }}
{{- end }}