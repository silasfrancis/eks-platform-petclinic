{{- if .Values.virtualService.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ .Values.appName }}-vs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
spec:
  hosts:
    {{- if .Values.virtualService.host }}
    - {{ .Values.virtualService.host }}    # external host
    {{- end }}
    - {{ include "microservice.fqdn" . }}   # internal cluster routing
  {{- if .Values.virtualService.host }}
  gateways:
    - {{ .Values.virtualService.gateway }}
    - mesh    # also apply to internal mesh traffic
  {{- else }}
  gateways:
    - mesh    # internal only
  {{- end }}
  http:
    {{- if .Values.virtualService.routes }}
    {{- toYaml .Values.virtualService.routes | nindent 4 }}
    {{- else }}
    - name: primary
      route:
        - destination:
            host: {{ include "microservice.fqdn" . }}
            {{- if eq .Values.controller.type "rollout" }}
            subset: stable
            {{- end }}
            port:
              number: {{ .Values.service.port }}
          {{- if eq .Values.controller.type "rollout" }}
          weight: 100
          {{- end }}
        {{- if eq .Values.controller.type "rollout" }}
        - destination:
            host: {{ include "microservice.fqdn" . }}
            subset: canary
            port:
              number: {{ .Values.service.port }}
          weight: 0
        {{- end }}
{{- end }}