# Common helm values shared by all microservices.
# These values can be overridden at each microservice level where neccessary
# 
# Supports:
# - Deployments & Argo Rollouts (canary)
# - Istio traffic routing
# - HPA & KEDA autoscaling
# - PodDisruptionBudgets (availability)
# - External Secrets (AWS)
# - Spot/On-Demand scheduling

appName: ""
springProfile: ""

image:
  repository: ""
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

controller:
  type: deployment        # "deployment", "rollout" or "job"

replicaCount: 1

containerPort: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

securityContext: #security context for all containers
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podSecurityContext: #security context at the pod level
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault 

workload:
  minReadySeconds: 30
  revisionHistoryLimit: 5

podSpec:
  hostPID: false
  hostIPC: false
  hostNetwork: false

probes: # pod health checks can be overridden per service
  startup:
    path: /actuator/health
    failureThreshold: 30
    periodSeconds: 10
  readiness:
    path: /actuator/health
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    path: /actuator/health
    initialDelaySeconds: 60
    periodSeconds: 15
    failureThreshold: 3

env:
  plain: {}
    # Add service-specific env vars here
    # Common ones (config server, spring profile) come from _helpers.tpl
  secret: {}
    # Populated from ExternalSecret via envFrom


spot:
  enabled: false          # true → adds SPOT toleration + nodeSelector

nodeSelector:
  node-type: on-demand    # default ON_DEMAND — override per service

tolerations: []           # populated by spot.enabled or custom

# Pod anti-affinity — spread replicas across nodes
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels: 
              {{- include "microservice.selectorLabels" . | nindent 17 }}
          topologyKey: kubernetes.io/hostname

deployment: #deployment settings used when controller.type = deployment
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0

rollout: #rollout settings used when controller.type = rollout
  strategy:
    canary:
      trafficRouting:
        istio:
          virtualService:
            name: ""
            routes:
              - primary
          destinationRule:
            name: ""
            stableSubsetName: stable
            canarySubsetName: canary
      steps:
        - setWeight: 20
        - pause: { duration: 60s }
        - setWeight: 50
        - pause: { duration: 60s }
        - setWeight: 100

service:
  enabled: true
  port: ""
  targetPort: ""
  protocol: TCP

virtualService: # virtual service config - for services undergoing rollout
  enabled: false
  host: ""     # stable service name or host e.g petclinic.lefrancis.org
  gateway: ""  # ingress gateway name, defaults to 'mesh'
  prefix: /
  rewriteUri: /
  routes: {} # additional routes for the virtual service if neccessary. defaults to the primary route used during rollout

serviceAccount:
  create: true
  name: ""               # defaults to appName via _helpers.tpl
  annotations: {}        # add IRSA annotation here if needed

# HPA
# Only used when controller.type = deployment
# rollouts use KEDA or their own HPA
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# PodDisruptionBudget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# External Secrets
secretStore:
  enabled: false
  awsRegion: us-east-2
  annotations: {}
  
externalSecret:
  enabled: false
  refreshInterval: 1h
  annotations: {}
  target: ""   # name of the K8s secret to create, defaults to <appName>-secrets
  data: []
  # - secretKey: DB_PASSWORD
  #   remoteRef:
  #     key: dev/petclinic
  #     property: db_password

# Database migration — Flyway job
# Only for data migration job
databaseMigration:
  enabled: false
  image:
    registry: 509194952955.dkr.ecr.us-east-2.amazonaws.com
    repository: springboot/db-migrations
    tag: "latest"
  annotations: {}
  env:
    plain: {}
    secret: {}
