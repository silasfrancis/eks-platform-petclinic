# Common Helm values shared by all microservices.
#
# Supports:
#   - Deployments and Argo Rollouts (canary)
#   - Istio traffic routing (VirtualService + DestinationRule)
#   - HPA and KEDA autoscaling
#   - PodDisruptionBudgets
#   - External Secrets (AWS Secrets Manager via ESO)
#   - SPOT and ON_DEMAND node scheduling
#
# Usage:
#   Override only the fields that differ per service.
#   Common environment variables (config server, spring profile) are injected automatically via _helpers.tpl.

# App Identity
# appName drives all resource names via _helpers.tpl:
#   <appName>-deployment, <appName>-svc, <appName>-rollout etc
appName: ""

# springProfile is injected as SPRING_PROFILES_ACTIVE env var
# Common values: docker, mysql, native
springProfile: ""

# Image
image:
  repository: ""    # ECR repository path e.g. <AWS_ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/<PROJECT>/<SERVICE_NAME>
  tag: ""           # image tag — set by CI pipeline from git SHA, for immutability pin image digest
  digest: ""        # image digest — set by CI pipeline
  pullPolicy: IfNotPresent

# Controller
# Determines which workload resource is created:
#   deployment → apps/v1 Deployment (config-server, discovery-server, admin-server)
#   rollout    → argoproj.io/v1alpha1 Rollout with canary strategy (api-gateway, customers, visits, vets, genai)
#   job        → batch/v1 Job (db-migrations)
controller:
  type: deployment

# replicaCount must always be set explicitly.
# If omitted Argo Rollouts defaults to 1
replicaCount: 1

# containerPort is the port the Spring Boot app listens on inside the container
containerPort: ""

# Resources
# Defaults based on Goldilocks VPA recommendations for Spring Boot microservices.
# Override per service after running Goldilocks in your cluster.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Security
# Container-level security context — applied to every container
# runAsUser 65532 = nonroot user from distroless base image
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Pod-level security context
# seccompProfile RuntimeDefault blocks dangerous syscalls
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Workload
workload:
  # minReadySeconds ensures pods are stable before being considered available
  # protects against flapping during rolling updates
  minReadySeconds: 30
  # keep last 5 ReplicaSets for rollback capability
  revisionHistoryLimit: 5

# Pod Spec
# All disabled — enabling any of these breaks pod security standards
# and Kyverno policies will reject the pod
podSpec:
  hostPID: false
  hostIPC: false
  hostNetwork: false

# Health Probes
# Spring Boot Actuator probe paths.
probes:
  startup:
    path: /actuator/health
    failureThreshold: 30    # 30 * 10s = 5 minutes max startup time
    periodSeconds: 10
  readiness:
    path: /actuator/health
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    path: /actuator/health
    initialDelaySeconds: 60    # give Spring Boot time to fully initialise
    periodSeconds: 15
    failureThreshold: 3

# Environment Variables
env:
  plain: {}   # non-sensitive env vars — committed to Git
  secret: {}  # sensitive env vars — populated via ExternalSecret

# Config Server
# Controls whether SPRING_CONFIG_IMPORT is injected.
# Disable for config-server itself (it IS the config server).
configServer:
  enabled: true
  url: "http://config-server-svc.petclinic.svc.cluster.local:8888"

# Node Scheduling
# spot.enabled adds SPOT node toleration and nodeSelector automatically.
# SPOT nodes are cheaper but interruptible — use for workloads that can afford to be interrupted
# Keep false for critical infrastructure:
#   config-server, discovery-server, api-gateway, admin-server
spot:
  enabled: false

nodeSelector:
  node-type: on-demand    # overridden to spot when spot.enabled=true

tolerations: []

# Pod Anti-Affinity
# Spreads replicas across nodes to prevent all pods landing on the same node.
# When a node is drained (Karpenter consolidation, SPOT interruption),
# at least one replica remains available.
affinity:
  enabled: true
  topologyKey: kubernetes.io/hostname

# Deployment Strategy
# Only used when controller.type = deployment
deployment:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0    # zero downtime — always have full capacity during rollout

# Argo Rollout Strategy
# Only used when controller.type = rollout
# Canary steps gradually shift traffic and pause for validation.
# Argo Rollouts manages VirtualService weights 
# ArgoCD is configured to ignore VirtualService weight diffs to prevent revert conflicts.
rollout:
  strategy:
    canary:
      stableMetadataLabels:
        role: stable    # Istio DestinationRule stable subset selector
      canaryMetadataLabels:
        role: canary    # Istio DestinationRule canary subset selector
      trafficRouting:
        istio:
          virtualService:
            name: ""          # set per service — must match VS resource name
            routes:
              - primary       # must match the named route in VirtualService
          destinationRule:
            name: ""          # set per service — must match DR resource name
            stableSubsetName: stable
            canarySubsetName: canary
      steps:
        - setWeight: 20
        - pause: { duration: 60s }
        - setWeight: 50
        - pause: { duration: 60s }
        - setWeight: 100

# Service
service:
  enabled: true
  port: ""        # service port — usually same as containerPort
  targetPort: ""  # container port to forward to — usually same as port
  protocol: TCP

# VirtualService
# Istio traffic routing configuration.
# Required for:
#   - canary traffic splitting (all rollout services)
#   - external exposure via Istio Gateway (api-gateway only)
#   - path-based routing to downstream services (api-gateway only)
#
# Always use FQDN for hosts to avoid namespace misconfigurations.
# Use microservice.fqdn helper in templates.
#
# routes: additional HTTP routes appended BEFORE the primary catch-all route.
# Istio evaluates routes top-to-bottom — specific matches must come first.
virtualService:
  enabled: false
  host: ""        # external hostname e.g. petclinic.lefrancis.org
                  # leave empty for mesh-only services
  gateway: ""     # e.g. istio-ingress/petclinic-gateway
                  # leave empty for mesh-only (uses 'mesh' gateway)
  prefix: /       # URI prefix for the primary catch-all route
  rewriteUri: /   # rewrite URI before forwarding to destination
  routes: []      # additional routes — see api-gateway values for example

destinationService:
  enabled: false
  
# Service Account
# IRSA annotations go here for services that need AWS API access.
# Example:
#   annotations:
#     eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/<service-name>
serviceAccount:
  create: true
  name: ""          # defaults to appName via _helpers.tpl
  annotations: {}

# HPA
# CPU/memory based horizontal pod autoscaling.
# Use for stateless services that need scaling but NOT scale-to-zero.
# For scale-to-zero use scaleObject (KEDA) instead.
# Cannot be used alongside scaleObject — enable one or the other.
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# KEDA ScaledObject
# Event-driven autoscaling for services that can scale to zero.
# Currently used by genai-service which scales based on:
#   - Istio HTTP request rate (prometheus trigger)
#   - CPU utilisation (prometheus trigger)
#   - Memory utilisation (prometheus trigger)
# Cannot be used alongside hpa — enable one or the other.
scaleObject:
  enabled: false
  minReplicas: 0      # 0 = scale to zero when idle
  maxReplicas: 5
  idleReplicaCount: 0
  pollingInterval: 30
  cooldownPeriod: 300    # 5 minutes before scaling down
  triggers: []

# PodDisruptionBudget
# Prevents all replicas being evicted simultaneously during:
#   - Karpenter node consolidation
#   - Kubernetes node drain
#   - Rolling updates
# minAvailable: 1 ensures at least one pod is always running.
# Disable only for single-replica non-critical services (e.g. admin-server).
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Secret Store
# SecretStore reference for ExternalSecrets.
# Secret Store is configured to authenticate to AWS Secrets Manager via IRSA.
secretStore:
  enabled: false
  awsRegion: us-east-2
  annotations: {}

# External Secret
# Pulls secrets from AWS Secrets Manager and creates a Kubernetes Secret.
# The created secret is mounted as environment variables via envFrom.
externalSecret:
  enabled: false
  refreshInterval: 1h
  annotations: {}
  target: ""    # K8s secret name — defaults to <appName>-secrets via _helpers.tpl
  data: []
  # Example:
  # - secretKey: MYSQL_PASSWORD         # key in the K8s secret
  #   remoteRef:
  #     key: dev/petclinic            # path in AWS Secrets Manager
  #     property: mysql_password      # field within the secret JSON

# Database Migration
# Flyway migration job — runs as a Helm pre-install/pre-upgrade hook.
# Only enable for services that own a database schema.
# The job runs before the application deploys ensuring schema is ready.
# hook-delete-policy: before-hook-creation cleans up previous job runs.
databaseMigration:
  enabled: false
  image:
    repository: "" #<AWS_ACCOUNT_ID>.dkr.ecr.us-east-2.amazonaws.com/<repo>
    tag: ""
    digest: ""
    pullPolicy: Always
  annotations: {}
  env:
    plain: {}
    secret: {}