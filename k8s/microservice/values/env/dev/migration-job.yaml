appName: db-migration

databaseMigration:
  enabled: true

image:
  repository: 509194952955.dkr.ecr.us-east-2.amazonaws.com/springboot/customers-service
  tag: "c84d2ef1"
  digest: ""

controller:
  type: job

replicaCount: 1

service:
  enabled: false

configServer:
  enabled: false

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::509194952955:role/dev-config-server-sa-pod-secrets-reader"

secretStore:
  enabled: true

externalSecret:
  enabled: true
  data:
    - secretKey: MYSQL_HOST
      remoteRef:
        key: dev/petclinic
        property: mysql_host
    - secretKey: MYSQL_DATABASE
      remoteRef:
        key: dev/petclinic
        property: mysql_database
    - secretKey: FLYWAY_USER
      remoteRef:
        key: dev/petclinic
        property: mysql_user
    - secretKey: FLYWAY_PASSWORD
      remoteRef:
        key: dev/petclinic
        property: mysql_password

  env:
    plain:
      FLYWAY_URL: "jdbc:mysql://$(MYSQL_HOST):3306/$(MYSQL_DATABASE)"

