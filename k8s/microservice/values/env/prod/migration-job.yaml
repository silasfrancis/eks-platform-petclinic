appName: db-migration

databaseMigration:
  enabled: true

image:
  registry: 509194952955.dkr.ecr.us-east-2.amazonaws.com
  repository: petclinic/migrations
  tag: "6e2d22fa"
  digest: "sha256:6fcebf4b22f9b745d4430149640ea2257b70e9b65d1e3e6db036cd3a6a7edc07"
  pullPolicy: IfNotPresent

controller:
  type: job

replicaCount: 1

service:
  enabled: false

configServer:
  enabled: false

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::509194952955:role/petclinic-prod-cluster-app-secrets-irsa"

secretStore:
  enabled: true

externalSecret:
  enabled: true
  data:
    - secretKey: MYSQL_HOST
      remoteRef:
        key: prod/petclinic
        property: mysql_host
    - secretKey: MYSQL_DATABASE
      remoteRef:
        key: prod/petclinic
        property: mysql_database
    - secretKey: FLYWAY_USER
      remoteRef:
        key: prod/petclinic
        property: mysql_user
    - secretKey: FLYWAY_PASSWORD
      remoteRef:
        key: prod/petclinic
        property: mysql_password

  env:
    plain:
      FLYWAY_URL: "jdbc:mysql://$(MYSQL_HOST):3306/$(MYSQL_DATABASE)"
