keda:
  nodeSelector:
    node-type: on-demand
  operator:
    name: keda-operator
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  metricsServer:
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  prometheus:
    operator:
      enabled: true
      port: 8080
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack
    
    metricServer:
      enabled: true
      port: 8080
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack

    webhooks:
      enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

    rbac:
      create: true
      enabledCustomScaledRefKinds: true

    serviceAccount:
      operator:
        create: true
        name: keda-operator
      metricServer:
        create: true
        name: keda-metrics-server