velero:
  nameOverride: "velero"

  initContainers:
    - name: velero-plugin-for-aws
      image: velero/velero-plugin-for-aws:v1.13.1
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - mountPath: /target
          name: plugins

  credentials:
    useSecret: false

  serviceAccount:
    server:
      create: true
      name: velero
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::<account-id>:role/<cluster-name>-velero"

  nodeSelector:
    node-type: on-demand
  podSecurityContext:
    fsGroup: 1337 

  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true

  resources:
    requests:
      cpu: 500m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  deployNodeAgent: true

  nodeAgent:
    tolerations:
      - key: spot
        operator: Equal
        value: "true"
        effect: NoSchedule
      - key: CriticalAddonsOnly
        operator: Exists

    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1024Mi

    podSecurityContext:
      runAsUser: 0

  configuration:
    uploaderType: kopia
    defaultBackupTTL: 720h
    backupStorageLocation:
      - name: petclinic-s3-backup
        provider: aws
        bucket: "<cluster-name>-velero-backups"
        default: true
        accessMode: ReadWrite
        validationFrequency: 1h
        config:
          region: us-east-2
          kmsKeyId: ""

    volumeSnapshotLocation:
      - name: petclinic-ebs-backup
        provider: aws
        config:
          region: us-east-2

    logFormat: json
    logLevel: info
    backupSyncPeriod: 1m
    defaultVolumesToFsBackup: false
    garbageCollectionFrequency: 1h

  schedules:
    daily-cluster-backup:
      disabled: false
      schedule: "0 2 * * *"
      useOwnerReferencesInBackup: false
      template:
        ttl: "720h"
        storageLocation: petclinic-s3-backup
        volumeSnapshotLocations:
          - petclinic-ebs-backup
        excludedNamespaces:
          - kube-system
          - kube-public
          - kube-node-lease
        includedResources: []
        snapshotVolumes: true
        defaultVolumesToFsBackup: false
        labels:
          schedule: daily-cluster-backup
          type: full

    hourly-petclinic-backup:
      disabled: false
      schedule: "0 * * * *"
      useOwnerReferencesInBackup: false
      template:
        ttl: "168h"
        storageLocation: petclinic-s3-backup
        includedNamespaces:
          - petclinic
        snapshotVolumes: true
        defaultVolumesToFsBackup: false
        labels:
          schedule: hourly-petclinic-backup
          type: petclinic

    daily-monitoring-backup:
      disabled: false
      schedule: "0 3 * * *"    # 3 AM daily
      useOwnerReferencesInBackup: false
      template:
        ttl: "168h"             # keep 7 days
        storageLocation: petclinic-s3-backup
        includedNamespaces:
          - monitoring
        snapshotVolumes: true
        defaultVolumesToFsBackup: true
        labels:
          schedule: daily-monitoring-backup
          type: monitoring

  metrics:
    enabled: true
    scrapeInterval: 30s
    scrapeTimeout: 10s

    serviceMonitor:
      enabled: true
      autodetect: true
      additionalLabels:
        release: kube-prometheus-stack

    nodeAgentPodMonitor:
      enabled: true
      autodetect: true
      additionalLabels:
        release: kube-prometheus-stack

    prometheusRule:
      enabled: true
      autodetect: true
      additionalLabels:
        release: kube-prometheus-stack
      spec:
        # Alert when backup fails
        - alert: VeleroBackupFailed
          annotations:
            summary: "Velero backup {{ $labels.schedule }} has failed"
            description: "Velero backup schedule {{ $labels.schedule }} last status is not successful."
          expr: velero_backup_last_status{schedule!=""} != 1
          for: 15m
          labels:
            severity: critical

        # Alert when backup has been failing for 12h
        - alert: VeleroBackupFailing
          annotations:
            summary: "Velero backup {{ $labels.schedule }} has been failing for 12h"
            description: "Velero backup schedule {{ $labels.schedule }} has been failing for the last 12 hours."
          expr: velero_backup_last_status{schedule!=""} != 1
          for: 12h
          labels:
            severity: critical

        # Alert when no successful backup in 25h
        - alert: VeleroNoNewBackup
          annotations:
            summary: "Velero backup {{ $labels.schedule }} has not run in 25h"
            description: "Velero backup schedule {{ $labels.schedule }} has not run successfully in the last 25 hours."
          expr: |
            (
              (time() - velero_backup_last_successful_timestamp{schedule!=""}) >bool (25 * 3600)
              or
              absent(velero_backup_last_successful_timestamp{schedule!=""})
            ) == 1
          for: 1h
          labels:
            severity: critical

        # Alert on partial failures
        - alert: VeleroBackupPartialFailures
          annotations:
            summary: "Velero backup {{ $labels.schedule }} has partial failures"
            description: "Velero backup schedule {{ $labels.schedule }} has {{ $value | humanizePercentage }} partial failures."
          expr: |
            rate(velero_backup_partial_failure_total{schedule!=""}[25m])
            / rate(velero_backup_attempt_total{schedule!=""}[25m]) > 0.25
          for: 15m
          labels:
            severity: warning

        # Alert when restore fails
        - alert: VeleroRestoreFailed
          annotations:
            summary: "Velero restore {{ $labels.schedule }} has failed"
            description: "A Velero restore operation has failed."
          expr: velero_restore_failed_total > 0
          for: 5m
          labels:
            severity: critical