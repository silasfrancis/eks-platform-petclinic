velero:
  nameOverride: "velero"
  # ---- AWS plugin init container -------------------------
  # Required — Velero doesn't bundle the AWS plugin
  initContainers:
    - name: velero-plugin-for-aws
      image: velero/velero-plugin-for-aws:v1.13.1
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - mountPath: /target
          name: plugins

  # ---- IRSA — no static credentials ---------------------
  credentials:
    useSecret: false    # IRSA handles auth — no key file needed

  serviceAccount:
    server:
      create: true
      name: velero
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::<account-id>:role/<cluster-name>-velero"

  # ---- Run on ON_DEMAND nodes ----------------------------
  nodeSelector:
    node-type: on-demand

  # ---- Security context for IRSA -------------------------
  podSecurityContext:
    fsGroup: 1337    # required for IRSA token reading

  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true

  # ---- Resources -----------------------------------------
  resources:
    requests:
      cpu: 500m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  # ---- Node agent — for PVC filesystem backups -----------
  # Needed to backup Prometheus TSDB, Grafana, Loki PVCs
  deployNodeAgent: true

  nodeAgent:
    tolerations:
      # Run on all nodes including SPOT
      - key: spot
        operator: Equal
        value: "true"
        effect: NoSchedule
      - key: CriticalAddonsOnly
        operator: Exists

    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1024Mi

    podSecurityContext:
      runAsUser: 0    # node-agent needs root for filesystem access

  # ---- Storage configuration -----------------------------
  configuration:
    uploaderType: kopia    # modern uploader — better than restic

    # Backup TTL default
    defaultBackupTTL: 720h    # 30 days

    # Backup storage location — S3
    backupStorageLocation:
      - name: default
        provider: aws
        bucket: "<cluster-name>-velero-backups"
        default: true
        accessMode: ReadWrite
        validationFrequency: 1h
        config:
          region: us-east-2
          kmsKeyId: ""        # optional — leave empty for AES256

    # Volume snapshot location — EBS
    volumeSnapshotLocation:
      - name: default
        provider: aws
        config:
          region: us-east-2

    # Server settings
    logFormat: json
    logLevel: info
    backupSyncPeriod: 1m
    defaultVolumesToFsBackup: false    # explicit opt-in per backup
    garbageCollectionFrequency: 1h

  # ---- Backup schedules ----------------------------------
  schedules:

    # ---- Daily full cluster backup ----------------------
    daily-cluster-backup:
      disabled: false
      schedule: "0 2 * * *"    # 2 AM daily
      useOwnerReferencesInBackup: false
      template:
        ttl: "720h"             # keep 30 days
        storageLocation: default
        volumeSnapshotLocations:
          - default
        # Back up everything except noisy system namespaces
        excludedNamespaces:
          - kube-system
          - kube-public
          - kube-node-lease
        # Include all resource types
        includedResources: []
        # Snapshot PVCs
        snapshotVolumes: true
        defaultVolumesToFsBackup: false
        labels:
          schedule: daily-cluster-backup
          type: full

    # ---- Hourly petclinic backup -----------------------
    # More frequent backup for your app namespace
    hourly-petclinic-backup:
      disabled: false
      schedule: "0 * * * *"    # every hour
      useOwnerReferencesInBackup: false
      template:
        ttl: "168h"             # keep 7 days
        storageLocation: default
        includedNamespaces:
          - petclinic
        snapshotVolumes: true
        defaultVolumesToFsBackup: false
        labels:
          schedule: hourly-petclinic-backup
          type: petclinic

    # ---- Daily monitoring backup -----------------------
    # Backup Prometheus/Grafana/Loki PVCs with filesystem backup
    daily-monitoring-backup:
      disabled: false
      schedule: "0 3 * * *"    # 3 AM daily
      useOwnerReferencesInBackup: false
      template:
        ttl: "168h"             # keep 7 days
        storageLocation: default
        includedNamespaces:
          - monitoring
        snapshotVolumes: true
        # Use filesystem backup for monitoring PVCs
        defaultVolumesToFsBackup: true
        labels:
          schedule: daily-monitoring-backup
          type: monitoring

  # ---- Metrics -------------------------------------------
  metrics:
    enabled: true
    scrapeInterval: 30s
    scrapeTimeout: 10s

    serviceMonitor:
      enabled: true
      autodetect: true
      additionalLabels:
        release: kube-prometheus-stack

    nodeAgentPodMonitor:
      enabled: true
      autodetect: true
      additionalLabels:
        release: kube-prometheus-stack

    # ---- PrometheusRule alerts --------------------------
    prometheusRule:
      enabled: true
      autodetect: true
      additionalLabels:
        release: kube-prometheus-stack
      spec:
        # Alert when backup fails
        - alert: VeleroBackupFailed
          annotations:
            summary: "Velero backup {{ $labels.schedule }} has failed"
            description: "Velero backup schedule {{ $labels.schedule }} last status is not successful."
          expr: velero_backup_last_status{schedule!=""} != 1
          for: 15m
          labels:
            severity: critical

        # Alert when backup has been failing for 12h
        - alert: VeleroBackupFailing
          annotations:
            summary: "Velero backup {{ $labels.schedule }} has been failing for 12h"
            description: "Velero backup schedule {{ $labels.schedule }} has been failing for the last 12 hours."
          expr: velero_backup_last_status{schedule!=""} != 1
          for: 12h
          labels:
            severity: critical

        # Alert when no successful backup in 25h
        - alert: VeleroNoNewBackup
          annotations:
            summary: "Velero backup {{ $labels.schedule }} has not run in 25h"
            description: "Velero backup schedule {{ $labels.schedule }} has not run successfully in the last 25 hours."
          expr: |
            (
              (time() - velero_backup_last_successful_timestamp{schedule!=""}) >bool (25 * 3600)
              or
              absent(velero_backup_last_successful_timestamp{schedule!=""})
            ) == 1
          for: 1h
          labels:
            severity: critical

        # Alert on partial failures
        - alert: VeleroBackupPartialFailures
          annotations:
            summary: "Velero backup {{ $labels.schedule }} has partial failures"
            description: "Velero backup schedule {{ $labels.schedule }} has {{ $value | humanizePercentage }} partial failures."
          expr: |
            rate(velero_backup_partial_failure_total{schedule!=""}[25m])
            / rate(velero_backup_attempt_total{schedule!=""}[25m]) > 0.25
          for: 15m
          labels:
            severity: warning

        # Alert when restore fails
        - alert: VeleroRestoreFailed
          annotations:
            summary: "Velero restore {{ $labels.schedule }} has failed"
            description: "A Velero restore operation has failed."
          expr: velero_restore_failed_total > 0
          for: 5m
          labels:
            severity: critical