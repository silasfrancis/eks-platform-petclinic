{{- $cluster := .Values.cluster }}
{{- $nc := .Values.nodeClass }}
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: {{ $cluster.env }}-{{ $cluster.app }}-node-class
  labels:
    {{- include "compute.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  amiFamily: {{ $nc.amiFamily }}
  amiSelectorTerms:
    - alias: {{ $nc.amiAlias }}

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ $cluster.name | quote }}

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ $cluster.name | quote }}

  role: {{ $cluster.nodeRoleName | quote }}

  kubelet:
    podsPerCore: {{ $nc.kubelet.podsPerCore }}
    maxPods: {{ $nc.kubelet.maxPods }}

    systemReserved:
      cpu: {{ $nc.kubelet.systemReserved.cpu }}
      memory: {{ $nc.kubelet.systemReserved.memory }}
      ephemeral-storage: {{ $nc.kubelet.systemReserved.ephemeralStorage }}

    kubeReserved:
      cpu: {{ $nc.kubelet.kubeReserved.cpu }}
      memory: {{ $nc.kubelet.kubeReserved.memory }}
      ephemeral-storage: {{ $nc.kubelet.kubeReserved.ephemeralStorage }}

    evictionHard:
      memory.available: {{ $nc.kubelet.evictionHard.memoryAvailable | quote }}
      nodefs.available: {{ $nc.kubelet.evictionHard.nodefsAvailable | quote }}
      nodefs.inodesFree: {{ $nc.kubelet.evictionHard.nodefsInodesFree | quote }}

    evictionSoft:
      memory.available: {{ $nc.kubelet.evictionSoft.memoryAvailable | quote }}
      nodefs.available: {{ $nc.kubelet.evictionSoft.nodefsAvailable | quote }}
      nodefs.inodesFree: {{ $nc.kubelet.evictionSoft.nodefsInodesFree | quote }}

    evictionSoftGracePeriod:
      memory.available: {{ $nc.kubelet.evictionSoftGracePeriod.memoryAvailable | quote }}
      nodefs.available: {{ $nc.kubelet.evictionSoftGracePeriod.nodefsAvailable | quote }}
      nodefs.inodesFree: {{ $nc.kubelet.evictionSoftGracePeriod.nodefsInodesFree | quote }}

    evictionMaxPodGracePeriod: {{ $nc.kubelet.evictionMaxPodGracePeriod }}

    imageGCHighThresholdPercent: {{ $nc.kubelet.imageGCHighThresholdPercent }}
    imageGCLowThresholdPercent: {{ $nc.kubelet.imageGCLowThresholdPercent }}

    cpuCFSQuota: {{ $nc.kubelet.cpuCFSQuota }}

    clusterDNS:
      {{- toYaml $cluster.clusterDNS | nindent 6 }}

  blockDeviceMappings:
    - deviceName: {{ $nc.blockDevice.deviceName }}
      ebs:
        volumeSize: {{ $nc.blockDevice.volumeSize }}
        volumeType: {{ $nc.blockDevice.volumeType }}
        encrypted: {{ $nc.blockDevice.encrypted }}
        kmsKeyID: {{ $cluster.kmsKeyArn | quote }}
        deleteOnTermination: {{ $nc.blockDevice.deleteOnTermination }}

  metadataOptions:
    httpEndpoint: {{ $nc.metadataOptions.httpEndpoint }}
    httpProtocolIPv6: {{ $nc.metadataOptions.httpProtocolIPv6 }}
    httpPutResponseHopLimit: {{ $nc.metadataOptions.httpPutResponseHopLimit }}
    httpTokens: {{ $nc.metadataOptions.httpTokens }}

  tags:
    Environment: {{ $cluster.env | quote }}
    ManagedBy: karpenter
    Application: {{ $cluster.app | quote }}