apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: on-demand
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  template:
    metadata:
      labels:
        node-type: on-demand
        workload-tier: {{ .Values.workloadTier }}
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ${ENV}-${APP}-node-class
      startupTaints:
        - key: node.cilium.io/agent-not-ready
          value: "true"
          effect: NoExecute
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["t", "m", "c"]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["t4g"]   
        - key: karpenter.k8s.aws/instance-generation
          operator: Gte
          values: ["6"]
        - key: karpenter.k8s.aws/instance-hypervisor
          operator: In
          values: ["nitro"]
        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - us-east-2a
            - us-east-2b
            - us-east-2c
      expireAfter: Never
      terminationGracePeriod: 48h
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 10m    
    budgets:
      - nodes: "10%"          
      - schedule: "0 9 * * mon-fri"
        duration: 8h
        nodes: "0"            
  limits:
    cpu: "8"        
    memory: 16Gi     
    nodes: 3        
  weight: 100