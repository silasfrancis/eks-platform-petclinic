apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: spot
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  template:
    metadata:
      labels:
        node-type: spot
        workload-tier: {{ .Values.workloadTier }}
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ${ENV}-${APP}-node-class
      startupTaints:
        - key: node.cilium.io/agent-not-ready
          value: "true"
          effect: NoExecute
      taints:
        - key: spot
          value: "true"
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["t", "m", "c", "r"]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values:
            - t4g
            - m6g
            - m7g
            - c6g
            - c7g
            - r6g     
            - r7g
        - key: karpenter.k8s.aws/instance-generation
          operator: Gte
          values: ["6"]
        - key: karpenter.k8s.aws/instance-hypervisor
          operator: In
          values: ["nitro"]
        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - us-east-2a
            - us-east-2b
            - us-east-2c
      expireAfter: 24h
      terminationGracePeriod: 24h
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
    budgets:
      - nodes: "20%"
  limits:
    cpu: "6"
    memory: 12Gi
    nodes: 3

  weight: 1