{{- range $name, $config := .Values.customCertificates }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "platform-ingress.resourceName" (dict "context" $ "gwName" $name) }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "platform-ingress.labels" (dict "context" $ "gwName" $name) | nindent 4 }}
spec:
  secretName: {{ $config.secretName }}
  dnsNames:
    {{- range $config.hosts }}
    - {{ . | quote }}
    {{- end }}
  issuerRef:
    name: {{ $config.issuerRefName }}
    kind: ClusterIssuer
---
{{- end }}