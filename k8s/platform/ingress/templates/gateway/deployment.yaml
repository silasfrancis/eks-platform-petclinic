{{- range $name, $cfg := .Values.gateways }}
{{- $ctx := dict "name" $name "gw" $cfg "root" $ }}
{{- if $cfg.deployment.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gateway.resourceName" $ctx }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "gateway.labels" $ctx | nindent 4 }}
  annotations:
    {{- include "gateway.deploymentAnnotations" $ctx | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "gateway.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gateway.podLabels" $ctx | nindent 8 }}
    spec:
      serviceAccountName: {{ include "gateway.serviceAccountName" $ctx }}
      securityContext:
        {{- toYaml ($.Values.gatewayDefaults.podSecurityContext) | nindent 8 }}
      {{- with (include "gateway.tolerations" $ctx) }}
      tolerations:
        {{- . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $.Values.gatewayDefaults.container.name }}
          image: {{ $.Values.gatewayDefaults.container.image }}
          ports:
            {{- toYaml $.Values.gatewayDefaults.container.ports | nindent 12 }}
          resources:
            {{- include "gateway.containerResources" $ctx | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.gatewayDefaults.securityContext | nindent 12 }}
{{- end }}
{{- end }}