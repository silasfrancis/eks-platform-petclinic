{{- range $name, $config := .Values.customCertificates }}
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: {{ include "platform-ingress.resourceName" (dict "context" $ "gwName" $name) }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "platform-ingress.labels" (dict "context" $ "gwName" $name) | nindent 4 }}
spec:
  selector:
    {{- include "platform-ingress.selectorLabels" (dict "context" $ "gwName" $name) | nindent 4 }}
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        {{- range $config.hosts }}
        - {{ . | quote }}
        {{- end }}
      tls:
        httpsRedirect: true
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        {{- range $config.hosts }}
        - {{ . | quote }}
        {{- end }}
      tls:
        mode: SIMPLE
        credentialName: {{ $config.secretName }}
---
{{- end }}