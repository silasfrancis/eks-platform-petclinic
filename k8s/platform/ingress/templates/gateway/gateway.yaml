{{- range $name, $cfg := .Values.gateways }}
{{- $ctx := dict "name" $name "gw" $cfg "root" $ }}
{{- if $cfg.gateway.enabled }}
---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: {{ include "gateway.resourceName" $ctx }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "gateway.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "gateway.selectorLabels" $ctx | nindent 4 }}
  servers:
    {{- include "gateway.servers" $ctx | nindent 4 }}
{{- end }}
{{- end }}