{{- range $name, $cfg := .Values.gateways }}
{{- $ctx := dict "name" $name "gw" $cfg "root" $ }}
{{- if $cfg.loadbalancer.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gateway.loadBalancerName" $ctx }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "gateway.labels" $ctx | nindent 4 }}
  annotations:
    {{- include "gateway.loadBalancerAnnotations" $ctx | nindent 4 }}
spec:
  type: LoadBalancer
  selector:
    {{- include "gateway.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP
    - name: status-port
      port: 15021
      targetPort: 15021
      protocol: TCP
{{- end }}
{{- end }}