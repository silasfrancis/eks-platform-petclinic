{{- range $name, $cfg := .Values.gateways }}
{{- $ctx := dict "name" $name "gw" $cfg "root" $ }}
{{- if $cfg.vpa.enabled }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "gateway.vpaName" $ctx }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "gateway.labels" $ctx | nindent 4 }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "gateway.resourceName" $ctx }}
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: {{ $.Values.gatewayDefaults.container.name }}
        minAllowed:
          cpu: {{ ($cfg.vpa.minAllowed).cpu | default $.Values.gatewayDefaults.vpa.minAllowed.cpu }}
          memory: {{ ($cfg.vpa.minAllowed).memory | default $.Values.gatewayDefaults.vpa.minAllowed.memory }}
        maxAllowed:
          cpu: {{ ($cfg.vpa.maxAllowed).cpu | default $.Values.gatewayDefaults.vpa.maxAllowed.cpu }}
          memory: {{ ($cfg.vpa.maxAllowed).memory | default $.Values.gatewayDefaults.vpa.maxAllowed.memory }}
        controlledResources:
          - cpu
          - memory
        controlledValues: RequestsAndLimits
{{- end }}
{{- end }}