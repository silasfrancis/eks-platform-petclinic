# ExternalDNS Route53 instance
# Private DNS records in Route53 private hosted zone.
# aws-zone-type: private ensures only private zones are managed —
# hostnames resolve only from within the VPC (WireGuard VPN clients included).
# Uses IRSA for auth — no API token needed.
# OVERRIDE: serviceAccount role ARN, txtOwnerId
external-dns-route53:
  fullnameOverride: external-dns-route53
  provider:
    name: aws
  env:
    - name: AWS_REGION
      value: "us-east-2"
  extraArgs:
    aws-zone-type: private
  domainFilters:
    - internal.lefrancis.org
  policy: sync
  sources:
    - service
    - istio-gateway
  annotationFilter: "external-dns.alpha.kubernetes.io/provider=route53"
  registry: txt
  txtOwnerId: "eks-cluster-01-route53"
  txtPrefix: "route53-"
  logLevel: info
  logFormat: json
  interval: 1m
  nodeSelector:
    node-type: on-demand
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  serviceAccount:
    create: true
    name: external-dns-route53
    annotations:
      # OVERRIDE: add role ARN annotation after Terraform creates the IAM role
      eks.amazonaws.com/role-arn: "arn:aws:iam::<account-id>:role/<cluster-name>-external-dns-route53"
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: monitoring

# ESO SecretStore — connects to AWS Secrets Manager
# Used to pull the Cloudflare API token for ExternalDNS and cert-manager
secretStore:
  enabled: true
  name: ""
  kind: SecretStore
  awsRegion: us-east-2

# ESO ExternalSecret — pulls Cloudflare API token from AWS Secrets Manager
# Creates cloudflare-api-token Kubernetes secret consumed by ExternalDNS
# OVERRIDE: remoteRef.key per environment
externalSecret:
  enabled: true
  name: ""
  refreshInterval: 1h
  target:
    name: ""
    creationPolicy: Owner
  data: []
