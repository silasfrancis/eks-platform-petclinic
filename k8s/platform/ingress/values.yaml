# Ingress platform values.
# Manages external traffic into the cluster via Istio Gateway, ExternalDNS and cert-manager.
#
# Architecture:
#   Istio ingress gateway  → receives traffic via AWS NLB (EKS Cloud Provider)
#   cert-manager           → issues wildcard TLS via Let's Encrypt DNS-01 + Cloudflare
#   ExternalDNS Cloudflare → public DNS records for internet-facing services
#   ExternalDNS Route53    → private DNS records for internal dashboards (VPN only)
#
# Two gateway deployments:
#   public   → internet-facing NLB, petclinic app only
#   internal → private NLB, dashboards only (Grafana, ArgoCD, Prometheus, Loki)
#              only reachable via WireGuard VPN + Route53 private hosted zone
#
# Certificate flow:
#   cert-manager → Let's Encrypt DNS-01 → Cloudflare TXT record → wildcard TLS secret
#   Istio Gateway reads TLS secret → terminates TLS for *.lefrancis.org
#
# OVERRIDE REQUIRED:
#   gateways.public.loadbalancer.annotations    subnets + SG IDs
#   gateways.internal.loadbalancer.annotations  subnets + SG IDs
#   gateways.*.certificate.spec.secretName
#   gateways.*.certificate.spec.issuerRef.name
#   external-dns-route53.serviceAccount.annotations role ARN
#   external-dns-cloudflare txtOwnerId + external-dns-route53 txtOwnerId
#   secretStore.name
#   esoServiceAccount.annotations role ARN

# Shared defaults inherited by all gateway instances.
# Override per gateway entry only when the instance needs to differ.
gatewayDefaults:
  deployment:
    annotations:
      inject.istio.io/templates: gateway
      sidecar.istio.io/inject: "true"
      prometheus.io/path: /stats/prometheus
      prometheus.io/port: "15020"
      prometheus.io/scrape: "true"
    labels:
      sidecar.istio.io/inject: "true"

  container:
    name: istio-proxy
    image: auto
    ports:
      - containerPort: 15090
        protocol: TCP
        name: http-envoy-prom

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  # runAsUser/runAsGroup 1337 is the Istio proxy UID
  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    runAsUser: 1337
    runAsGroup: 1337
    runAsNonRoot: true
    capabilities:
      drop: ["ALL"]

  # net.ipv4.ip_unprivileged_port_start=0 allows the proxy to bind
  # to ports below 1024 (80, 443) without root
  podSecurityContext:
    sysctls:
      - name: net.ipv4.ip_unprivileged_port_start
        value: "0"

  # Read access to TLS secrets required for cert-manager certificate mounting
  role:
    rules:
      - apiGroups: [""]
        resources: ["secrets"]
        verbs: ["get", "watch", "list"]

  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 80

  # VPA in recommendation mode only — Goldilocks reads these for the dashboard
  # updateMode: Off is enforced in the template
  vpa:
    enabled: true
    minAllowed:
      cpu: 100m
      memory: 128Mi
    maxAllowed:
      cpu: 1100m
      memory: 1Gi

  pdb:
    enabled: true
    minAvailable: 1

  # Wildcard cert covers all subdomains — both gateways use the same domain
  certificate:
    dnsNames:
      - "lefrancis.org"
      - "*.lefrancis.org"

  tolerations: []

# Named gateway instances.
# Adding a new gateway = add one entry here. No template changes needed.
# Each entry generates: ServiceAccount, Role, RoleBinding, Deployment,
# LoadBalancer Service, HPA, VPA, PDB, Certificate, Istio Gateway.
gateways:

  # Public gateway — internet-facing NLB
  # petclinic.lefrancis.org only
  # OVERRIDE: subnets, SG, hostname
  public:
    serviceAccount:
      enabled: true

    role:
      enabled: true

    roleBinding:
      enabled: true

    deployment:
      enabled: true

    loadbalancer:
      enabled: true
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-name: "petclinic-istio-nlb"
        service.beta.kubernetes.io/aws-load-balancer-type: "external"
        service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
        # OVERRIDE: public subnet IDs
        service.beta.kubernetes.io/aws-load-balancer-subnets: "subnet-**,subnet-**"
        # OVERRIDE: NLB security group ID
        service.beta.kubernetes.io/aws-load-balancer-security-groups: "sg-**"
        external-dns.alpha.kubernetes.io/provider: "cloudflare"
        external-dns.alpha.kubernetes.io/hostname: "petclinic.lefrancis.org"
        external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
        external-dns.alpha.kubernetes.io/ttl: "120"

    certificate:
      enabled: true
      spec:
        # OVERRIDE: TLS secret name
        secretName: "petclinic-public-tls"
        issuerRef:
          # OVERRIDE: must match ClusterIssuer name in security chart
          name: "letsencrypt-cloudflare"
          kind: ClusterIssuer

    gateway:
      enabled: true
      servers:
        http:
          enabled: true
          hosts:
            - "petclinic.lefrancis.org"
          tls:
            httpsRedirect: true
        https:
          enabled: true
          hosts:
            - "petclinic.lefrancis.org"
          tls:
            mode: SIMPLE

    hpa:
      enabled: true

    vpa:
      enabled: true

    pdb:
      enabled: true

  # Internal gateway — private NLB, WireGuard VPN access only
  # Dashboards: Grafana, ArgoCD, Prometheus, Loki
  # Route53 private hosted zone — hostnames not resolvable from public internet
  # OVERRIDE: subnets, SG, hostnames
  internal:
    serviceAccount:
      enabled: true

    role:
      enabled: true

    roleBinding:
      enabled: true

    deployment:
      enabled: true

    loadbalancer:
      enabled: true
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-name: "petclinic-istio-internal-nlb"
        service.beta.kubernetes.io/aws-load-balancer-type: "external"
        # internal = private NLB — not reachable from internet
        service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
        # OVERRIDE: private subnet IDs
        service.beta.kubernetes.io/aws-load-balancer-subnets: "subnet-**,subnet-**"
        # OVERRIDE: internal NLB security group ID
        service.beta.kubernetes.io/aws-load-balancer-security-groups: "sg-**"
        external-dns.alpha.kubernetes.io/provider: "route53"
        external-dns.alpha.kubernetes.io/hostname: >
          grafana.lefrancis.org,
          argocd.lefrancis.org,
          prometheus.lefrancis.org,
          loki.lefrancis.org
        external-dns.alpha.kubernetes.io/ttl: "120"

    certificate:
      enabled: true
      spec:
        # OVERRIDE: separate secret from public gateway
        secretName: "petclinic-internal-tls"
        issuerRef:
          name: "letsencrypt-cloudflare"
          kind: ClusterIssuer

    gateway:
      enabled: true
      servers:
        http:
          enabled: true
          hosts:
            - "grafana.lefrancis.org"
            - "argocd.lefrancis.org"
            - "prometheus.lefrancis.org"
            - "loki.lefrancis.org"
          tls:
            httpsRedirect: true
        https:
          enabled: true
          hosts:
            - "grafana.lefrancis.org"
            - "argocd.lefrancis.org"
            - "prometheus.lefrancis.org"
            - "loki.lefrancis.org"
          tls:
            mode: SIMPLE

    hpa:
      enabled: true

    vpa:
      enabled: true

    pdb:
      enabled: true

# ExternalDNS — Cloudflare instance
# Public DNS records for internet-facing services.
# Picks up resources annotated with external-dns.alpha.kubernetes.io/provider=cloudflare
# OVERRIDE: txtOwnerId must be unique per cluster
external-dns-cloudflare:
  fullnameOverride: external-dns-cloudflare

  provider:
    name: cloudflare

  env:
    - name: CF_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: cloudflare-api-token
          key: cloudflare_api_token

  domainFilters:
    - lefrancis.org

  policy: sync

  sources:
    - service
    - istio-gateway

  annotationFilter: "external-dns.alpha.kubernetes.io/provider=cloudflare"

  registry: txt
  # OVERRIDE: unique per cluster
  txtOwnerId: "eks-cluster-01-cloudflare"
  txtPrefix: "cloudflare-"

  logLevel: info
  logFormat: json
  interval: 1m

  nodeSelector:
    node-type: on-demand

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

  serviceAccount:
    create: true
    name: external-dns-cloudflare

  serviceMonitor:
    enabled: true
    additionalLabels:
      release: platform-monitoring

# ExternalDNS — Route53 instance
# Private DNS records in Route53 private hosted zone.
# aws-zone-type: private ensures only private zones are managed —
# hostnames resolve only from within the VPC (WireGuard VPN clients included).
# Uses IRSA for auth — no API token needed.
# OVERRIDE: serviceAccount role ARN, txtOwnerId
external-dns-route53:
  fullnameOverride: external-dns-route53

  provider:
    name: aws

  env: []

  extraArgs:
    aws-zone-type: private
    aws-region: us-east-2

  domainFilters:
    - lefrancis.org

  policy: sync

  sources:
    - service
    - istio-gateway

  annotationFilter: "external-dns.alpha.kubernetes.io/provider=route53"

  registry: txt
  # OVERRIDE: must differ from Cloudflare instance — unique per cluster
  txtOwnerId: "eks-cluster-01-route53"
  txtPrefix: "route53-"

  logLevel: info
  logFormat: json
  interval: 1m

  nodeSelector:
    node-type: on-demand

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

  serviceAccount:
    create: true
    name: external-dns-route53
    annotations:
      # OVERRIDE: add role ARN annotation after Terraform creates the IAM role
      eks.amazonaws.com/role-arn: "arn:aws:iam::<account-id>:role/<cluster-name>-external-dns-route53"

  serviceMonitor:
    enabled: true
    additionalLabels:
      release: platform-monitoring

# ESO SecretStore — connects to AWS Secrets Manager
# Used to pull the Cloudflare API token for ExternalDNS and cert-manager
secretStore:
  enabled: true
  name: ""
  kind: SecretStore
  awsRegion: us-east-2

# ESO ExternalSecret — pulls Cloudflare API token from AWS Secrets Manager
# Creates cloudflare-api-token Kubernetes secret consumed by ExternalDNS
# OVERRIDE: remoteRef.key per environment
externalSecret:
  enabled: true
  name: ""
  refreshInterval: 1h
  creationPolicy: Owner
  data: []
  # - secretKey: cloudflare_api_token
  #   remoteRef:
  #     key: ""
  #     property: cloudflare_api_token

# ServiceAccount for ESO — IRSA allows reading from AWS Secrets Manager
# OVERRIDE: add role ARN annotation after Terraform creates the IAM role
esoServiceAccount:
  create: true
  name: ""
  annotations: {}
  # eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/<cluster-name>-eso-ingress