# Ingress platform configuration
# Manages external and internal traffic into the EKS cluster using the official
# Istio Gateway sub-charts, ExternalDNS controllers, and cert-manager.
#
# Architecture:
#   - Public gateway   → Internet-facing AWS NLB routing to public application.
#   - Internal gateway → Private AWS NLB (VPC/VPN only) routing to internal tooling.
#   - ExternalDNS (CF) → Synchronizes public DNS records with Cloudflare.
#   - ExternalDNS (R53)→ Synchronizes private DNS records with AWS Route53.
#   - Cert-manager     → Provisions wildcard TLS via Let's Encrypt DNS-01.
#
# Required environment overrides:
#   - public-gateway.service.annotations   (Subnets + SG IDs)
#   - internal-gateway.service.annotations (Subnets + SG IDs)
#   - customCertificates.*.issuerRefName   (Staging vs Production ClusterIssuer)
#   - external-dns-route53.serviceAccount.annotations (IAM Role ARN)
#   - esoServiceAccount.annotations                    (IAM Role ARN)
#   - external-dns-*.txtOwnerId                       (Unique cluster identifier)

# Wildcard domain targets handled by this ingress platform
certificate:
  dnsNames:
    - "lefrancis.org"
    - "*.lefrancis.org"
    - "*.internal.lefrancis.org"

# Public gateway sub-chart setup
public-gateway:
  # Overrides the deployment, service, and HPA names to be completely unique
  name: "public-ingressgateway"

  labels:
    app: public-istio-ingressgateway
    istio: ingressgateway

  serviceAccount:
    create: true
    name: "public-ingressgateway-sa" # Overrides the service account name collision

  containerSecurityContext:
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    runAsUser: 1337
    runAsGroup: 1337
    runAsNonRoot: true
    capabilities:
      drop: ["ALL"]

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

  podDisruptionBudget:
    minAvailable: 1

  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "external"
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"

# Internal gateway sub-chart setup
internal-gateway:
  # Overrides the deployment, service, and HPA names to be completely unique
  name: "internal-ingressgateway"

  labels:
    app: internal-istio-ingressgateway
    istio: ingressgateway

  serviceAccount:
    create: true
    name: "internal-ingressgateway-sa" # Overrides the service account name collision

  containerSecurityContext:
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    runAsUser: 1337
    runAsGroup: 1337
    runAsNonRoot: true
    capabilities:
      drop: ["ALL"]

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

  podDisruptionBudget:
    minAvailable: 1

  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "external"
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"

# Custom certificate and routing configurations
# Consumed by custom manifests in templates/ to generate Certificates and Gateways
customCertificates:
  public:
    secretName: "petclinic-public-tls"
    issuerRefName: "security-cluster-issuer"
    hosts:
      - "*.lefrancis.org"
    gatewayAnnotations:
      external-dns.alpha.kubernetes.io/provider: "cloudflare"

  internal:
    secretName: "petclinic-internal-tls"
    issuerRefName: "security-cluster-issuer"
    hosts:
      - "*.internal.lefrancis.org"
    gatewayAnnotations:
      external-dns.alpha.kubernetes.io/provider: "route53"
      external-dns.alpha.kubernetes.io/hostname: "*.internal.lefrancis.org"

