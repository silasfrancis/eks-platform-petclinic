# Ingress platform values.
# Manages external traffic entry into the cluster via Istio Gateway and ExternalDNS.
#
# Architecture:
#   - Istio ingress gateway: receives external traffic via AWS NLB
#   - AWS NLB: created automatically by EKS Cloud Provider from Service annotations
#     (no ALB controller required — NLB is handled natively by Kubernetes)
#   - cert-manager: issues and renews wildcard TLS certificate via Let's Encrypt DNS-01
#   - ExternalDNS: syncs DNS records to Cloudflare from Service/Gateway annotations
#   - Cloudflare API token: pulled from AWS Secrets Manager via ESO
#
# Certificate flow:
#   cert-manager → Let's Encrypt DNS-01 challenge → Cloudflare DNS → TLS secret
#   Istio Gateway reads TLS secret → terminates TLS for *.lefrancis.org
#
# DNS flow:
#   ExternalDNS reads Gateway annotations → creates CNAME records in Cloudflare
#   All subdomains (petclinic, argocd, grafana) point to the same NLB DNS name

# Ingress gateway values.
# Supports multiple gateway deployments — public and internal.
# Templates loop over the gateways map to create all resources.
#
# Each gateway entry creates:
#   - ServiceAccount + Role + RoleBinding
#   - Deployment
#   - LoadBalancer Service
#   - HPA + VPA + PDB
#   - Certificate
#   - Istio Gateway resource
#
# Adding a new gateway = add one entry to gateways map.
# No template changes needed.

# Shared defaults inherited by all gateway instances
# Override per gateway entry as needed
gatewayDefaults:
  deployment:
    annotations:
      inject.istio.io/templates: gateway
      sidecar.istio.io/inject: "true"
      prometheus.io/path: /stats/prometheus
      prometheus.io/port: "15020"
      prometheus.io/scrape: "true"
    labels:
      sidecar.istio.io/inject: "true"

  container:
    name: istio-proxy
    image: auto
    ports:
      - containerPort: 15090
        protocol: TCP
        name: http-envoy-prom

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    runAsUser: 1337
    runAsGroup: 1337
    runAsNonRoot: true
    capabilities:
      drop: ["ALL"]

  podSecurityContext:
    sysctls:
      - name: net.ipv4.ip_unprivileged_port_start
        value: "0"

  role:
    rules:
      - apiGroups: [""]
        resources: ["secrets"]
        verbs: ["get", "watch", "list"]

  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 80

  vpa:
    enabled: true
    minAllowed:
      cpu: 100m     
      memory: 128Mi
    maxAllowed:
      cpu: 1100m 
      memory: 1Gi

  pdb:
    enabled: true
    minAvailable: 1

  certificate:
    dnsNames:
      - "lefrancis.org"
      - "*.lefrancis.org"

  tolerations: []

# Named gateway instances
# Each entry generates a full set of gateway resources
# Key is used as the base name for all resources
gateways:

  # Public gateway — internet-facing NLB
  # Exposes petclinic app only
  # DNS managed by Cloudflare ExternalDNS
  public:
    serviceAccount:
      enabled: true

    role:
      enabled: true

    roleBinding:
      enabled: true

    deployment:
      enabled: true

    loadbalancer:
      enabled: true
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-name: "petclinic-istio-nlb"
        service.beta.kubernetes.io/aws-load-balancer-type: "external"
        service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
        # public subnets
        service.beta.kubernetes.io/aws-load-balancer-subnets: "subnet-**,subnet-**"
        # NLB security group
        service.beta.kubernetes.io/aws-load-balancer-security-groups: "sg-**"
        external-dns.alpha.kubernetes.io/provider: "cloudflare"
        external-dns.alpha.kubernetes.io/hostname: "petclinic.lefrancis.org"
        external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
        external-dns.alpha.kubernetes.io/ttl: "120"

    certificate:
      enabled: true
      spec:
        # secret name for TLS cert
        secretName: "petclinic-public-tls"
        issuerRef:
          # ClusterIssuer name from security chart
          name: "letsencrypt-cloudflare"
          kind: ClusterIssuer

    gateway:
      enabled: true
      servers:
        http:
          enabled: true
          hosts:
            - "petclinic.lefrancis.org"
          tls:
            httpsRedirect: true
        https:
          enabled: true
          hosts:
            - "petclinic.lefrancis.org"
          tls:
            mode: SIMPLE
            # resolved from certificate.spec.secretName by helper

    hpa:
      enabled: true

    vpa:
      enabled: true

    pdb:
      enabled: true

  # Internal gateway — private NLB, VPN access only
  # Exposes dashboards: Grafana, ArgoCD, Prometheus, Loki
  # DNS managed by Route53 ExternalDNS (private hosted zone)
  # Only reachable via WireGuard VPN
  internal:
    serviceAccount:
      enabled: true

    role:
      enabled: true

    roleBinding:
      enabled: true

    deployment:
      enabled: true

    loadbalancer:
      enabled: true
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-name: "petclinic-istio-internal-nlb"
        service.beta.kubernetes.io/aws-load-balancer-type: "external"
        service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
        # private subnets
        service.beta.kubernetes.io/aws-load-balancer-subnets: "subnet-**,subnet-**"
        # internal NLB security group
        service.beta.kubernetes.io/aws-load-balancer-security-groups: "sg-**"
        external-dns.alpha.kubernetes.io/provider: "route53"
        external-dns.alpha.kubernetes.io/hostname: >
          grafana.lefrancis.org,
          argocd.lefrancis.org,
          prometheus.lefrancis.org,
          loki.lefrancis.org
        external-dns.alpha.kubernetes.io/ttl: "120"

    certificate:
      enabled: true
      spec:
        # OVERRIDE: separate secret for internal cert
        secretName: "petclinic-internal-tls"
        issuerRef:
          name: "letsencrypt-cloudflare"
          kind: ClusterIssuer

    gateway:
      enabled: true
      servers:
        http:
          enabled: true
          hosts:
            - "grafana.lefrancis.org"
            - "argocd.lefrancis.org"
            - "prometheus.lefrancis.org"
            - "loki.lefrancis.org"
          tls:
            httpsRedirect: true
        https:
          enabled: true
          hosts:
            - "grafana.lefrancis.org"
            - "argocd.lefrancis.org"
            - "prometheus.lefrancis.org"
            - "loki.lefrancis.org"
          tls:
            mode: SIMPLE

    hpa:
      enabled: true

    vpa:
      enabled: true

    pdb:
      enabled: true

# ExternalDNS — Cloudflare instance
# Manages public DNS records for internet-facing services only.
# Watches services/gateways annotated with provider=cloudflare.
external-dns-cloudflare:
  fullnameOverride: external-dns-cloudflare

  provider:
    name: cloudflare

  # Cloudflare API token from ESO-created secret
  env:
    - name: CF_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: cloudflare-api-token
          key: cloudflare_api_token

  domainFilters:
    - lefrancis.org

  # sync: creates and deletes to match cluster state
  policy: sync

  sources:
    - service
    - istio-gateway

  # Only manage resources with this annotation
  annotationFilter: "external-dns.alpha.kubernetes.io/provider=cloudflare"

  # annotationPrefix differentiates this instance's annotations
  # from the Route53 instance — prevents both instances processing same resource
  annotationPrefix: ""

  registry: txt
  # OVERRIDE: unique per cluster
  txtOwnerId: "eks-cluster-01-cloudflare"
  txtPrefix: "cloudflare-"

  logLevel: info
  logFormat: json
  interval: 1m

  nodeSelector:
    node-type: on-demand

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

  serviceAccount:
    create: true
    name: external-dns-cloudflare

  serviceMonitor:
    enabled: true
    additionalLabels:
      release: platform-monitoring # must match Prometheus serviceMonitorSelector label

# ExternalDNS — Route53 instance
# Manages private DNS records in Route53 private hosted zone.
# Watches services/gateways annotated with provider=route53.
# Uses IRSA for authentication — no API token needed.
# OVERRIDE REQUIRED:
#   serviceAccount.annotations.eks.amazonaws.com/role-arn
#   txtOwnerId (must be unique per cluster)
external-dns-route53:
  fullnameOverride: external-dns-route53

  provider:
    name: aws

  # IRSA handles authentication — no env vars needed
  env: []

  # Route53-specific args
  # zoneType: private — only manages records in private hosted zones
  # This is what keeps internal dashboard URLs off the public internet
  extraArgs:
    aws-zone-type: private          # only touch private hosted zones
    aws-region: us-east-2          

  domainFilters:
    - lefrancis.org    # OVERRIDE: your domain

  # sync: creates and deletes to match cluster state
  policy: sync

  sources:
    - service
    - istio-gateway

  # Only manage resources with this specific annotation value
  # prevents Route53 instance from picking up Cloudflare-annotated resources
  annotationFilter: "external-dns.alpha.kubernetes.io/provider=route53"

  registry: txt
  # Must be different from Cloudflare instance and unique per cluster
  txtOwnerId: "eks-cluster-01-route53"
  txtPrefix: "route53-"

  logLevel: info
  logFormat: json
  interval: 1m

  nodeSelector:
    node-type: on-demand

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

  serviceAccount:
    create: true
    name: external-dns-route53
    annotations:
      # OVERRIDE: replace with actual role ARN from Terraform
      eks.amazonaws.com/role-arn: "arn:aws:iam::<account-id>:role/<cluster-name>-external-dns-route53"

  serviceMonitor:
    enabled: true
    additionalLabels:
      release: platform-monitoring # must match Prometheus serviceMonitorSelector label

# Secret Store — ESO ClusterSecretStore for pulling secrets from AWS Secrets Manager
# Used by ExternalDNS to get the Cloudflare API token
secretStore:
  enabled: true
  name: ""
  kind: SecretStore
  awsRegion: us-east-2

# ExternalSecret — pulls security-related secrets from AWS Secrets Manager
externalSecret:
  enabled: true
  name: ""
  refreshInterval: 1h
  creationPolicy: Owner
  data: {}
    # Cloudflare API token for cert-manager DNS-01 challenge
    # - secretKey: api-token
    #   remoteRef:
    #     key: "" # Update path to match your Secrets Manager structure
    #     property: cloudflare_api_token

# Service Account
# IRSA annotations go here to allow external dns get the cloudflare api token need to auto create dns records.
# Example:
#   annotations:
#     eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/<service-name>
esoServiceAccount:
  create: true
  name: ""          # defaults to Chart.Name via _helpers.tpl
  annotations: {}

