gateways:
  public:
    loadbalancer:
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-name: "petclinic-istio-nlb"
        service.beta.kubernetes.io/aws-load-balancer-subnets: "subnet-**,subnet-**"
        service.beta.kubernetes.io/aws-load-balancer-security-groups: "sg-**"
    certificate:
      enabled: true
      spec:
        secretName: "petclinic-public-tls"
        issuerRef:
          name: "letsencrypt-cloudflare"
          kind: ClusterIssuer
        
  internal:
    loadbalancer:
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-name: "petclinic-istio-internal-nlb"
        service.beta.kubernetes.io/aws-load-balancer-subnets: "subnet-**,subnet-**"
        service.beta.kubernetes.io/aws-load-balancer-security-groups: "sg-**"
    certificate:
      enabled: true
      spec:
        secretName: "petclinic-internal-tls"
        issuerRef:
          name: "letsencrypt-cloudflare"
          kind: ClusterIssuer

external-dns-cloudflare:
  env:
    - name: CF_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: platform-ingress-secrets 
          key: cloudflare_api_token

  registry: txt
  txtOwnerId: "eks-cluster-01-cloudflare"
  txtPrefix: "cloudflare-"


external-dns-route53:
  provider:
    name: aws    
  serviceAccount:
    create: true
    name: external-dns-route53
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::<account-id>:role/<cluster-name>-external-dns"

  registry: txt
  txtOwnerId: "eks-cluster-01-route53"
  txtPrefix: "route53-"


secretStore:
  enabled: true
  name: ""

externalSecret:
  enabled: true
  name: ""
  refreshInterval: 1h
  creationPolicy: Owner
  data:
    - secretKey: cloudflare_api_token
      remoteRef:
        key: "" 
        property: cloudflare_api_token

esoServiceAccount:
  name: ""      
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/<service-name>
