{{- $namespaces := join "|" .Values.monitoring.managedNamespaces -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-application
  namespace: {{ .Release.Namespace }}
  labels:
    release: {{ .Values.monitoring.releaseLabel }}
spec:
  groups:
    - name: application.error_rate
      interval: 30s
      rules:
        - alert: ServiceErrorRateWarning
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{namespace=~"{{ $namespaces }}",status=~"5.."}[5m])) by (job, namespace)
              /
              sum(rate(http_server_requests_seconds_count{namespace=~"{{ $namespaces }}"}[5m])) by (job, namespace)
            ) > 0.01
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Service {{ "{{" }} $labels.job {{ "}}" }} error rate above 1%"
            description: "Service {{ "{{" }} $labels.job {{ "}}" }} in namespace {{ "{{" }} $labels.namespace {{ "}}" }} has a 5xx error rate."

        - alert: ServiceErrorRateCritical
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{namespace=~"{{ $namespaces }}",status=~"5.."}[5m])) by (job, namespace)
              /
              sum(rate(http_server_requests_seconds_count{namespace=~"{{ $namespaces }}"}[5m])) by (job, namespace)
            ) > 0.05
          for: 5m
          labels:
            severity: critical

    - name: application.latency
      interval: 30s
      rules:
        - alert: ServiceLatencyP99Warning
          expr: |
            histogram_quantile(0.99,
              sum(rate(http_server_requests_seconds_bucket{namespace=~"{{ $namespaces }}"}[5m])) by (job, namespace, le)
            ) > 1
          for: 5m
          labels:
            severity: warning

        - alert: ServiceZeroTraffic
          expr: |
            sum(rate(http_server_requests_seconds_count{namespace=~"{{ $namespaces }}"}[5m])) by (job, namespace) == 0
          for: 5m
          labels:
            severity: critical