{{- $namespaces := join "|" .Values.monitoring.managedNamespaces -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-istio
  namespace: {{ .Release.Namespace }}
  labels:
    release: {{ .Values.monitoring.releaseLabel }}
spec:
  groups:
    - name: istio.mtls
      interval: 30s
      rules:
        - alert: IstioMTLSFailureRateHigh
          expr: |
            sum(rate(istio_requests_total{destination_service_namespace=~"{{ $namespaces }}",response_code="403"}[5m])) by (source_workload, destination_workload) > 0
          for: 2m
          labels:
            severity: critical

    - name: istio.sidecar
      interval: 60s
      rules:
        - alert: IstioSidecarNotInjected
          expr: |
            count(kube_pod_labels{namespace=~"{{ $namespaces }}"} unless on(pod, namespace)
            kube_pod_labels{namespace=~"{{ $namespaces }}",label_security_istio_io_tlsMode="istio"}) > 0
          for: 5m
          labels:
            severity: warning

    - name: istio.traffic
      interval: 30s
      rules:
        - alert: IstioHighRetryRate
          expr: |
            (
              sum(rate(envoy_cluster_upstream_rq_retry{namespace=~"{{ $namespaces }}"}[5m])) by (pod, namespace)
              /
              sum(rate(envoy_cluster_upstream_rq_total{namespace=~"{{ $namespaces }}"}[5m])) by (pod, namespace)
            ) > 0.05
          for: 5m
          labels:
            severity: warning