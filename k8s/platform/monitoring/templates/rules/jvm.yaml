{{- $namespaces := join "|" .Values.monitoring.managedNamespaces -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-jvm
  namespace: {{ .Release.Namespace }}
  labels:
    release: {{ .Values.monitoring.releaseLabel }}
spec:
  groups:
    - name: jvm.heap
      interval: 30s
      rules:
        - alert: JVMHeapUsageWarning
          expr: |
            (
              sum(jvm_memory_used_bytes{namespace=~"{{ $namespaces }}",area="heap"}) by (job, namespace, pod)
              /
              sum(jvm_memory_max_bytes{namespace=~"{{ $namespaces }}",area="heap"}) by (job, namespace, pod)
            ) > 0.85
          for: 10m
          labels:
            severity: warning

    - name: jvm.database
      interval: 30s
      rules:
        - alert: HikariPoolExhausted
          expr: |
            hikaricp_connections_pending{namespace=~"{{ $namespaces }}"} > 0
          for: 5m
          labels:
            severity: critical