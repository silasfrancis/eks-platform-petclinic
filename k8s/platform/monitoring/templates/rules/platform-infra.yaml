{{- $namespaces := join "|" .Values.monitoring.managedNamespaces -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-platform
  namespace: {{ .Release.Namespace }}
  labels:
    release: {{ .Values.monitoring.releaseLabel }}
spec:
  groups:
    - name: platform.infra.nodes
      interval: 30s
      rules:
        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 2m
          labels:
            severity: critical

    - name: platform.infra.storage
      interval: 30s
      rules:
        - alert: PVCUsageHigh
          expr: |
            (
              kubelet_volume_stats_used_bytes{namespace=~"{{ $namespaces }}"}
              /
              kubelet_volume_stats_capacity_bytes
            ) > 0.85
          for: 5m
          labels:
            severity: warning