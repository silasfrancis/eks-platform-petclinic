{{- range .Values.petclinic.services }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.petclinic.namespace }}
  labels:
    app: {{ .name }}
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      {{- toYaml .selectorLabels | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ $.Values.petclinic.namespace }}
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      honorLabels: true
{{- end }}