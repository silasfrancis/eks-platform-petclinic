monitoring:
  namespace: monitoring

petclinic:
  namespace: petclinic

  services:
    - name: api-gateway
      selectorLabels:
        app: api-gateway

    - name: customers-service
      selectorLabels:
        app: customers-service

    - name: visits-service
      selectorLabels:
        app: visits-service

    - name: vets-service
      selectorLabels:
        app: vets-service

kube-prometheus-stack:

  crds:
    upgradeJob:
      enabled: true

  kubeEtcd:
    enabled: false

  kubeControllerManager:
    enabled: false

  kubeScheduler:
    enabled: false

  kubeProxy:
    enabled: false

  prometheus:
    prometheusSpec:

      # Discover ServiceMonitors in any namespace
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelector: {}
      serviceMonitorNamespaceSelector: {}

      # Discover PodMonitors in any namespace
      podMonitorSelectorNilUsesHelmValues: false
      podMonitorSelector: {}
      podMonitorNamespaceSelector: {}
      podMetadata:
        annotations:
          traffic.sidecar.istio.io/includeOutboundIPRanges: "*"

      # Discover PrometheusRules in any namespace
      ruleSelectorNilUsesHelmValues: false
      ruleSelector: {}
      ruleNamespaceSelector: {}

      # Retention
      retention: 15d
      retentionSize: "10GB"

      # Persistent storage using EKS gp3
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: gp3
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi

  grafana:
    # adminPassword: "changeme"  # override via ESO in production
    admin:
      ## Name of the secret. Can be templated.
      existingSecret: ""
      userKey: admin-user
      passwordKey: admin-password

    persistence:
      enabled: true
      type: sts
      storageClassName: gp3
      accessModes:
        - ReadWriteOnce
      size: 5Gi

    sidecar:
      dashboards:
        enabled: true
        searchNamespace: ALL  
        label: grafana_dashboard
        labelValue: "1"

      datasources:
        enabled: true
        uid: prometheus     

    additionalDataSources:
      - name: Loki
        type: loki
        uid: loki
        url: http://loki-gateway.monitoring.svc.cluster.local
        access: proxy
        isDefault: false
        jsonData:
          maxLines: 1000  

  alertmanager:
    # Mount the ESO-synced secret into Alertmanager
    alertmanagerSpec:
      secrets:
        - alertmanager-receivers-secret    # ESO creates this

    config:
      global:
        resolve_timeout: 5m
        # Email global config
        smtp_smarthost: 'smtp.zoho.com:587'
        smtp_from: 'alerts@lefrancis.org'
        smtp_auth_username: 'silas@lefrancis.org'
        smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-receivers-secret/email-password
        smtp_require_tls: true

      # Inhibition rules — suppress warnings when critical is firing
      inhibit_rules:
        - source_matchers:
            - severity = critical
          target_matchers:
            - severity = warning
          equal:
            - namespace
            - alertname

      # Routing tree
      route:
        group_by: ['namespace', 'alertname', 'severity']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 3h
        receiver: 'null'
        routes:
          # Silence Watchdog — it's a heartbeat alert not a real alert
          - receiver: 'null'
            matchers:
              - alertname = "Watchdog"

          # Critical — Slack + Email
          - receiver: 'critical-receiver'
            matchers:
              - severity = critical
            continue: false

          # Warning — Slack only
          - receiver: 'warning-receiver'
            matchers:
              - severity = warning
            continue: false

      receivers:
        - name: 'null'

        - name: 'warning-receiver'
          slack_configs:
            - api_url_file: /etc/alertmanager/secrets/alertmanager-receivers-secret/slack-webhook-url
              channel: '#petclinic-warnings'
              send_resolved: true
              title: |-
                [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
              text: |-
                {{ range .Alerts }}
                *Severity:* {{ .Labels.severity }}
                *Namespace:* {{ .Labels.namespace }}
                *Description:* {{ .Annotations.description }}
                *Runbook:* {{ .Annotations.runbook_url }}
                {{ end }}

        - name: 'critical-receiver'
          slack_configs:
            - api_url_file: /etc/alertmanager/secrets/alertmanager-receivers-secret/slack-webhook-url
              channel: '#petclinic-critical'
              send_resolved: true
              title: |-
                [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
              text: |-
                {{ range .Alerts }}
                *Severity:* {{ .Labels.severity }}
                *Namespace:* {{ .Labels.namespace }}
                *Description:* {{ .Annotations.description }}
                *Runbook:* {{ .Annotations.runbook_url }}
                {{ end }}
          email_configs:
            - to: 'silas@lefrancis.org'
              send_resolved: true
              headers:
                Subject: '[CRITICAL] {{ .CommonLabels.alertname }} - {{ .CommonLabels.namespace }}'

      templates:
        - '/etc/alertmanager/config/*.tmpl'


prometheus-cloudwatch-exporter:
  enabled: true

  aws:
    stsRegional:
      enabled: true         # use regional STS endpoint for us-east-2

  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::<account-id>:role/<cluster-name>-cloudwatch-exporter"
      eks.amazonaws.com/sts-regional-endpoints: "true"

  config: |-
    region: us-east-2
    period_seconds: 60
    metrics:
      - aws_namespace: AWS/RDS
        aws_metric_name: CPUUtilization
        aws_dimensions: [DBInstanceIdentifier]
        aws_statistics: [Average]

      - aws_namespace: AWS/RDS
        aws_metric_name: DatabaseConnections
        aws_dimensions: [DBInstanceIdentifier]
        aws_statistics: [Average]

      - aws_namespace: AWS/RDS
        aws_metric_name: FreeableMemory
        aws_dimensions: [DBInstanceIdentifier]
        aws_statistics: [Average]

      - aws_namespace: AWS/RDS
        aws_metric_name: FreeStorageSpace
        aws_dimensions: [DBInstanceIdentifier]
        aws_statistics: [Average]

      - aws_namespace: AWS/RDS
        aws_metric_name: ReadLatency
        aws_dimensions: [DBInstanceIdentifier]
        aws_statistics: [Average]

      - aws_namespace: AWS/RDS
        aws_metric_name: WriteLatency
        aws_dimensions: [DBInstanceIdentifier]
        aws_statistics: [Average]

      - aws_namespace: AWS/RDS
        aws_metric_name: ReadIOPS
        aws_dimensions: [DBInstanceIdentifier]
        aws_statistics: [Average]

      - aws_namespace: AWS/RDS
        aws_metric_name: WriteIOPS
        aws_dimensions: [DBInstanceIdentifier]
        aws_statistics: [Average]

  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: 60s
    labels:
      release: kube-prometheus-stack    # must match Prometheus selector

  securityContext:
    runAsUser: 65534
    fsGroup: 65534

loki:
  fullnameOverride: "loki"
  deploymentMode: SingleBinary

  loki:
    auth_enabled: false

    storage:
      type: s3
      bucketNames:
        chunks: "<cluster-name>-loki-logs"
        ruler: "<cluster-name>-loki-logs"
        admin: "<cluster-name>-loki-logs"
      s3:
        region: us-east-2

    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    limits_config:
      ingestion_rate_strategy: global
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 32
      max_line_size: 512KB
      max_line_size_truncate: true
      allow_structured_metadata: true
      max_label_names_per_series: 30
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      split_queries_by_interval: 15m
      volume_enabled: true
      max_query_parallelism: 32
      max_entries_limit_per_query: 5000
      max_query_lookback: 2160h
      retention_period: 744h 
      retention_stream:
        - selector: '{namespace="monitoring"}'
          priority: 1
          period: 168h 

    commonConfig:
      path_prefix: /var/loki
      replication_factor: 1

  serviceAccount:
    create: true
    name: loki-sa
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::<account-id>:role/<cluster-name>-loki"

  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      storageClass: gp3
      size: 10Gi

  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

  memcached:
    enabled: false

  lokiCanary:
    enabled: false

  monitoring:
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack
    dashboards:
      enabled: true          
      labels:
        grafana_dashboard: "1"
    rules:
      enabled: true          

  gateway:
    enabled: true

alloy:
  fullnameOverride: "alloy"
  alloy:
    configMap:
      create: true
      content: |-
        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.relabel "pods" {
          targets = discovery.kubernetes.pods.targets
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            regex         = "petclinic|monitoring|istio-ingress"
            action        = "keep"
          }
        }

        loki.source.kubernetes "pods" {
          targets    = discovery.relabel.pods.output
          forward_to = [loki.process.parse.receiver]
        }

        loki.process "parse" {
          stage.json {
            expressions = {
              level   = "level",
              message = "message",
            }
          }
          stage.labels {
            values = {
              level = "level",
            }
          }
          forward_to = [loki.write.default.receiver]
        }

        loki.write "default" {
          endpoint {
            url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
          }
        }

    mounts:
      varlog: true

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi

  controller:
    type: 'daemonset'
    tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists

  configReloader:
    enabled: true

  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack