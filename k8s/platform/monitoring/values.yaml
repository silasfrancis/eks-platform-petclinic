# Monitoring platform values.
# Full observability stack: metrics, logs, dashboards, alerts.
#
# Components:
#   kube-prometheus-stack: Prometheus + Grafana + Alertmanager + node-exporter + kube-state-metrics
#   Loki: log aggregation stored in S3
#   Alloy: log collector
#   prometheus-cloudwatch-exporter: RDS metrics from CloudWatch

kube-prometheus-stack:
  fullnameOverride: "monitoring"

  crds:
    upgradeJob:
      enabled: true

  # Disable components not accessible in EKS managed control plane
  # etcd, controller-manager and scheduler are managed by AWS — not scrappable
  kubeEtcd:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false

  prometheus:
    prometheusSpec:
      # Discover ServiceMonitors across all namespaces
      # serviceMonitorSelectorNilUsesHelmValues: false removes the default
      # restriction to only monitor resources in the same namespace as Prometheus
      serviceMonitorSelectorNilUsesHelmValues: false
      # Monitor every ServiceMonitor that has the label release: monitoring
      serviceMonitorSelector:
        matchLabels:
          release: monitoring
      serviceMonitorNamespaceSelector: {}

      podMonitorSelectorNilUsesHelmValues: false
      podMonitorSelector: {}
      podMonitorNamespaceSelector: {}

      # Required for Prometheus to scrape petclinic services over Istio mTLS
      # includeOutboundIPRanges: * tells the sidecar to intercept all outbound traffic
      podMetadata:
        annotations:
          traffic.sidecar.istio.io/includeOutboundIPRanges: "*"

      ruleSelectorNilUsesHelmValues: false
      ruleSelector: {}
      ruleNamespaceSelector: {}

      retention: 15d
      retentionSize: "10GB"

      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: gp3
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi

  grafana:
    admin:
      # Set existingSecret to ESO-created secret name for grafana admin credentials
      existingSecret: "platform-monitoring-secrets"
      userKey: "" # secret key for grafana admin user name
      passwordKey: "" # secret key grafana admin password

    persistence:
      enabled: true
      type: sts
      storageClassName: gp3
      accessModes:
        - ReadWriteOnce
      size: 5Gi

    sidecar:
      dashboards:
        enabled: true
        # searchNamespace: ALL discovers ConfigMaps with grafana_dashboard label
        # across all namespaces — allows all charts to add dashboards
        searchNamespace: ALL
        label: grafana_dashboard
        labelValue: "1"
      datasources:
        enabled: true
        uid: prometheus

    # Loki datasource — not managed by the sidecar, added as additional datasource
    # url uses loki-gateway service — fullnameOverride: loki makes this predictable
    additionalDataSources:
      - name: Loki
        type: loki
        uid: loki
        url: http://loki-gateway.monitoring.svc.cluster.local
        access: proxy
        isDefault: false
        jsonData:
          maxLines: 1000

  alertmanager:
    alertmanagerSpec:
      # ESO creates platform-monitoring-secrets from AWS Secrets Manager
      # contains: slack-webhook-url, email-password
      secrets:
        - platform-monitoring-secrets

    config:
      global:
        resolve_timeout: 5m
        smtp_smarthost: "smtp.zoho.com:587"
        smtp_from: "alerts@lefrancis.org"
        smtp_auth_username: "silas@lefrancis.org"
        # Password read from ESO-created secret
        smtp_auth_password_file: /etc/alertmanager/secrets/platform-monitoring-secrets/email-password
        smtp_require_tls: true

      # Suppress warning alerts when a critical alert is already firing
      # for the same namespace and alertname — prevents duplicate noise
      inhibit_rules:
        - source_matchers:
            - severity = critical
          target_matchers:
            - severity = warning
          equal:
            - namespace
            - alertname

      route:
        group_by: ["namespace", "alertname", "severity"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 3h
        receiver: "null"
        routes:
          # Watchdog is a heartbeat alert that always fires — silence it
          - receiver: "null"
            matchers:
              - alertname = "Watchdog"
          # Critical alerts go to Slack AND email
          - receiver: "critical-receiver"
            matchers:
              - severity = critical
            continue: false
          # Warning alerts go to Slack only
          - receiver: "warning-receiver"
            matchers:
              - severity = warning
            continue: false

      receivers:
        - name: "null"

        - name: "warning-receiver"
          slack_configs:
            - api_url_file: /etc/alertmanager/secrets/platform-monitoring-secrets/slack-webhook-url
              channel: "#petclinic-warnings"
              send_resolved: true
              title: |-
                [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
              text: |-
                {{ range .Alerts }}
                *Severity:* {{ .Labels.severity }}
                *Namespace:* {{ .Labels.namespace }}
                *Description:* {{ .Annotations.description }}
                *Runbook:* {{ .Annotations.runbook_url }}
                {{ end }}

        - name: "critical-receiver"
          slack_configs:
            - api_url_file: /etc/alertmanager/secrets/platform-monitoring-secrets/slack-webhook-url
              channel: "#petclinic-critical"
              send_resolved: true
              title: |-
                [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
              text: |-
                {{ range .Alerts }}
                *Severity:* {{ .Labels.severity }}
                *Namespace:* {{ .Labels.namespace }}
                *Description:* {{ .Annotations.description }}
                *Runbook:* {{ .Annotations.runbook_url }}
                {{ end }}
          email_configs:
            - to: "silas@lefrancis.org"
              send_resolved: true
              headers:
                Subject: "[CRITICAL] {{ .CommonLabels.alertname }} - {{ .CommonLabels.namespace }}"

      templates:
        - "/etc/alertmanager/config/*.tmpl"

# CloudWatch exporter — bridges AWS RDS metrics into Prometheus
# Requires IRSA for CloudWatch:GetMetricStatistics permission
prometheus-cloudwatch-exporter:
  enabled: true

  aws:
    # Use regional STS endpoint — avoids routing through us-east-1
    stsRegional:
      enabled: true

  serviceAccount:
    create: true
    name: cloudwatch-exporter
    annotations:
      # IRSA for scraping cloudwatch metrics
      eks.amazonaws.com/role-arn: ""
      eks.amazonaws.com/sts-regional-endpoints: "true"

  config: |-
    region: us-east-2
    period_seconds: 60
    metrics:
      - aws_namespace: AWS/RDS
        aws_metric_name: CPUUtilization
        aws_dimensions: [DBInstanceIdentifier]
        aws_statistics: [Average]
      - aws_namespace: AWS/RDS
        aws_metric_name: DatabaseConnections
        aws_dimensions: [DBInstanceIdentifier]
        aws_statistics: [Average]
      - aws_namespace: AWS/RDS
        aws_metric_name: FreeableMemory
        aws_dimensions: [DBInstanceIdentifier]
        aws_statistics: [Average]
      - aws_namespace: AWS/RDS
        aws_metric_name: FreeStorageSpace
        aws_dimensions: [DBInstanceIdentifier]
        aws_statistics: [Average]
      - aws_namespace: AWS/RDS
        aws_metric_name: ReadLatency
        aws_dimensions: [DBInstanceIdentifier]
        aws_statistics: [Average]
      - aws_namespace: AWS/RDS
        aws_metric_name: WriteLatency
        aws_dimensions: [DBInstanceIdentifier]
        aws_statistics: [Average]
      - aws_namespace: AWS/RDS
        aws_metric_name: ReadIOPS
        aws_dimensions: [DBInstanceIdentifier]
        aws_statistics: [Average]
      - aws_namespace: AWS/RDS
        aws_metric_name: WriteIOPS
        aws_dimensions: [DBInstanceIdentifier]
        aws_statistics: [Average]

  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: 60s
    labels:
      release: monitoring

  securityContext:
    runAsUser: 65534
    fsGroup: 65534

# Loki — log aggregation with S3 backend
# Logs are stored in S3 — PVC is used for the WAL (write-ahead log) only
loki:
  # fullnameOverride: loki makes the service name predictable as "loki"
  # without this it would be "<release-name>-loki" which varies by environment
  fullnameOverride: "loki"
  deploymentMode: SingleBinary
  test:
    enabled: false

  loki:
    # auth_enabled: false — single tenant mode, no per-tenant auth headers needed
    auth_enabled: false

    storage:
      # s3 buckets for storing logs
      type: s3
      bucketNames:
        chunks: ""
        ruler: ""
        admin: ""
      s3:
        region: us-east-2

    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    limits_config:
      ingestion_rate_strategy: global
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 32
      max_line_size: 512KB
      max_line_size_truncate: true
      allow_structured_metadata: true
      max_label_names_per_series: 30
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      split_queries_by_interval: 15m
      volume_enabled: true
      max_query_parallelism: 32
      max_entries_limit_per_query: 5000
      max_query_lookback: 2160h
      retention_period: 744h # 31 days default retention
      retention_stream:
        # Monitoring namespace logs retained for 7 days only — high volume
        - selector: '{namespace="monitoring"}'
          priority: 1
          period: 168h

    commonConfig:
      path_prefix: /var/loki
      replication_factor: 1 # SingleBinary — no replication needed

  serviceAccount:
    create: true
    name: loki
    annotations:
      # IRSA for loki
      eks.amazonaws.com/role-arn: ""

  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      storageClass: gp3
      size: 10Gi # WAL storage — logs themselves go to S3

  # Disable all read/write/backend replicas — SingleBinary handles everything
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

  # Caches disabled
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  memcached:
    enabled: false

  # Canary disabled
  lokiCanary:
    enabled: false

  monitoring:
    serviceMonitor:
      enabled: true
      labels:
        release: monitoring
    dashboards:
      enabled: true
      labels:
        grafana_dashboard: "1"
    rules:
      enabled: true

  # Gateway enabled — provides a stable HTTP endpoint for Loki push and query
  # Alloy pushes to: http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push
  # Grafana queries: http://loki-gateway.monitoring.svc.cluster.local
  gateway:
    enabled: true

# Alloy — log collector DaemonSet (replaces deprecated Promtail)
# Collects logs from petclinic, monitoring, and istio-ingress namespaces
# Parses JSON structured logs and adds labels before shipping to Loki
alloy:
  fullnameOverride: "alloy"
  alloy:
    configMap:
      create: true
      content: |-
        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.relabel "pods" {
          targets = discovery.kubernetes.pods.targets
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          // Only collect logs from these namespaces — reduces Loki ingest volume
          // Add namespaces as needed
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            regex         = "petclinic|monitoring|istio-ingress"
            action        = "keep"
          }
        }

        loki.source.kubernetes "pods" {
          targets    = discovery.relabel.pods.output
          forward_to = [loki.process.parse.receiver]
        }

        // Parse JSON log lines and extract level label for filtering in Grafana
        loki.process "parse" {
          stage.json {
            expressions = {
              level   = "level",
              message = "message",
            }
          }
          stage.labels {
            values = {
              level = "level",
            }
          }
          forward_to = [loki.write.default.receiver]
        }

        loki.write "default" {
          endpoint {
            url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
          }
        }

    mounts:
      varlog: true

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi

  controller:
    type: "daemonset"
    tolerations:
      # Run on ALL nodes — must collect logs from SPOT nodes too
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists

  configReloader:
    enabled: true

  serviceMonitor:
    enabled: true
    additionalLabels:
      release: monitoring # this is the release label for the monitoring stack

monitoring:
  releaseLabel: monitoring # this is the release label for the monitoring stack
  # The application namespaces to be alerted on
  managedNamespaces: # list of namespaces that are being monitored
    - petclinic

# SecretStore — ESO store reference for secrets used in this chart
secretStore:
  enabled: true
  kind: SecretStore
  awsRegion: us-east-2

# ExternalSecret — pulls security-related secrets from AWS Secrets Manager
externalSecret:
  enabled: true
  name: platform-monitoring-secrets
  refreshInterval: 1h
  target:
    name: platform-monitoring-secrets
    creationPolicy: Owner
  data: []
    #  Format for override at env level
    # - secretKey: admin-user
    #   remoteRef:
    #     key: "dev/platform-monitoring"
    #     property: grafana-admin-user
    # - secretKey: admin-password
    #   remoteRef:
    #     key: "dev/platform-monitoring"
    #     property: grafana-admin-password
    # - secretKey: slack-webhook-url
    #   remoteRef:
    #     key: "dev/platform-monitoring"
    #     property: slack-webhook-url
    # - secretKey: email-password
    #   remoteRef:
    #     key: "dev/platform-monitoring"
    #     property: email-password

# Service Account
# IRSA annotations go here for services that need AWS API access.
# Example:
#   annotations:
#     eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/<service-name>
serviceAccount:
  create: true
  name: "" # defaults to Chart.Name via _helpers.tpl
  annotations: {}

ingress:
  enabled: true
  gateway: istio-ingress/ingress-internal-gateway

  monitoring:
    stacks:
      - name: grafana
        host: grafana.internal.lefrancis.org
        serviceName: monitoring-grafana
        port: 80
      - name: prometheus
        host: prometheus.internal.lefrancis.org
        serviceName: monitoring-prometheus
        port: 9090
