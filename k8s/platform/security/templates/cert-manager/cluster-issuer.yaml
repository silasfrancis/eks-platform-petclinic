{{- if .Values.clusterIssuer.enabled -}}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ include "platform-security.clusterIssuer.name" . }}
  labels:
    {{- include "platform-security.labels" . | nindent 4 }}
spec:
  {{- include "platform-security.clusterIssuer.spec" . | nindent 2 }}
{{- end }}