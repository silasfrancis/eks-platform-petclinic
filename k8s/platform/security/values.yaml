  #       key: petclinic/monitoring/alertmanager    # path in AWS Secrets Manager
  #       property: slack_webhook_url

  #   - secretKey: email-password
  #     remoteRef:
  #       key: petclinic/monitoring/alertmanager
  #       property: email_password
# Cloudfare token
# grafana admin passsword

trivy-operator:
  targetNamespaces: "petclinic"
  excludeNamespaces: "kube-system,kube-public,kube-node-lease,monitoring,karpenter,argocd,istio-system,istio-ingress,trivy-system,external-dns,cert-manager"
  operator:
    replicas: 1
    vulnerabilityScannerScanOnlyCurrentRevisions: true
    configAuditScannerScanOnlyCurrentRevisions: true
    vulnerabilityScannerEnabled: true
    configAuditScannerEnabled: true
    rbacAssessmentScannerEnabled: true
    infraAssessmentScannerEnabled: true
    exposedSecretScannerEnabled: true
    sbomGenerationEnabled: true
    clusterComplianceEnabled: true
    scannerReportTTL: "24h"
    scanJobTimeout: 5m
    scanJobsConcurrentLimit: 5
    scanJobsRetryDelay: 30s
    metricsFindingsEnabled: true
    metricsVulnIdEnabled: false 
  nodeSelector:
    node-type: on-demand
  trivyOperator:
    scanJobTolerations:
      - key: spot
        operator: Equal
        value: "true"
        effect: NoSchedule
    scanJobCustomVolumes:
      - name: trivy-ignore
        configMap:
          name: trivy-ignore
    scanJobCustomVolumesMount:
      - name: trivy-ignore
        mountPath: /etc/trivyignore
        readOnly: true
    scanJobNodeSelector: {}   
  trivy:
    mode: Standalone
    ignoreUnfixed: true
    severity: MEDIUM,HIGH,CRITICAL
    slow: true  
    timeout: "5m0s"
    useEmbeddedRegoPolicies: "true"
    useBuiltinRegoPolicies: "false"
    storageClassEnabled: true
    storageClassName: "gp3"
    storageSize: "5Gi"
    ignoreFileName: ".trivyignore"
    resources:
      requests:
        cpu: 100m
        memory: 100Mi
      limits:
        cpu: 500m
        memory: 500Mi
  nodeCollector:
    tolerations:
      - key: spot
        operator: Equal
        value: "true"
        effect: NoSchedule
  compliance:
    cron: "0 */6 * * *"
    reportType: summary
    specs:
      - eks-cis-1.4
      - k8s-nsa-1.0
      - k8s-pss-baseline-0.1
  serviceMonitor:
    enabled: true
    namespace: trivy-system
    labels:
      release: kube-prometheus-stack
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

falco:
  driver:
    enabled: true
    kind: modern_ebpf
    loader:
      enabled: false
  tty: true
  tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/master
    - effect: NoSchedule
      key: node-role.kubernetes.io/control-plane
    - key: spot
      operator: Equal
      value: "true"
      effect: NoSchedule
    - key: CriticalAddonsOnly
      operator: Exists
  collectors:
    enabled: true
    kubernetes:
      enabled: true
  metrics:
    enabled: true
    interval: 1h
    rulesCountersEnabled: true
    resourceUtilizationEnabled: true
    stateCountersEnabled: true
    kernelEventCountersEnabled: true
    libbpfStatsEnabled: true
    service:
      create: true
  falco:
    json_output: true
    json_include_output_property: true
    json_include_output_fields_property: true
    json_include_tags_property: true
    http_output:
      enabled: true
      url: "http://{{ include \"falcosidekick.fullname\" . }}:2801"
    priority: warning
    log_level: info
    stdout_output:
      enabled: true
    syslog_output:
      enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  serviceMonitor:
    create: true
    labels:
      release: kube-prometheus-stack
    interval: 15s
  grafana:
    dashboards:
      enabled: true
      configMaps:
        falco:
          name: falco-grafana-dashboard
          namespace: monitoring
          folder: "Security"
  falcosidekick:
    enabled: true
    webui:
      enabled: true
    fullfqdn: false
    config:
      extraEnv:
        - name: FALCOSIDEKICK_SLACK_WEBHOOKURL
          valueFrom:
            secretKeyRef:
              name: falcosidekick-secrets 
              key: slack_webhook_url
      slack:
        webhookurl: $(FALCOSIDEKICK_SLACK_WEBHOOKURL) 
        channel: "#petclinic-security"
        outputformat: all
        minimumpriority: warning
        messageformat: |
          🚨 *Falco Alert* | {{ .Priority }} | {{ .Rule }}
          *Output:* {{ .Output }}
          *Pod:* {{ index .OutputFields "k8s.pod.name" }}
          *Namespace:* {{ index .OutputFields "k8s.ns.name" }}
          *Node:* {{ index .OutputFields "k8s.node.name" }}
          *Time:* {{ .Time }}

      prometheus:
        extralabelsList:
          - rule
          - priority
          - source
      webui:
        enabled: false  
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack
  customRules:
    petclinic-rules.yaml: |
      {{ .Files.Get "falco-rules/petclinic-rules.yaml" | indent 4 }}

cert-manager:
  crds:
    enabled: true 
    keep: true
  global:
    nodeSelector:
      kubernetes.io/os: linux
      node-type: on-demand
    logLevel: 2
    rbac:
      create: true
      aggregateClusterRoles: true
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  prometheus:
    enabled: true
    servicemonitor:
      enabled: true
      namespace: monitoring
      prometheusInstance: default
      interval: 60s
      scrapeTimeout: 30s
      labels:
        release: kube-prometheus-stack
  webhook:
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    hostNetwork: false
    securePort: 10250
    timeoutSeconds: 30
  cainjector:
    enabled: true
    replicaCount: 1

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  startupapicheck:
    enabled: true
    timeout: 1m
    backoffLimit: 4
    nodeSelector:
      kubernetes.io/os: linux
      node-type: on-demand
  dns01RecursiveNameservers: "1.1.1.1:53,8.8.8.8:53"
  dns01RecursiveNameserversOnly: false
  enableCertificateOwnerRef: true