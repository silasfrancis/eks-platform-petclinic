namespace: kube-system

serviceAccount:
  name: aws-load-balancer-controller
  enabled: true
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::509194952955:role/dev-petclinic-alb-controller"

clusterIssuer:
  enabled: true
  name: letsencrypt-cloudflare
  spec:
    acme:
      server: https://acme-v02.api.letsencrypt.org/directory
      email: silasfrancis07@gmail.com
      privateKeySecretRef:
        name: letsencrypt-cloudflare-account-key
      solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token

secretStore:
  enabled: true
  kind: ClusterSecretStore
  name: cluster-config-secret-store
  awsRegion: us-east-2

externalSecret:
  enabled: true
  name: customers-service-external-secret
  refreshInterval: "5m"
  target:
    name: customers-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: MYSQL_HOST
      remoteRef:
        key: dev/springboot-microservices
        property: MYSQL_HOST
    - secretKey: MYSQL_PASSWORD
      remoteRef:
        key: dev/springboot-microservices
        property: MYSQL_PASSWORD
    - secretKey: MYSQL_USER
      remoteRef:
        key: dev/springboot-microservices
        property: MYSQL_USER
    - secretKey: MYSQL_DATABASE
      remoteRef:
        key: dev/springboot-microservices
        property: MYSQL_DATABASE

  # target:
