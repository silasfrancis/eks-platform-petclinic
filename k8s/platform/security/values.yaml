# Security platform values.
# Multi-layer runtime security and continuous vulnerability scanning.
#
# Components:
#   Trivy Operator: continuous image scanning and compliance checking
#   Falco: runtime threat detection using eBPF
#   Falcosidekick: routes Falco alerts to Slack
#   cert-manager: TLS certificate management (wildcard via Let's Encrypt)
#
# Secrets managed via ESO:
#   falcosidekick-secrets: Slack webhook URL for security alerts

# ClusterIssuer for cert-manager — used by ingress chart certificate
# Defined here since cert-manager lives in the security chart
# OVERRIDE: update email

clusterIssuer:
  enabled: true
  # valid email address for lets encrypt
  email: ""
  # acme server for lets encrypt
  acmeServer: https://acme-v02.api.letsencrypt.org/directory
  # private key secret name
  privateKeySecretName: letsencrypt-cloudflare-account-key
  # cloudflare secrets
  existingSecret:
    name: "" # defaults to the platform secrets created by ESO
    key: "cloudflare-api-token"

# ClusterSecretStore — ESO store reference for secrets used in this chart
ClusterSecretStore:
  enabled: true
  name: ""
  kind: ClusterSecretStore
  awsRegion: us-east-2

# ExternalSecret — pulls security-related secrets from AWS Secrets Manager
externalSecret:
  enabled: true
  name: ""
  refreshInterval: 1h
  targetSecret: platform-security-secrets
  creationPolicy: Owner
  data: []
    # Slack webhook for Falcosidekick security alerts
    # - secretKey: slack-webhook-url
    #   remoteRef:
    #     key: "" # Update path to match your Secrets Manager structure
    #     property: slack-webhook-url
    # Cloudflare API token for cert-manager DNS-01 challenge
    # - secretKey: cloudflare-api-token"
    #   remoteRef:
    #     key: "" # Update path to match your Secrets Manager structure
    #     property: cloudflare-api-token

# Service Account
# IRSA annotations go here for services that need AWS API access.
# Example:
#   annotations:
#     eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/<service-name>
serviceAccount:
  create: true
  name: "" # defaults to Chart.Name via _helpers.tpl
  annotations: {}

# Trivy Operator — continuous vulnerability scanning
# Scans only petclinic namespace — reduces noise from system workloads
# ignoreUnfixed: true — only report CVEs with available fixes (actionable)
trivy-operator:
  # Provide additional namespaces to scan, scans only namespace (petclinic) where all microservices are running by default
  targetNamespaces: "petclinic"
  # Excluded namespaces from scanning
  excludeNamespaces: "kube-system,kube-public,kube-node-lease,monitoring,karpenter,argocd,istio-system,istio-ingress,trivy-system,external-dns,cert-manager"

  operator:
    replicas: 1
    vulnerabilityScannerScanOnlyCurrentRevisions: true
    configAuditScannerScanOnlyCurrentRevisions: true
    vulnerabilityScannerEnabled: true
    configAuditScannerEnabled: true
    rbacAssessmentScannerEnabled: true
    infraAssessmentScannerEnabled: true
    exposedSecretScannerEnabled: true
    sbomGenerationEnabled: true
    clusterComplianceEnabled: true
    scannerReportTTL: "24h"
    scanJobTimeout: 5m
    scanJobsConcurrentLimit: 5
    scanJobsRetryDelay: 30s
    metricsFindingsEnabled: true
    # metricsVulnIdEnabled: false — enabling this significantly increases
    # Prometheus cardinality (one metric series per CVE ID)
    metricsVulnIdEnabled: false

  # Trivy Operator controller runs on ON_DEMAND — scanning infrastructure
  nodeSelector:
    node-type: on-demand

  trivyOperator:
    # Scan jobs must tolerate SPOT nodes to scan workloads running there
    scanJobTolerations:
      - key: spot
        operator: Equal
        value: "true"
        effect: NoSchedule
    # Mount .trivyignore from ConfigMap into scan jobs
    # ConfigMap must be created separately with CVEs to suppress
    # Should mirror the .trivyignore file in your CI pipeline
    scanJobCustomVolumes:
      - name: trivy-ignore
        configMap:
          name: trivy-ignore
    scanJobCustomVolumesMount:
      - name: trivy-ignore
        mountPath: /etc/trivyignore
        readOnly: true
    scanJobNodeSelector: {}

  trivy:
    mode: Standalone
    # ignoreUnfixed: true suppresses CVEs with no available fix
    # reduces noise — focus on actionable findings only
    ignoreUnfixed: true
    severity: MEDIUM,HIGH,CRITICAL
    # slow: true uses less CPU at the cost of longer scan time
    # appropriate for background scanning in a resource-constrained cluster
    slow: true
    timeout: "5m0s"
    # Use embedded Rego policies — no internet access required for policy download
    useEmbeddedRegoPolicies: "true"
    useBuiltinRegoPolicies: "false"
    storageClassEnabled: true
    storageClassName: "gp3"
    storageSize: "5Gi"
    ignoreFileName: ".trivyignore"
    resources:
      requests:
        cpu: 100m
        memory: 100Mi
      limits:
        cpu: 500m
        memory: 500Mi

  # nodeCollector runs on every node to collect node-level config data
  # Must tolerate SPOT nodes to assess all nodes in the cluster
  nodeCollector:
    tolerations:
      - key: spot
        operator: Equal
        value: "true"
        effect: NoSchedule

  # EKS CIS benchmark is most relevant compliance check for this cluster
  compliance:
    cron: "0 */6 * * *" # run every 6 hours
    reportType: summary
    specs:
      - eks-cis-1.4
      - k8s-nsa-1.0
      - k8s-pss-baseline-0.1

  serviceMonitor:
    enabled: true
    namespace: trivy-system
    labels:
      release: monitoring # must match Prometheus serviceMonitorSelector label

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Falco — eBPF-based runtime threat detection
# Monitors syscalls for suspicious behaviour: shell spawns, unexpected network
# connections, privilege escalation, sensitive file access etc.
# Falco platform security configuration
# Leverages modern ebpf to support tracking on kernels 6.x and above.

falco:
  # Falco platform security configuration
  # Hardened layout for modern_ebpf on Amazon Linux 2023 / Kernel 6.x

  fullnameOverride: "falco"
  tty: true

  # Modern Driver Configuration
  driver:
    enabled: true
    kind: modern_ebpf
    modernEbpf:
      leastPrivileged: false
      bufSizePreset: 4
      sysfsMount: true
    loader:
      enabled: false # Not needed for modern_ebpf

  # Keep resources sensible for your nodes
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  # Falco runs as a DaemonSet — must tolerate all node taints
  # including SPOT nodes to monitor all workloads in the cluster
  tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/master
    - effect: NoSchedule
      key: node-role.kubernetes.io/control-plane
    - key: spot
      operator: Equal
      value: "true"
      effect: NoSchedule
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoSchedule

  nodeSelector: {}
  affinity: {}

  metrics:
    enabled: true
    interval: 1h
    rulesCountersEnabled: true
    resourceUtilizationEnabled: true
    stateCountersEnabled: true
    kernelEventCountersEnabled: true
    libbpfStatsEnabled: true
    service:
      create: true

  plugins:
    # Enable the default container metadata plugin
    - name: container
      library_path: libcontainer.so
  load_plugins: [container]

  falco:
    # json_output required for Falcosidekick to parse and route alerts
    json_output: true
    json_include_output_property: true
    json_include_output_fields_property: true
    json_include_tags_property: true
    # Route alerts to Falcosidekick which fans out to Slack, Prometheus etc
    http_output:
      enabled: true
      url: "http://falco-falcosidekick:2801"
    # warning: alert on warning, error, critical, emergency
    # debug/info would generate too much noise for this cluster
    priority: warning
    log_level: info
    stdout_output:
      enabled: true
    # syslog disabled as it is noisy - alerts are sent via falcosidekick
    syslog_output:
      enabled: false

  serviceMonitor:
    create: true
    labels:
      release: monitoring # must match Prometheus serviceMonitorSelector label
    interval: 15s

  # Falco Grafana dashboard — pushed to monitoring namespace
  # discovered by Grafana sidecar via grafana_dashboard label
  grafana:
    dashboards:
      enabled: true
      configMaps:
        falco:
          name: falco-grafana-dashboard
          namespace: monitoring
          folder: "Security"

  falcosidekick:
    enabled: true
    webui:
      enabled: true
      redis:
        storageEnabled: true
        storageSize: 1Gi
        storageClass: "gp3"
    fullfqdn: false
    config:
      # Slack webhook URL pulled from ESO-created secret
      # Ensure platform-security-secrets exists (created by externalSecret above)
      extraEnv:
        - name: FALCOSIDEKICK_SLACK_WEBHOOKURL
          valueFrom:
            secretKeyRef:
              name: platform-security-secrets
              key: slack-webhook-url
      slack:
        # Reference the env var set above
        webhookurl: $(FALCOSIDEKICK_SLACK_WEBHOOKURL)
        channel: "#k8-alerts"
        outputformat: all
        minimumpriority: warning
        messageformat: |
          🚨 *Falco Alert* | {{ .Priority }} | {{ .Rule }}
          *Output:* {{ .Output }}
          *Pod:* {{ index .OutputFields "k8s.pod.name" }}
          *Namespace:* {{ index .OutputFields "k8s.ns.name" }}
          *Node:* {{ index .OutputFields "k8s.node.name" }}
          *Time:* {{ .Time }}

      prometheus:
        extralabelsList:
          - rule
          - priority
          - source

      webui:
        enabled: false

    serviceMonitor:
      enabled: true
      labels:
        release: monitoring # must match Prometheus serviceMonitorSelector label

  # Custom petclinic rules loaded from a separate file
  # keeping rules in a separate file makes them easier to manage and review
  # the file is mounted via .Files.Get from the chart's falco-rules/ directory
  customRules:
    petclinic-rules.yaml: |
      - list: petclinic_allowed_binaries
        items: [java, tini, sh, bash, ps, ls, cat, grep]

      - list: petclinic_allowed_outbound_ports
        items: [8080, 8081, 8082, 8083, 3306, 9090, 3100]

      - macro: is_petclinic
        condition: k8s.ns.name = "petclinic" and container.id != "host"

      - macro: petclinic_java_process
        condition: proc.name = "java"

      - rule: Shell spawned in petclinic container
        desc: Detects when a shell (bash/sh) is started inside the petclinic namespace.
        condition: spawned_process and is_petclinic and shell_procs
        output: >
          Alert: Shell spawned in petclinic
          (user=%user.name pod=%k8s.pod.name ns=%k8s.ns.name shell=%proc.name parent=%proc.pname cmdline=%proc.cmdline)
        priority: CRITICAL
        tags: [petclinic, shell]

      - rule: Unexpected outbound connection from petclinic
        desc: Alerts if petclinic containers talk to external IPs on unusual ports.
        condition: >
          outbound and is_petclinic
          and not (fd.sport in (petclinic_allowed_outbound_ports))
          and not fd.sip.name in (rfc_1918_addresses)
        output: >
          Alert: Unexpected outbound connection
          (pod=%k8s.pod.name ns=%k8s.ns.name connection=%fd.name cmdline=%proc.cmdline)
        priority: WARNING
        tags: [petclinic, network]

      - rule: Sensitive file read in petclinic
        desc: Alerts if any process in the petclinic namespace tries to read sensitive system files.
        condition: open_read and is_petclinic and fd.name in (sensitive_files)
        output: >
          Alert: Sensitive file access
          (user=%user.name pod=%k8s.pod.name file=%fd.name cmdline=%proc.cmdline)
        priority: ERROR
        tags: [petclinic, file]

      - rule: Unexpected process in petclinic container
        desc: Alerts if any binary runs that isn't on our approved "petclinic_allowed_binaries" list.
        condition: spawned_process and is_petclinic and not proc.name in (petclinic_allowed_binaries)
        output: >
          Alert: Process Drift Detected
          (proc=%proc.name parent=%proc.pname pod=%k8s.pod.name cmdline=%proc.cmdline)
        priority: WARNING
        tags: [petclinic, drift]

      - rule: Database credential file accessed in petclinic
        desc: Alerts if something other than the Java app touches the mounted K8s secrets.
        condition: >
          open_read and is_petclinic
          and fd.name startswith "/var/run/secrets"
          and not petclinic_java_process
        output: >
          Alert: Possible Secret Theft Attempt
          (proc=%proc.name pod=%k8s.pod.name file=%fd.name user=%user.name)
        priority: ERROR
        tags: [petclinic, credentials]

# cert-manager — TLS certificate lifecycle management
# Issues and renews the wildcard certificate for *.internal.lefrancis.org
# Uses DNS-01 challenge via Cloudflare — required for wildcard certificates
cert-manager:
  crds:
    # Install CRDs as part of Helm install — keeps CRDs in sync with chart version
    enabled: false
    # keep: true prevents accidental CRD deletion if chart is uninstalled
    # deleting CRDs would delete ALL certificates in the cluster
    keep: true

  global:
    nodeSelector:
      kubernetes.io/os: linux
      node-type: on-demand
    logLevel: 2
    rbac:
      create: true
      aggregateClusterRoles: true

  replicaCount: 1

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  prometheus:
    enabled: true
    servicemonitor:
      enabled: true
      namespace: monitoring
      prometheusInstance: default
      interval: 60s
      scrapeTimeout: 30s
      labels:
        release: monitoring # must match Prometheus serviceMonitorSelector label

  webhook:
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    hostNetwork: false
    securePort: 10250
    timeoutSeconds: 30

  cainjector:
    enabled: true
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  # startupapicheck is a post-install Helm hook that verifies
  # the cert-manager webhook is ready before the release completes
  # prevents ArgoCD from marking the sync successful prematurely
  startupapicheck:
    enabled: true
    timeout: 1m
    backoffLimit: 4
    nodeSelector:
      kubernetes.io/os: linux
      node-type: on-demand

  # Use Cloudflare DNS resolvers for DNS-01 self-check
  # ensures cert-manager can verify its own challenge records
  dns01RecursiveNameservers: "1.1.1.1:53,8.8.8.8:53"
  dns01RecursiveNameserversOnly: true

  # Delete certificate Secret when Certificate resource is deleted
  # prevents orphaned TLS secrets accumulating in the cluster
  enableCertificateOwnerRef: true

# Virtual service config for platform security dashboards
ingress:
  enabled: true
  gateway: istio-ingress/ingress-internal-gateway

  security:
    stacks:
      - name: falcosidekick-ui
        host: falcosidekick.internal.lefrancis.org
        serviceName: security-falcosidekick-ui
        port: 2802
