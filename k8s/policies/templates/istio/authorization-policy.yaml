---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-prometheus-scraping
  namespace: petclinic
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/monitoring/sa/kube-prometheus-stack-prometheus
      to:
        - operation:
            paths: ["/actuator/prometheus"]
            methods: ["GET"]