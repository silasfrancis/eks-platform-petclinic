{{- range $nsName, $nsConfig := .Values.clusterPolicy.managedNamespaces }}
{{- if $nsConfig.kyvernoMutate }}
---
apiVersion: policies.kyverno.io/v1
kind: NamespacedMutatingPolicy
metadata:
  name: security-and-label-mutation
  namespace: {{ $nsName }}
spec:
  evaluation:
    admission:
      enabled: true

  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]

  variables:
    - name: mainContainerName
      expression: >-
        object.spec.containers.filter(c, 
          c.name != 'istio-proxy' && 
          c.name != 'istio-init' && 
          c.name != 'queue-proxy'
        ).size() > 0
        ? object.spec.containers.filter(c, 
            c.name != 'istio-proxy' && 
            c.name != 'istio-init' && 
            c.name != 'queue-proxy'
          )[0].name
        : "unknown"

  mutations:

    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          variables.mainContainerName == "unknown"
          ? Object{}
          : Object{
              metadata: Object{
                labels: object.metadata.labels + {
                  "app.kubernetes.io/name": variables.mainContainerName,
                  "app": variables.mainContainerName,
                  "environment": "{{ $.Values.clusterPolicy.kyverno.github.branch }}"
                }
              }
            }
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object{
              containers: object.spec.containers.map(c,
                c.name == 'istio-proxy' || c.name == 'istio-init' || c.name == 'queue-proxy'
                ? c
                : Object{
                    name: c.name,
                    securityContext: (has(c.securityContext) ? c.securityContext : {}) + {
                      "runAsNonRoot": true,
                      "privileged": false,
                      "allowPrivilegeEscalation": false,
                      "readOnlyRootFilesystem": true,
                      "capabilities": {
                        "drop": ["ALL"]
                      },
                      "seccompProfile": {
                        "type": "RuntimeDefault"
                      }
                    }
                  }
              )
            }
          }

    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object{
              hostNetwork: false,
              hostPID: false,
              hostIPC: false,
              securityContext: (has(object.spec.securityContext) ? object.spec.securityContext : {}) + {
                "runAsNonRoot": true,
                "seccompProfile": {
                  "type": "RuntimeDefault"
                }
              }
            }
          }

{{- end }}
{{- end }}