# Policy enforcement platform values.
# Kyverno is a Kubernetes-native policy engine that validates, mutates
# and generates resources using admission webhooks.
#
# Four controllers handle different concerns:
#   admissionController:   validates/mutates resources at admission time
#   backgroundController:  applies generate and mutateExisting policies
#   cleanupController:     enforces TTL-based resource cleanup policies
#   reportsController:     generates policy compliance reports
#
# Policies live in k8s/policies/templates/ as separate YAML files.
# Values for policy templates can be found after the kyverno dependency section.
# This chart installs the Kyverno engine and the policies templates.

kyverno:
  # global.nodeSelector applies to all four controllers
  # Run on ON_DEMAND — policy enforcement is critical infrastructure
  # SPOT interruption could leave the cluster without admission control
  global:
    nodeSelector:
      kubernetes.io/os: linux
      node-type: on-demand

  crds:
    # install: true keeps CRDs in sync with the chart version
    # CRDs must exist before any Policy resources are applied
    install: true

  config:
    # resourceFilters tell Kyverno which resources to skip entirely
    # Filtering high-churn or system resources reduces API server load
    # and prevents Kyverno from evaluating resources it should never touch
    # For futher details refer to => https://artifacthub.io/packages/helm/kyverno/kyverno?modal=values&path=config.resourceFilters
    resourceFilters:
      - '[Event,*,*]'                    # events are ephemeral — skip
      - '[*/*,kube-system,*]'            # Kubernetes system namespace
      - '[*/*,kube-public,*]'            # public read-only namespace
      - '[*/*,kube-node-lease,*]'        # node heartbeat leases
      - '[*/*,karpenter,*]'              # Karpenter manages its own resources
      - '[*/*,argocd,*]'                 # ArgoCD manages its own resources
      - '[*/*,monitoring,*]'             # monitoring stack — not application workloads
      - '[Node,*,*]'                     # nodes are infrastructure — not policy targets
      - '[Node/?*,*,*]'
      - '[APIService,*,*]'               # API server internals
      - '[TokenReview,*,*]'              # auth internals
      - '[SubjectAccessReview,*,*]'      # auth internals
      - '[SelfSubjectAccessReview,*,*]'  # auth internals
      - '[Binding,*,*]'                  # pod scheduling internals
      - '[ReplicaSet,*,*]'               # managed by Deployment/Rollout — skip
      - '[EphemeralReport,*,*]'          # Kyverno internal reporting objects
      - '[ClusterEphemeralReport,*,*]'   # Kyverno internal reporting objects

    webhooks:
      # Exclude namespaces from webhook enforcement
      # kube-system: core Kubernetes components must always be able to start
      # karpenter: node provisioner must not be blocked by policy webhooks
      # argocd: GitOps engine must not be blocked during bootstrap
      namespaceSelector:
        matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: NotIn
            values:
              - kube-system
              - karpenter
              - argocd

    # generateSuccessEvents: false reduces Event noise in the cluster
    # Only failures are reported — success is assumed unless flagged
    generateSuccessEvents: false

  # admissionController — enforces policies at admission time
  # This is the critical path — every pod/resource creation goes through it
  admissionController:
    replicas: 1
    nodeSelector:
      kubernetes.io/os: linux
      node-type: on-demand
    container:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 384Mi    # no CPU limit — admission must never be throttled
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: platform-monitoring # must match Prometheus serviceMonitorSelector label
      interval: 30s
      scrapeTimeout: 25s

  # backgroundController — processes generate and mutateExisting policies
  # Runs outside the admission path — handles async policy application
  backgroundController:
    enabled: true
    replicas: 1
    nodeSelector:
      kubernetes.io/os: linux
      node-type: on-demand
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        memory: 128Mi
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: platform-monitoring # must match Prometheus serviceMonitorSelector label

  # cleanupController — enforces TTL cleanup policies
  # Removes resources that have exceeded their configured lifetime
  # e.g. cleaning up completed Jobs, old reports
  cleanupController:
    enabled: true
    replicas: 1
    nodeSelector:
      kubernetes.io/os: linux
      node-type: on-demand
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        memory: 128Mi
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: platform-monitoring # must match Prometheus serviceMonitorSelector label

  # reportsController — generates PolicyReport and ClusterPolicyReport resources
  # These are consumed by Grafana dashboard and CLI tooling
  reportsController:
    enabled: true
    replicas: 1
    nodeSelector:
      kubernetes.io/os: linux
      node-type: on-demand
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        memory: 128Mi
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: platform-monitoring # must match Prometheus serviceMonitorSelector label

  # Grafana dashboard — pushed to monitoring namespace
  # Discovered by Grafana sidecar via grafana_dashboard label
  grafana:
    enabled: true
    namespace: monitoring # must match Grafana namespace
    labels:
      grafana_dashboard: "1" # must match Grafana dashboard label selector

  features:
    # backgroundScan rescans all existing resources periodically
    # catches resources that existed before a policy was applied
    backgroundScan:
      enabled: true
      backgroundScanInterval: 1h
      backgroundScanWorkers: 2

    # policyExceptions: false — no resources are exempt from policies
    # Enable and restrict to a specific namespace if exceptions are needed
    policyExceptions:
      enabled: false

    # autoUpdateWebhooks keeps webhook configurations in sync
    # when policies are added or removed — prevents stale webhook rules
    autoUpdateWebhooks:
      enabled: true

# clusterPolicy — single source of truth for all policy and network configuration.
#
# Design: policy-as-data pattern.
# Templates loop over this structure rather than hardcoding rules.
# Adding a new service = add one entry to services + reference it in namespace toggles.
# Adding a new namespace = add one entry to managedNamespaces.
#
# Three template types consume this:
#   NetworkPolicy templates    → loop over services[*].ingressFrom / egressTo
#   Kyverno ValidatingPolicy   → loop over managedNamespaces where kyvernoStatic=true
#   Kyverno MutatingPolicy     → loop over managedNamespaces where kyvernoMutate=true
#
# OVERRIDE REQUIRED:
#   kyverno.ecr.accountId
#   kyverno.ecr.region
#   kyverno.github.org / repo / branch (branch changes per environment)
#   network.rds.cidr (changes per environment — dev RDS vs prod RDS)

clusterPolicy:

  # MANAGED NAMESPACES
  # Master list of namespaces this policy chart manages.
  # Each flag enables or disables a category of policy for that namespace.
  # Templates use: range $ns, $cfg := .Values.clusterPolicy.managedNamespaces
  managedNamespaces:
    petclinic:
      # defaultDeny: true installs a default-deny-all NetworkPolicy
      # All traffic is blocked unless explicitly allowed by a service policy below
      defaultDeny: true
      # dns: true allows egress to CoreDNS — required for service discovery
      # Disable only if the namespace uses hostNetwork (not recommended)
      dns: true
      # istio: true allows egress to Istio control plane ports
      # and ingress from the Istio ingress gateway
      # Disable for namespaces that do not participate in the service mesh
      istio: true
      # kyvernoStatic: true applies ValidatingPolicy to this namespace
      # Enforces pod security standards (no privileged, read-only root fs etc)
      kyvernoStatic: true
      # kyvernoMutate: true applies MutatingPolicy to this namespace
      # Auto-injects security context defaults onto pods that do not set them
      kyvernoMutate: true
      # kyvernoImageVerify: true enforces Cosign image signature verification
      # Blocks images not signed by your CI pipeline
      kyvernoImageVerify: true

  # NETWORK SPECIFICATIONS
  # Shared network configuration referenced by NetworkPolicy templates.
  # These are the infrastructure endpoints all services may need to reach.
  network:
    dns:
      # CoreDNS pod label — used in namespaceSelector + podSelector
      label: kube-dns
      namespace: kube-system
      port: 53    # UDP + TCP

    istioControlPlane:
      # Istiod pod label
      label: istiod
      namespace: istio-system
      # Ports Envoy sidecars need to reach istiod for xDS config and cert rotation
      egressPorts:
        - 15012    # xDS gRPC (Envoy → Istiod)
        - 15014    # control plane metrics
        - 15017    # webhook
      # Ports Prometheus and Istio use to scrape Envoy metrics
      ingressPorts:
        - 15090    # Envoy Prometheus metrics
        - 15020    # merged Prometheus metrics
        - 15021    # health check

    istioIngress:
      # The Istio ingress gateway — only api-gateway needs ingressFrom this
      label: istio-ingressgateway
      namespace: istio-ingress

    rds:
      # OVERRIDE: replace with actual RDS private IP per environment
      # dev RDS and prod RDS will have different IPs
      cidr: "10.0.1.50/32"
      port: 3306

    # Prometheus scraping — allow monitoring namespace to scrape all services
    prometheus:
      label: prometheus
      namespace: monitoring
      # Spring Boot Actuator metrics port — must match containerPort in service values
      port: 8080

  # KYVERNO POLICY CONSTANTS
  # Used by image verification and supply chain security policies.
  # These values identify YOUR CI pipeline as the trusted signer.
  kyverno:
    ecr:
      # OVERRIDE: replace with your AWS account ID
      accountId: "509194952955"
      region: "us-east-2"
      # All petclinic images are under this ECR repository prefix
      # Pattern: <accountId>.dkr.ecr.<region>.amazonaws.com/<prefix>/<service>
      prefix: "springboot"

    github:
      # OVERRIDE: replace with your GitHub organisation and repository
      org: "silasfrancis"
      repo: ""
      # OVERRIDE: changes per environment
      # dev cluster validates images signed by dev branch workflows
      # main cluster validates images signed by main branch workflows
      branch: ""
      # GitHub Actions OIDC issuer — do not change
      tokenIssuer: https://token.actions.githubusercontent.com
      # Workflows authorised to sign images
      # All workflows listed here are trusted signers
      authorizedWorkflows:
        - build-push.yaml
        - build-migrations.yaml

  # SERVICE TOPOLOGY
  # Defines every service, its port, and its allowed traffic relationships.
  # NetworkPolicy templates loop over this to generate per-service policies.
  #
  # Fields:
  #   label          — pod selector label value (must match app label in Helm values)
  #   port           — container port (must match containerPort in service Helm values)
  #   ingressFrom    — list of service keys allowed to send traffic IN
  #   ingressFromAll — allow ingress from all services in the namespace (use sparingly)
  #   egressTo       — list of service keys this service is allowed to call
  #   allowRds       — adds egress rule to reach RDS on network.rds.cidr:3306
  #   allowEureka    — adds egress rule to reach discoveryServer
  #   allowConfig    — adds egress rule to reach configServer
  #   istioIngress   — adds ingress rule from the Istio ingress gateway
  #   allowPrometheus— adds ingress rule allowing Prometheus to scrape metrics
  services:
    adminServer:
      label: admin-server
      port: 9090
      # Admin server receives traffic from all internal services for health dashboards
      ingressFromAll: true
      allowEureka: true
      allowConfig: true
      allowPrometheus: true

    apiGateway:
      label: api-gateway
      port: 8080
      # External traffic enters via Istio ingress gateway
      istioIngress: true
      # apiGateway fans out to all business services
      egressTo:
        - customersService
        - visitsService
        - vetsService
        - genaiService
      allowEureka: true
      allowConfig: true
      allowPrometheus: true

    configServer:
      label: config-server
      port: 8888
      # All services pull config from configServer at startup
      # ingressFromAll covers this without listing every service
      ingressFromAll: true
      allowPrometheus: true

    discoveryServer:
      label: discovery-server
      port: 8761
      # All services register with Eureka
      ingressFromAll: true
      # discoveryServer itself fetches config at startup
      allowConfig: true
      allowPrometheus: true

    customersService:
      label: customers-service
      port: 8081
      ingressFrom:
        - apiGateway
        - adminServer
      allowRds: true
      allowEureka: true
      allowConfig: true
      allowPrometheus: true

    visitsService:
      label: visits-service
      port: 8082
      ingressFrom:
        - apiGateway
        - adminServer
      allowRds: true
      allowEureka: true
      allowConfig: true
      allowPrometheus: true

    vetsService:
      label: vets-service
      port: 8083
      ingressFrom:
        - apiGateway
        - adminServer
      allowRds: true
      allowEureka: true
      allowConfig: true
      allowPrometheus: true

    genaiService:
      label: genai-service
      port: 8084
      ingressFrom:
        - apiGateway
        - adminServer
      # genaiService does not use RDS — it has its own vector store
      allowRds: false
      allowEureka: true
      allowConfig: true
      allowPrometheus: true