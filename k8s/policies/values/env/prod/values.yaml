clusterPolicy:
  network:
    istioIngress:
      label: public-istio-ingressgateway
      serviceAccount: public-ingressgateway-sa
      namespace: istio-ingress

    rds:
      cidr: 
        - ipBlock:
            cidr: 10.0.21.0/24
        - ipBlock:
            cidr: 10.0.22.0/24
      port: 3306

    prometheus:
      label: prometheus
      namespace: monitoring
      port: 8080

  kyverno:
    ecr:
      accountId: "509194952955"
      region: "us-east-2"
      prefix: "petclinic"

    github:
      org: "silasfrancis"
      repo: "eks-platform-petclinic"
      branch: "main"
      tokenIssuer: https://token.actions.githubusercontent.com
      authorizedWorkflows:
        - build-push.yaml
        - build-migrations.yaml