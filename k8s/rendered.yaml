apiVersion: policies.kyverno.io/v1
kind: NamespacedValidatingPolicy
metadata:
  name: restrict-image-registries
  namespace: petclinic
  labels:
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/part-of: platform-policies
    policy.kyverno.io/version: v1
spec:
  webhookConfiguration:
    timeoutSeconds: 15
  evaluation:
    admission: { enabled: true }
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE']
        resources: ['pods']

  variables:
    - name: allowedRegistries
      expression: >-
        [
          "509194952955.dkr.ecr.us-east-2.amazonaws.com/petclinic/", 
          "docker.io/istio/",
          "gcr.io/istio-release/",
          "quay.io/kiwigrid/"
        ]

  validations:
    - message: 'Image must be from an approved registry'
      expression: >-
        object.spec.containers.all(c,
          variables.allowedRegistries.exists(r, c.image.startsWith(r))
        )
