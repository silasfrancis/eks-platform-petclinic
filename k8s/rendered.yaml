# Source: policies/templates/kyverno/verify-image-provenance.yaml
apiVersion: policies.kyverno.io/v1
kind: NamespacedImageValidatingPolicy
metadata:
  name: verify-image-provenance
  namespace: petclinic
  labels:
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/part-of: platform-policies
    policy.kyverno.io/version: v1
spec:
  webhookConfiguration:
    timeoutSeconds: 15
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
    mode: Kubernetes
  validationActions: [Deny]
  failurePolicy: Fail
  validationConfigurations:
    mutateDigest: true
    required: true
    verifyDigest: true
  matchConstraints:                          
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']                  
        operations: ['CREATE', 'UPDATE']
        resources: ['pods']
  credentials:
    allowInsecureRegistry: false
    providers:
      - amazon
  matchImageReferences:
    - glob: "509194952955.dkr.ecr.us-east-2.amazonaws.com/petclinic/*"
  
  attestors:
    
    - name: attestor-0
      cosign:
        keyless:
          identities:
            - subject: "https://github.com/silasfrancis/eks-platform-petclinic/.github/workflows/build-push.yaml@refs/heads/main"
              issuer: "https://token.actions.githubusercontent.com"
        ctlog:
          url: 'https://rekor.sigstore.dev'
    - name: attestor-1
      cosign:
        keyless:
          identities:
            - subject: "https://github.com/silasfrancis/eks-platform-petclinic/.github/workflows/build-migrations.yaml@refs/heads/main"
              issuer: "https://token.actions.githubusercontent.com"
        ctlog:
          url: 'https://rekor.sigstore.dev'

  attestations:
    - name: vulnScan
      intoto:
        type: cosign.sigstore.dev/attestation/vuln/v1

  validations:
    - message: 'Container Images must be signed by an authorized GitHub workflow'
      expression: >-
        images.containers.map(image,
          verifyImageSignatures(image, [attestors['attestor-0']]) > 0 || verifyImageSignatures(image, [attestors['attestor-1']]) > 0
        ).all(e, e)

    - message: 'Init container image must be signed by an authorized GitHub workflow'
      expression: >-
        !has(object.spec.initContainers) ||
        images.initContainers.map(image,
          verifyImageSignatures(image, [attestors['attestor-0']]) > 0 || verifyImageSignatures(image, [attestors['attestor-1']]) > 0
        ).all(e, e)

    - message: "Container Images must have a verified vulnerability scan attestation from an authorized GitHub workflow."
      expression: >-
        images.containers.map(image,
          verifyAttestationSignatures(image, attestations.vulnScan, [attestors['attestor-0']]) > 0 || verifyAttestationSignatures(image, attestations.vulnScan, [attestors['attestor-1']]) > 0
        ).all(e, e)

    - message: "Init container image must have a verified vulnerability scan attestation from an authorized GitHub workflow."
      expression: >-
        !has(object.spec.initContainers) ||
        images.initContainers.map(image,
          verifyAttestationSignatures(image, attestations.vulnScan, [attestors['attestor-0']]) > 0 || verifyAttestationSignatures(image, attestations.vulnScan, [attestors['attestor-1']]) > 0
        ).all(e, e)
---
# Source: policies/templates/kyverno/mutation-security-defaults.yaml
apiVersion: policies.kyverno.io/v1
kind: NamespacedMutatingPolicy
metadata:
  name: security-and-label-mutation
  namespace: petclinic
spec:
  evaluation:
    admission:
      enabled: true

  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]

  variables:
    - name: mainContainerName
      expression: >-
        object.spec.containers.filter(c, 
          c.name != 'istio-proxy' && 
          c.name != 'istio-init' && 
          c.name != 'queue-proxy'
        ).size() > 0
        ? object.spec.containers.filter(c, 
            c.name != 'istio-proxy' && 
            c.name != 'istio-init' && 
            c.name != 'queue-proxy'
          )[0].name
        : "unknown"

  mutations:

    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          variables.mainContainerName == "unknown" ? Object{} : Object{
            metadata: Object{
              labels: (has(object.metadata.labels) ? object.metadata.labels : {}).merge({
                "app.kubernetes.io/name": variables.mainContainerName,
                "app": variables.mainContainerName,
                "environment": "main"
              })
            }
          }

    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object{
              containers: object.spec.containers.map(c,
                c.name == 'istio-proxy' || c.name == 'istio-init' || c.name == 'queue-proxy'
                ? c
                : Object{
                    name: c.name,
                    securityContext: (has(c.securityContext) ? c.securityContext : {}) + {
                      "runAsNonRoot": true,
                      "privileged": false,
                      "allowPrivilegeEscalation": false,
                      "readOnlyRootFilesystem": true,
                      "capabilities": {
                        "drop": ["ALL"]
                      },
                      "seccompProfile": {
                        "type": "RuntimeDefault"
                      }
                    }
                  }
              )
            }
          }

    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object{
              hostNetwork: false,
              hostPID: false,
              hostIPC: false,
              securityContext: (has(object.spec.securityContext) ? object.spec.securityContext : {}) + {
                "runAsNonRoot": true,
                "seccompProfile": {
                  "type": "RuntimeDefault"
                }
              }
            }
          }
---
# Source: policies/templates/kyverno/network-policy-governance.yaml
apiVersion: policies.kyverno.io/v1
kind: NamespacedValidatingPolicy
metadata:
  name: network-policy-governance
  namespace: petclinic
  labels:
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/part-of: platform-policies
    policy.kyverno.io/version: v1
spec:
  webhookConfiguration:
    timeoutSeconds: 15
  validationActions: [Deny]
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ['networking.k8s.io']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE', 'DELETE']
        resources: ['networkpolicies']
  
  validations:
    - message: 'NetworkPolicies must have a "protected" label set to "true" or "false"'
      expression: >-
        request.operation == 'DELETE' || (
          has(object.metadata.labels) &&
          has(object.metadata.labels.protected) &&
          (object.metadata.labels.protected == "true" || object.metadata.labels.protected == "false")
        )

    - message: 'This NetworkPolicy is protected and cannot be deleted, set policy label.protected=false to delete'
      expression: >-
        request.operation != 'DELETE' || !(
          has(object.metadata.labels) &&
          has(object.metadata.labels.protected) &&
          object.metadata.labels.protected == "true"
        )
---
# Source: policies/templates/kyverno/pod-security.yaml
apiVersion: policies.kyverno.io/v1
kind: NamespacedValidatingPolicy
metadata:
  name: pod-security
  namespace: petclinic
  labels:
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/part-of: platform-policies
    policy.kyverno.io/version: v1
spec:
  webhookConfiguration:
    timeoutSeconds: 15
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
    mode: Kubernetes
  validationActions: [Deny]
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE']
        resources: ['pods']

  variables:
    - name: appContainers
      expression: >-
        object.spec.containers.filter(c,
          !c.image.contains('istio-proxy') &&
          !c.image.contains('istio-pilot')
        )

  validations:
    - message: 'Privileged containers or host access (Network/PID/IPC) not allowed'
      expression: >-
        variables.appContainers.all(c, 
          !has(c.securityContext) || !has(c.securityContext.privileged) || c.securityContext.privileged == false
        ) &&
        (!has(object.spec.hostNetwork) || object.spec.hostNetwork == false) &&
        (!has(object.spec.hostPID) || object.spec.hostPID == false) &&
        (!has(object.spec.hostIPC) || object.spec.hostIPC == false)

    - message: 'Containers must run as non-root (check Pod or Container level)'
      expression: >-
        variables.appContainers.all(c,
          (has(c.securityContext) && c.securityContext.runAsNonRoot == true) ||
          (has(object.spec.securityContext) && object.spec.securityContext.runAsNonRoot == true)
        )

    - message: 'hostPath volumes and default service accounts are forbidden'
      expression: >-
        (!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))) &&
        (has(object.spec.serviceAccountName) && object.spec.serviceAccountName != "default")

    - message: 'Resources: Memory limits and CPU/Memory requests are required'
      expression: >-
        variables.appContainers.all(c,
          has(c.resources.requests.memory) &&
          has(c.resources.requests.cpu) &&
          has(c.resources.limits.memory)
        )

    - message: 'Security: Privilege escalation forbidden and ALL capabilities must be dropped'
      expression: >-
        variables.appContainers.all(c,
          (!has(c.securityContext.allowPrivilegeEscalation) || c.securityContext.allowPrivilegeEscalation == false) &&
          has(c.securityContext.capabilities.drop) &&
          c.securityContext.capabilities.drop.exists(d, d == "ALL") &&
          !has(c.securityContext.capabilities.add)
        )
---
