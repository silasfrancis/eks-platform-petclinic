server:
  port: 8761

eureka:
  instance:
    # Use ENV var if provided, otherwise default to 'discovery-server' 
    # (works for both local Docker and K8s internal DNS)
    hostname: ${EUREKA_INSTANCE_HOSTNAME:discovery-server}
  
  # Standalone mode
  client:
    registerWithEureka: false
    fetchRegistry: false
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://${eureka.instance.hostname}:${server.port}}/eureka/