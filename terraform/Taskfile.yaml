# Terraform operations per environment.
#
# Backend config is partial — bucket, key and region live in state.conf
# per environment. This avoids hardcoding backend config in main.tf.
#
# Usage:
#   task tf:init ENV=dev
#   task tf:plan ENV=dev
#   task tf:apply ENV=dev
#   task tf:destroy ENV=dev 

version: "3"

vars:
  ENV: '{{.ENV | default "dev"}}'

tasks:

  init:
    desc: "Initialise backend for {{.ENV}}"
    dir: env/{{.ENV}}
    cmds:
      - terraform init -backend-config="state.conf" -reconfigure

  validate:
    desc: "Validate configuration"
    dir: env/{{.ENV}}
    cmds:
      - terraform validate

  fmt:
    desc: "Fix formatting"
    cmds:
      - terraform fmt -recursive

  plan:
    desc: "Create execution plan"
    dir: env/{{.ENV}}
    cmds:
      - terraform plan -var-file="terraform.tfvars" -out=tfplan

  apply:
    desc: "Apply execution plan"
    dir: env/{{.ENV}}
    cmds:
      - terraform apply tfplan
    preconditions:
      - sh: "[ -f env/{{.ENV}}/tfplan ]"
        msg: "Run 'task tf:plan' first"

  destroy:
    desc: "Teardown infrastructure"
    dir: env/{{.ENV}}
    prompt: "Are you sure you want to destroy {{.ENV}}?"
    cmds:
      - terraform destroy -var-file="terraform.tfvars"

  output:
    desc: "Show outputs"
    dir: env/{{.ENV}}
    cmds:
      - terraform output