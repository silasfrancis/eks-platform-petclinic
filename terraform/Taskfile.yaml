version: "3"
vars:
  ENV: '{{.ENV | default "dev"}}'
  ENV_DIR: "env/{{.ENV}}"
  BOOTSTRAP_DIR: "env/global/bootstrap"
  APP_REGISTRY_DIR: "env/global/app-registry"
  WIREGUARD_DIR: "env/global/networking/wireguard"
  TRANSIT_GATEWAY_DIR: "env/global/networking/transit-gateway"
  TF_VARS: "terraform.tfvars"
  TF_PLAN: "tfplan"

tasks:

  bootstrap:
    desc: "Bootstrap Terraform backend infrastructure"
    summary: |
      Bootstraps the remote Terraform state backend infrastructure.

        IMPORTANT:
          This stack creates the S3 backend bucket used by all other Terraform environments.

          Because the backend infrastructure does not yet exist during the
          first deployment, you have two options:

          1. Use an already existing temporary S3 backend bucket with:
              terraform init -backend-config="state.conf" -reconfigure

          2. Temporarily remove/comment the backend configuration from:
              global/bootstrap/providers.tf

            and also remove:
              -backend-config="state.conf" -reconfigure 

            from this bootstrap task so Terraform uses local state.

          After the bootstrap resources are created:
            - restore the backend configuration
            - re-run terraform init with the new backend
            - migrate local state into the newly created backend

    dir: "{{.BOOTSTRAP_DIR}}"
    cmds:
      - terraform init -backend-config="state.conf" -reconfigure
      - terraform validate
      - terraform plan -var-file="{{.TF_VARS}}" -out="{{.TF_PLAN}}"
      - terraform apply "{{.TF_PLAN }}"

  init:
    desc: "Initialise Terraform backend for {{.ENV}}"
    dir: "{{.ENV_DIR}}"
    cmds:
      - terraform init -backend-config="state.conf" -reconfigure

  validate:
    desc: "Validate Terraform configuration for {{.ENV}}"
    dir: "{{.ENV_DIR}}"
    cmds:
      - terraform validate

  fmt:
    desc: "Format all Terraform code"
    cmds:
      - terraform fmt -recursive

  plan:
    desc: "Create Terraform execution plan for {{.ENV}}"
    dir: "{{.ENV_DIR}}"
    cmds:
      - terraform plan -var-file="{{.TF_VARS}}" -out="{{.TF_PLAN}}"

  apply:
    desc: "Apply Terraform execution plan for {{.ENV}}"
    dir: "{{.ENV_DIR}}"
    preconditions:
      - sh: "[ -f {{.TF_PLAN}} ]"
        msg: "Run 'task tf:plan ENV={{.ENV}}' first"
    cmds:
      - terraform apply "{{.TF_PLAN}}"

  destroy:
    desc: "Destroy Terraform infrastructure for {{.ENV}}"
    dir: "{{.ENV_DIR}}"
    prompt: "Are you sure you want to destroy {{.ENV}}?"
    cmds:
      - terraform destroy -var-file="{{.TF_VARS}}"

  output:
    desc: "Show Terraform outputs for {{.ENV}}"
    dir: "{{.ENV_DIR}}"
    cmds:
      - terraform output

  app-registry:init:
    desc: "Initialise App Registry Terraform"
    dir: "{{.APP_REGISTRY_DIR}}"
    cmds:
      - terraform init -backend-config="state.conf" -reconfigure

  app-registry:validate:
    desc: "Validate App Registry Terraform"
    dir: "{{.APP_REGISTRY_DIR}}"
    cmds:
      - terraform validate

  app-registry:plan:
    desc: "Plan App Registry infrastructure"
    dir: "{{.APP_REGISTRY_DIR}}"
    cmds:
      - terraform plan -var-file="{{.TF_VARS}}" -out="{{.TF_PLAN}}"

  app-registry:apply:
    desc: "Apply App Registry infrastructure"
    dir: "{{.APP_REGISTRY_DIR}}"
    preconditions:
      - sh: "[ -f {{.TF_PLAN}} ]"
        msg: "Run 'task tf:app-registry:plan' first"
    cmds:
      - terraform apply "{{.TF_PLAN}}"

  app-registry:destroy:
    desc: "Destroy App Registry infrastructure"
    dir: "{{.APP_REGISTRY_DIR}}"
    prompt: "Are you sure you want to destroy App Registry infrastructure?"
    cmds:
      - terraform destroy -var-file="{{.TF_VARS}}"

  wireguard:init:
    desc: "Initialise WireGuard Terraform"
    dir: "{{.WIREGUARD_DIR}}"
    cmds:
      - terraform init -backend-config="state.conf" -reconfigure

  wireguard:validate:
    desc: "Validate WireGuard Terraform"
    dir: "{{.WIREGUARD_DIR}}"
    cmds:
      - terraform validate

  wireguard:plan:
    desc: "Plan WireGuard infrastructure"
    dir: "{{.WIREGUARD_DIR}}"
    cmds:
      - terraform plan -var-file="{{.TF_VARS}}" -out="{{.TF_PLAN}}"

  wireguard:apply:
    desc: "Apply WireGuard infrastructure"
    dir: "{{.WIREGUARD_DIR}}"
    preconditions:
      - sh: "[ -f {{.TF_PLAN}} ]"
        msg: "Run 'task tf:wireguard:plan' first"
    cmds:
      - terraform apply "{{.TF_PLAN}}"

  wireguard:destroy:
    desc: "Destroy WireGuard infrastructure"
    dir: "{{.WIREGUARD_DIR}}"
    prompt: "Are you sure you want to destroy WireGuard infrastructure?"
    cmds:
      - terraform destroy -var-file="{{.TF_VARS}}"

  transit-gateway:init:
    desc: "Initialise Transit Gateway Terraform"
    dir: "{{.TRANSIT_GATEWAY_DIR}}"
    cmds:
      - terraform init -backend-config="state.conf" -reconfigure

  transit-gateway:validate:
    desc: "Validate Transit Gateway Terraform"
    dir: "{{.TRANSIT_GATEWAY_DIR}}"
    cmds:
      - terraform validate

  transit-gateway:plan:
    desc: "Plan Transit Gateway infrastructure"
    dir: "{{.TRANSIT_GATEWAY_DIR}}"
    cmds:
      - terraform plan -var-file="{{.TF_VARS}}" -out="{{.TF_PLAN}}"

  transit-gateway:apply:
    desc: "Apply Transit Gateway infrastructure"
    dir: "{{.TRANSIT_GATEWAY_DIR}}"
    preconditions:
      - sh: "[ -f {{.TF_PLAN}} ]"
        msg: "Run 'task tf:transit-gateway:plan' first"
    cmds:
      - terraform apply "{{.TF_PLAN}}"

  transit-gateway:destroy:
    desc: "Destroy Transit Gateway infrastructure"
    dir: "{{.TRANSIT_GATEWAY_DIR}}"
    prompt: "Are you sure you want to destroy Transit Gateway infrastructure?"
    cmds:
      - terraform destroy -var-file="{{.TF_VARS}}"
