# Terraform operations per environment.
#
# Backend configuration is partial — bucket, key and region live in
# state.conf per environment to avoid hardcoding backend settings.
#
# Usage:
#   task tf:bootstrap
#   task tf:resources:init
#   task tf:init ENV=dev
#   task tf:plan ENV=dev
#   task tf:apply ENV=dev

version: "3"

vars:
  ENV: '{{.ENV | default "dev"}}'

  ENV_DIR: "env/{{.ENV}}"

  SHARED_BOOTSTRAP_DIR: "env/global/bootstrap"
  SHARED_NETWORKING_DIR: "env/global/networking"
  SHARED_RESOURCES_DIR: "env/global/resources"

  TF_VARS: "terraform.tfvars"
  TF_PLAN: "tfplan"

tasks:

  bootstrap:
    desc: "Bootstrap Terraform state backend for any environment"
    dir: "{{.SHARED_BOOTSTRAP_DIR}}"
    cmds:
      - terraform init
      - terraform validate
      - terraform plan -var-file="{{.TF_VARS}}" -out="{{.TF_PLAN}}"
      - terraform apply "{{.TF_PLAN}}"

  init:
    desc: "Initialise Terraform backend for {{.ENV}}"
    dir: "{{.ENV_DIR}}"
    cmds:
      - terraform init -backend-config="state.conf" -reconfigure

  validate:
    desc: "Validate Terraform configuration for {{.ENV}}"
    dir: "{{.ENV_DIR}}"
    cmds:
      - terraform validate

  fmt:
    desc: "Format all Terraform code"
    cmds:
      - terraform fmt -recursive

  plan:
    desc: "Create Terraform execution plan for {{.ENV}}"
    dir: "{{.ENV_DIR}}"
    cmds:
      - terraform plan -var-file="{{.TF_VARS}}" -out="{{.TF_PLAN}}"

  apply:
    desc: "Apply Terraform execution plan for {{.ENV}}"
    dir: "{{.ENV_DIR}}"
    preconditions:
      - sh: "[ -f {{.TF_PLAN}} ]"
        msg: "Run 'task tf:plan ENV={{.ENV}}' first"
    cmds:
      - terraform apply "{{.TF_PLAN}}"

  destroy:
    desc: "Destroy Terraform infrastructure for {{.ENV}}"
    dir: "{{.ENV_DIR}}"
    prompt: "Are you sure you want to destroy {{.ENV}}?"
    cmds:
      - terraform destroy -var-file="{{.TF_VARS}}"

  output:
    desc: "Show Terraform outputs for {{.ENV}}"
    dir: "{{.ENV_DIR}}"
    cmds:
      - terraform output

  resources:init:
    desc: "Initialise shared resources Terraform"
    dir: "{{.SHARED_RESOURCES_DIR}}"
    cmds:
      - terraform init -backend-config="state.conf" -reconfigure

  resources:validate:
    desc: "Validate shared resources Terraform"
    dir: "{{.SHARED_RESOURCES_DIR}}"
    cmds:
      - terraform validate

  resources:plan:
    desc: "Plan shared platform resources"
    dir: "{{.SHARED_RESOURCES_DIR}}"
    cmds:
      - terraform plan -var-file="{{.TF_VARS}}" -out="{{.TF_PLAN}}"

  resources:apply:
    desc: "Apply shared platform resources"
    dir: "{{.SHARED_RESOURCES_DIR}}"
    preconditions:
      - sh: "[ -f {{.TF_PLAN}} ]"
        msg: "Run 'task tf:resources:plan' first"
    cmds:
      - terraform apply "{{.TF_PLAN}}"

  resources:destroy:
    desc: "Destroy shared platform resources"
    dir: "{{.SHARED_RESOURCES_DIR}}"
    prompt: "Are you sure you want to destroy shared platform resources?"
    cmds:
      - terraform destroy -var-file="{{.TF_VARS}}"

  networking:init:
    desc: "Initialise shared networking Terraform"
    dir: "{{.SHARED_NETWORKING_DIR}}"
    cmds:
      - terraform init -backend-config="state.conf" -reconfigure

  networking:validate:
    desc: "Validate shared networking Terraform"
    dir: "{{.SHARED_NETWORKING_DIR}}"
    cmds:
      - terraform validate

  networking:plan:
    desc: "Plan shared networking infrastructure"
    dir: "{{.SHARED_NETWORKING_DIR}}"
    cmds:
      - terraform plan -var-file="{{.TF_VARS}}" -out="{{.TF_PLAN}}"

  networking:apply:
    desc: "Apply shared networking infrastructure"
    dir: "{{.SHARED_NETWORKING_DIR}}"
    preconditions:
      - sh: "[ -f {{.TF_PLAN}} ]"
        msg: "Run 'task tf:networking:plan' first"
    cmds:
      - terraform apply "{{.TF_PLAN}}"

  networking:destroy:
    desc: "Destroy shared networking infrastructure"
    dir: "{{.SHARED_NETWORKING_DIR}}"
    prompt: "Are you sure you want to destroy shared networking?"
    cmds:
      - terraform destroy -var-file="{{.TF_VARS}}"